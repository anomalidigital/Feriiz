<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feriiz - Calendar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=3.5.0">
    <script src="assets/js/data.js?v=3.5.0" defer></script>
    <script src="assets/js/app.js?v=3.5.0" defer></script>
</head>
<body data-page="calendar">
    <aside class="sidebar"></aside>

    <main class="main-content">
        <div class="cal-header-bar">
            <div class="cal-header-left">
                <h1 class="cal-title"><i class="fa-regular fa-calendar feriiz-u-001"></i>Calendar</h1>
            </div>
            <div class="cal-header-right">
                <div class="cal-filter-wrap">
                    <button class="cal-filter-btn" id="filterToggle" title="Filter"><i class="fa-solid fa-filter"></i></button>
                    <div class="cal-filter-dropdown" id="filterDropdown">
                        <div class="f-title">Filter Calendar</div>
                        <label>Date Range</label>
                        <div class="feriiz-u-003">
                            <input type="date" id="filterDateFrom" class="feriiz-u-004">
                            <span class="feriiz-u-005">-</span>
                            <input type="date" id="filterDateTo" class="feriiz-u-004">
                        </div>
                        <label>Type</label>
                        <select id="filterType">
                            <option value="">-- All Types --</option>
                            <option value="work">Remote Work</option>
                            <option value="leave">Cuti (Leave)</option>
                            <option value="sick">Sakit (Sick)</option>
                            <option value="other">Libur & Lainnya</option>
                        </select>
                        <label>Status</label>
                        <select id="filterStatus">
                            <option value="">-- All Status --</option>
                            <option value="Accepted">Accepted</option>
                            <option value="Pending">Pending</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                        <div class="cal-filter-actions">
                            <button class="f-btn-clear" onclick="clearFilter()">Clear</button>
                            <button class="f-btn-apply" onclick="applyFilter()">Apply</button>
                        </div>
                    </div>
                </div>
                <div class="cal-search-wrap">
                    <i class="fa-solid fa-magnifying-glass cal-search-icon"></i>
                    <input type="text" id="calendarEmployeeSearch" class="cal-search-input" placeholder="Search employee" autocomplete="off">
                </div>
            </div>
        </div>
        <div class="calendar-layout">
            <aside class="request-panel" aria-label="Request overview">
                <div class="request-panel-head">
                    <div class="request-title-row">
                        <div class="request-title"><i class="fa-solid fa-clipboard-list"></i>Request</div>
                        <div class="request-count-pill" id="requestCountPill">0 Request</div>
                    </div>
                    <div class="request-toggle">
                        <button class="active" type="button" onclick="setRequestView(this,'today')">Today</button>
                        <button type="button" onclick="setRequestView(this,'month')">Month</button>
                    </div>
                    <div class="request-search-wrap">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="requestSearch" placeholder="Search request" autocomplete="off">
                    </div>
                    <div class="request-chip-row">
                        <button type="button" class="request-chip active" data-status="all" onclick="setRequestStatus(this,'all')">All</button>
                        <button type="button" class="request-chip" data-status="Pending" onclick="setRequestStatus(this,'Pending')">Pending</button>
                        <button type="button" class="request-chip" data-status="Accepted" onclick="setRequestStatus(this,'Accepted')">Accepted</button>
                    </div>
                </div>
                <div class="request-summary" id="requestSummary"></div>
                <div class="request-list" id="requestList"></div>
            </aside>

            <section class="calendar-board">
                <div class="calendar-board-top">
                    <div class="cal-month-label" id="calMonthTitle">May 2026</div>
                    <div class="cal-nav">
                        <button class="cal-today-btn" onclick="goToday()">Today</button>
                        <button class="cal-nav-btn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                        <button class="cal-nav-btn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <!-- Legend -->
                <div class="calendar-legend">
                    <div class="calendar-legend-item"><span class="feriiz-u-006"></span> Remote Work</div>
                    <div class="calendar-legend-item"><span class="feriiz-u-007"></span> Cuti (Leave)</div>
                    <div class="calendar-legend-item"><span class="feriiz-u-008"></span> Sakit (Sick)</div>
                    <div class="calendar-legend-item"><span class="feriiz-u-009"></span> Libur & Lainnya</div>
                </div>
                <div class="cal-grid" id="calGrid"></div>
                <div class="feriiz-u-010">version : 3.5.0</div>
            </section>
        </div>
    </main>

    <!-- Overlay -->
    <div class="cal-overlay" id="calOverlay" onclick="if(event.target===this)closeOverlay()">
        <div class="cal-detail">
            <div class="cal-detail-header">
                <h3 id="overlayTitle">Sick Leave - Tue, 13 May 2026</h3>
                <button class="cal-detail-close" onclick="closeOverlay()">&times;</button>
            </div>
            <div class="cal-detail-body" id="overlayBody"></div>
        </div>
    </div>

    <script>
        // Populated from FERIIZ_DATA once the dataset resolves.
        let EVENTS = [];
        let HOLIDAYS = [];

        function catFromType(type) {
            var t = (type || '').toLowerCase();
            if (t.indexOf('sick') >= 0) return 'sick';
            if (t.indexOf('remote') >= 0) return 'work';
            if (t.indexOf('leave') >= 0 || t.indexOf('permission') >= 0) return 'leave';
            return 'other';
        }
        function buildEventsFromData(data) {
            var out = [];
            for (var i = 0; i < data.requests.length; i++) {
                var r = data.requests[i];
                var emp = data.findEmployeeByCode(r.employeeCode);
                if (!emp) continue;
                out.push({
                    name: emp.name,
                    type: r.type,
                    cat: catFromType(r.type),
                    project: r.projectCode,
                    dateStart: r.dateStart,
                    dateEnd: r.dateEnd || r.dateStart,
                    status: r.status,
                    pic: r.pic || ''
                });
            }
            return out;
        }
        const DEFAULT_HOLIDAY_OVERRIDES = [
            { date:'2026-05-14', status:'working', note:'Tetap masuk kerja sesuai kebijakan perusahaan.' }
        ];
        let HOLIDAY_OVERRIDES = loadHolidayOverrides();
        const CAT_LABELS = { work:'Remote Work', leave:'Cuti (Leave)', sick:'Sakit (Sick)', other:'Libur' };
        const CAT_CSS = { work:'cat-work-bg', leave:'cat-leave-bg', sick:'cat-sick-bg', other:'cat-other-bg' };

        const PROJECTS = [
            { id:'ANM001', label:'Anomali' },
            { id:'DCG015', label:'Diamond Crystal Golf No. 15' },
            { id:'DGH105', label:'Diamond Golf H3 No. 105' },
        ];
        let currentYear=2026, currentMonth=4;
        let activeFilter = { type:'', status:'', dateFrom:'', dateTo:'' };
        let requestView = 'today';
        let requestStatus = 'all';
        let requestSearchQuery = '';
        let calendarSearchQuery = '';

        const calendarEmployeeSearch = document.getElementById('calendarEmployeeSearch');

        const requestSearch = document.getElementById('requestSearch');

        calendarEmployeeSearch.addEventListener('input', () => {
            calendarSearchQuery = calendarEmployeeSearch.value.trim().toLowerCase();
            renderCalendar();
            renderRequestPanel();
        });

        requestSearch.addEventListener('input', () => {
            requestSearchQuery = requestSearch.value.trim().toLowerCase();
            renderRequestPanel();
        });

        // === Filter ===
        const filterToggle = document.getElementById('filterToggle');
        const filterDropdown = document.getElementById('filterDropdown');
        filterToggle.addEventListener('click', (e) => { e.stopPropagation(); filterDropdown.classList.toggle('show'); filterToggle.classList.toggle('active'); });
        filterDropdown.addEventListener('click', (e) => e.stopPropagation());
        document.addEventListener('click', () => { filterDropdown.classList.remove('show'); filterToggle.classList.remove('active'); });

        function applyFilter() {
            activeFilter.type = document.getElementById('filterType').value;
            activeFilter.status = document.getElementById('filterStatus').value;
            activeFilter.dateFrom = document.getElementById('filterDateFrom').value;
            activeFilter.dateTo = document.getElementById('filterDateTo').value;
            filterDropdown.classList.remove('show');
            filterToggle.classList.toggle('active', !!(activeFilter.type||activeFilter.status||activeFilter.dateFrom||activeFilter.dateTo));
            renderCalendar();
            renderRequestPanel();
        }
        function clearFilter() {
            document.getElementById('filterType').value = '';
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterDateFrom').value = '';
            document.getElementById('filterDateTo').value = '';
            applyFilter();
        }

        function getFilteredEvents() {
            let ev = [...EVENTS];
            if (calendarSearchQuery) {
                ev = ev.filter(e => e.name.toLowerCase().includes(calendarSearchQuery));
            }
            if (activeFilter.type) ev = ev.filter(e => e.cat === activeFilter.type);
            if (activeFilter.status) ev = ev.filter(e => e.status === activeFilter.status);
            if (activeFilter.dateFrom) ev = ev.filter(e => e.dateEnd >= activeFilter.dateFrom);
            if (activeFilter.dateTo) ev = ev.filter(e => e.dateStart <= activeFilter.dateTo);
            return ev;
        }

        function renderCalendar() {
            const grid = document.getElementById('calGrid');
            const mn = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            document.getElementById('calMonthTitle').textContent = mn[currentMonth] + ' ' + currentYear;
            const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            let html = days.map(d=>`<div class="cal-day-header">${d}</div>`).join('');
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const dim = new Date(currentYear, currentMonth+1, 0).getDate();
            const prevDim = new Date(currentYear, currentMonth, 0).getDate();
            const today = new Date();
            const events = getFilteredEvents();

            for(let i=firstDay-1;i>=0;i--) html+=`<div class="cal-cell other-month"><div class="cal-date">${prevDim-i}</div></div>`;
            for(let d=1;d<=dim;d++){
                const ds=`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dow=new Date(currentYear,currentMonth,d).getDay();
                const isToday=today.getFullYear()===currentYear&&today.getMonth()===currentMonth&&today.getDate()===d;
                let cls='cal-cell';
                if(isToday)cls+=' today';
                if(dow===0||dow===6)cls+=' weekend';
                const dayEv=events.filter(e=>e.dateStart<=ds&&e.dateEnd>=ds);
                const dayH=HOLIDAYS.filter(h=>h.date===ds);
                let inner=`<div class="cal-date">${d}</div>`;
                dayH.forEach(h=>{
                    const override = getHolidayOverride(h.date);
                    const isWorking = override && override.status === 'working';
                    const label = isWorking ? `${h.name} - Company Working` : h.name;
                    inner+=`<div class="cal-holiday-bar ${isWorking ? 'company-working' : ''}" onclick="event.stopPropagation();showHolidayDetail('${h.name}','${h.date}')">${label}</div>`;
                });
                dayEv.forEach(e => {
                    const eventIndex = EVENTS.indexOf(e);
                    inner += `<div class="cal-count-badge cal-person-event ${CAT_CSS[e.cat]}" onclick="event.stopPropagation();showEventDetailByIndex(${eventIndex})"><span class="badge-dot"></span>${e.name} | ${e.type}</div>`;
                });
                html+=`<div class="${cls}">${inner}</div>`;
            }
            const tot=firstDay+dim; const rem=(7-(tot%7))%7;
            for(let i=1;i<=rem;i++) html+=`<div class="cal-cell other-month"><div class="cal-date">${i}</div></div>`;
            grid.innerHTML=html;
        }

        function changeMonth(dir){currentMonth+=dir;if(currentMonth>11){currentMonth=0;currentYear++;}if(currentMonth<0){currentMonth=11;currentYear--;}renderCalendar();renderRequestPanel();}
        function goToday(){const t=new Date();currentYear=t.getFullYear();currentMonth=t.getMonth();renderCalendar();renderRequestPanel();}

        function setRequestView(btn, view) {
            requestView = view;
            btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderRequestPanel();
        }

        function setRequestStatus(btn, status) {
            requestStatus = status;
            btn.parentElement.querySelectorAll('.request-chip').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderRequestPanel();
        }

        function getRequestScopeEvents() {
            const events = getFilteredEvents();
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
            const monthStart = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-01`;
            const monthEnd = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(new Date(currentYear,currentMonth+1,0).getDate()).padStart(2,'0')}`;
            let scoped = requestView === 'today'
                ? events.filter(e => e.dateStart <= todayStr && e.dateEnd >= todayStr)
                : events.filter(e => e.dateStart <= monthEnd && e.dateEnd >= monthStart);

            if (requestStatus !== 'all') scoped = scoped.filter(e => e.status === requestStatus);
            if (requestSearchQuery) {
                scoped = scoped.filter(e => {
                    const haystack = `${e.name} ${e.type} ${e.status} ${getProjectLabel(e.project)} ${e.pic}`.toLowerCase();
                    return haystack.includes(requestSearchQuery);
                });
            }
            return scoped.sort((a,b) => a.dateStart.localeCompare(b.dateStart) || a.name.localeCompare(b.name));
        }

        function renderRequestPanel() {
            const list = document.getElementById('requestList');
            const summary = document.getElementById('requestSummary');
            const pill = document.getElementById('requestCountPill');
            const scopedEvents = getRequestScopeEvents();
            const counts = {
                work: scopedEvents.filter(e => e.cat === 'work').length,
                leave: scopedEvents.filter(e => e.cat === 'leave').length,
                sick: scopedEvents.filter(e => e.cat === 'sick').length,
                pending: scopedEvents.filter(e => e.status === 'Pending').length
            };

            pill.textContent = `${scopedEvents.length} Request`;
            summary.innerHTML = `
                <div class="request-summary-card"><div class="summary-label"><span class="summary-dot feriiz-u-006"></span>Remote</div><div class="summary-number">${counts.work}</div></div>
                <div class="request-summary-card"><div class="summary-label"><span class="summary-dot feriiz-u-007"></span>Leave</div><div class="summary-number">${counts.leave}</div></div>
                <div class="request-summary-card"><div class="summary-label"><span class="summary-dot feriiz-u-008"></span>Sick</div><div class="summary-number">${counts.sick}</div></div>
                <div class="request-summary-card"><div class="summary-label"><span class="summary-dot feriiz-u-009"></span>Pending</div><div class="summary-number">${counts.pending}</div></div>
            `;

            if (scopedEvents.length === 0) {
                list.innerHTML = `<div class="request-empty"><i class="fa-regular fa-calendar-check"></i>No request for this view.</div>`;
                return;
            }

            list.innerHTML = scopedEvents.map(e => {
                const idx = EVENTS.indexOf(e);
                const statusClass = e.status === 'Accepted' ? 'badge-accepted' : e.status === 'Pending' ? 'badge-pending' : 'badge-rejected';
                return `
                    <button class="request-card cat-${e.cat}" type="button" onclick="showEventDetailByIndex(${idx})">
                        <div class="request-card-top">
                            <div>
                                <div class="request-card-name">${e.name}</div>
                                <div class="request-card-type">${e.type}</div>
                            </div>
                            <span class="badge-sm ${statusClass}">${e.status}</span>
                        </div>
                        <div class="request-card-meta">
                            <span><i class="fa-regular fa-calendar"></i> ${formatShortDate(e.dateStart)}</span>
                            <span class="request-project"><i class="fa-solid fa-clipboard"></i> ${getProjectLabel(e.project)}</span>
                        </div>
                    </button>
                `;
            }).join('');
        }

        function showList(cat, dateStr) {
            const events = getFilteredEvents().filter(e=>e.cat===cat&&e.dateStart<=dateStr&&e.dateEnd>=dateStr);
            const dt = new Date(dateStr+'T00:00:00');
            const dateLabel = dt.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
            document.getElementById('overlayTitle').textContent = `${CAT_LABELS[cat]} - ${dateLabel}`;
            let html='';
            events.forEach((e,i)=>{
                const sc=e.status==='Accepted'?'badge-accepted':e.status==='Pending'?'badge-pending':'badge-rejected';
                html+=`<div class="emp-list-item"><div class="emp-list-num">${i+1}</div><div class="emp-list-info"><div class="emp-list-name">${e.name}</div><div class="emp-list-sub"><span class="badge-sm ${sc}">${e.status}</span> - PIC: ${e.pic}</div></div></div>`;
            });
            html+=`<div class="total-bar">Total: ${events.length} employee${events.length>1?'s':''}</div>`;
            document.getElementById('overlayBody').innerHTML=html;
            document.getElementById('calOverlay').classList.add('show');
        }
        function showEventDetailByIndex(index) {
            const e = EVENTS[index];
            if (!e) return;
            const statusClass = e.status === 'Accepted' ? 'badge-accepted' : e.status === 'Pending' ? 'badge-pending' : 'badge-rejected';
            document.getElementById('overlayTitle').textContent = `${e.name} - ${e.type}`;
            document.getElementById('overlayBody').innerHTML = `
                <div class="cal-detail-row"><div class="cal-detail-label">Name</div><div class="cal-detail-value">: ${e.name}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Project</div><div class="cal-detail-value">: ${getProjectLabel(e.project)}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Type</div><div class="cal-detail-value">: ${e.type}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Date Start</div><div class="cal-detail-value">: ${formatDate(e.dateStart)}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Date End</div><div class="cal-detail-value">: ${formatDate(e.dateEnd)}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Status</div><div class="cal-detail-value">: <span class="badge-sm ${statusClass}">${e.status}</span></div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">PIC</div><div class="cal-detail-value">: ${e.pic || '-'}</div></div>
            `;
            document.getElementById('calOverlay').classList.add('show');
        }

        function getHolidayOverride(date) {
            return HOLIDAY_OVERRIDES.find(item => item.date === date);
        }

        function loadHolidayOverrides() {
            try {
                const saved = localStorage.getItem('feriizHolidayOverrides');
                return saved ? JSON.parse(saved) : [...DEFAULT_HOLIDAY_OVERRIDES];
            } catch (error) {
                return [...DEFAULT_HOLIDAY_OVERRIDES];
            }
        }

        function persistHolidayOverrides() {
            try {
                localStorage.setItem('feriizHolidayOverrides', JSON.stringify(HOLIDAY_OVERRIDES));
                return true;
            } catch (error) {
                return false;
            }
        }

        function showHolidayDetail(name, date) {
            const override = getHolidayOverride(date) || { status:'holiday', note:'' };
            const isWorking = override.status === 'working';
            document.getElementById('overlayTitle').textContent = `${name} - ${formatDate(date)}`;
            document.getElementById('overlayBody').innerHTML = `
                <div class="cal-detail-row"><div class="cal-detail-label">Holiday</div><div class="cal-detail-value">: ${name}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Date</div><div class="cal-detail-value">: ${formatDate(date)}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Gov. Status</div><div class="cal-detail-value">: <span class="badge-sm feriiz-u-009">Official Holiday</span></div></div>
                <div class="feriiz-u-011">
                    <label class="feriiz-u-012">Company Status</label>
                    <select id="holidayStatusInput" class="holiday-edit-field">
                        <option value="holiday" ${isWorking ? '' : 'selected'}>Company Holiday</option>
                        <option value="working" ${isWorking ? 'selected' : ''}>Company Working Day</option>
                    </select>
                </div>
                <div class="feriiz-u-013">
                    <label class="feriiz-u-012">Note</label>
                    <textarea id="holidayNoteInput" class="holiday-edit-field" rows="3" placeholder="Note">${override.note || ''}</textarea>
                </div>
                <button class="holiday-save-btn" onclick="saveHolidayOverride('${date}')">Save Override</button>
            `;
            document.getElementById('calOverlay').classList.add('show');
        }

        function saveHolidayOverride(date) {
            const status = document.getElementById('holidayStatusInput').value;
            const note = document.getElementById('holidayNoteInput').value.trim();
            const existing = getHolidayOverride(date);
            if (existing) {
                existing.status = status;
                existing.note = note;
            } else {
                HOLIDAY_OVERRIDES.push({ date, status, note });
            }
            if (!persistHolidayOverrides()) {
                if (window.FeriizNotify) FeriizNotify.error('The holiday override could not be stored. Please try again.', 'Override not saved');
                return;
            }
            renderCalendar();
            closeOverlay();
            if (window.FeriizNotify) {
                const label = status === 'working' ? 'Company Working Day' : 'Company Holiday';
                FeriizNotify.success(formatDate(date) + ' is now set as ' + label + '.', 'Holiday override saved');
            }
        }

        function getProjectLabel(id) {
            const project = PROJECTS.find(p => p.id === id);
            return project ? project.label : 'Unknown Project';
        }

        function formatDate(d) {
            const dt = new Date(d+'T00:00:00');
            return dt.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
        }

        function formatShortDate(d) {
            const dt = new Date(d+'T00:00:00');
            return dt.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short'});
        }

        function closeOverlay(){document.getElementById('calOverlay').classList.remove('show');}

        renderCalendar();
        renderRequestPanel();

        // Wait for deferred data.js to expose FERIIZ_DATA before hooking .ready.
        document.addEventListener('DOMContentLoaded', function () {
            if (!window.FERIIZ_DATA || !window.FERIIZ_DATA.ready) return;
            window.FERIIZ_DATA.ready.then(function (data) {
                EVENTS = buildEventsFromData(data);
                HOLIDAYS = data.holidays.map(function (h) { return { name: h.name, date: h.date }; });
                currentYear = 2026;
                currentMonth = 4; // Anchor demo view at May 2026 where sample data lives
                renderCalendar();
                renderRequestPanel();
            });
        });
    </script>
</body>
</html>
