<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feriiz - Employee Detail</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=3.5.7">
    <script src="assets/js/data.js?v=3.5.7" defer></script>
    <script src="assets/js/app.js?v=3.5.7" defer></script>
</head>

<body data-page="employee-detail">
    <!-- Sidebar -->
    <aside class="sidebar"></aside>

    <main class="main-content">

        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="employees.html">Employees</a>
            <span>&gt;</span>
            <span class="feriiz-u-057">Employee Detail</span>
        </div>

        <div class="page-header">
            <h1 class="page-title">Employee Detail</h1>
        </div>

        <div class="form-grid">

            <!-- Left Column -->
            <div>
                <!-- Personal Information -->
                <div class="form-section">
                    <div class="form-section-title">Personal Information</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" placeholder="First Name" value="Erik">
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" placeholder="Last Name" value="">
                        </div>
                        <div class="form-group">
                            <label>Occupation</label>
                            <input type="text" placeholder="Occupation" value="Graphic Design">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Pin</label>
                            <input type="text" placeholder="Pin" value="0032">
                        </div>
                        <div class="form-group">
                            <label>Date of Birth</label>
                            <input type="date" value="">
                        </div>
                        <div class="form-group">
                            <label>Gender</label>
                            <select>
                                <option value="">Select Gender</option>
                                <option value="male" selected>Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Note</label>
                            <textarea placeholder="Add notes about this employee..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Working Time -->
                <div class="form-section feriiz-u-089">
                    <div class="form-section-title">Working Time</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Start Hour</label>
                            <input type="time" value="08:00">
                        </div>
                        <div class="form-group">
                            <label>End Hour</label>
                            <input type="time" value="17:00">
                        </div>
                        <div class="form-group">
                            <label>Cut Off Hour</label>
                            <input type="time" value="18:00">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Working Days</label>
                            <div class="day-checks">
                                <label class="day-check"><input type="checkbox" checked><span>Mon</span></label>
                                <label class="day-check"><input type="checkbox" checked><span>Tue</span></label>
                                <label class="day-check"><input type="checkbox" checked><span>Wed</span></label>
                                <label class="day-check"><input type="checkbox" checked><span>Thu</span></label>
                                <label class="day-check"><input type="checkbox" checked><span>Fri</span></label>
                                <label class="day-check"><input type="checkbox"><span>Sat</span></label>
                                <label class="day-check"><input type="checkbox"><span>Sun</span></label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div>
                <!-- Account Configuration -->
                <div class="form-section">
                    <div class="form-section-title">Account Configuration</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Role</label>
                            <select>
                                <option value="">Select Role</option>
                                <option value="employee" selected>Employee</option>
                                <option value="admin">Admin</option>
                                <option value="manager">Manager</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" placeholder="Email" value="">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Reset Password</label>
                            <input type="text" placeholder="Reset Password" class="feriiz-u-090">
                        </div>
                    </div>
                </div>

                <!-- Payment Rate -->
                <div class="form-section feriiz-u-089">
                    <div class="form-section-title">Payment Rate</div>

                    <div class="form-row feriiz-u-091">
                        <div class="form-group">
                            <label>Hourly Rate</label>
                            <div class="rate-input">
                                <span class="rate-icon">$</span>
                                <input type="number" placeholder="0" value="">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Hourly Overtime Rate</label>
                            <div class="rate-input">
                                <span class="rate-icon">$</span>
                                <input type="number" placeholder="0" value="">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Client Rate</label>
                            <div class="rate-input">
                                <span class="rate-icon">$</span>
                                <input type="number" placeholder="0" value="">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Client Overtime Rate</label>
                            <div class="rate-input">
                                <span class="rate-icon">$</span>
                                <input type="number" placeholder="0" value="">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Save Button -->
                <button class="btn-save" type="button" onclick="saveEmployeeProfile()">Save Changes</button>
            </div>

        </div>

        <div class="feriiz-u-092">version : 3.5.7</div>
    </main>
    <script>
        function saveEmployeeProfile() {
            const firstNameInput = document.querySelector('input[placeholder="First Name"]');
            const firstName = firstNameInput ? firstNameInput.value.trim() : '';
            if (!firstName) {
                if (firstNameInput) firstNameInput.focus();
                if (window.FeriizNotify) FeriizNotify.warning('First name is required.', 'Employee not saved');
                return;
            }
            if (window.FeriizNotify) FeriizNotify.success(firstName + "'s profile was updated.", 'Employee updated');
        }
    </script>
</body>

</html>
