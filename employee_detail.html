<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feriiz - Employee Detail</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/customize.css?v=3.7.33">
    <link rel="stylesheet" href="assets/css/style.css?v=3.7.33">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="assets/js/data.js?v=3.7.33" defer></script>
    <script src="assets/js/app.js?v=3.7.33" defer></script>
    <script src="assets/js/employee-form.js?v=3.7.33" defer></script>
</head>

<body data-page="employee-detail">
    <!-- Sidebar -->
    <aside class="sidebar"></aside>

    <main class="main-content">

        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="employees.html">Employees</a>
            <span>&gt;</span>
            <span class="feriiz-u-057" id="detailCrumb">Employee Detail</span>
        </div>

        <div class="page-header">
            <div>
                <h1 class="page-title" id="detailTitle">Employee Detail</h1>
                <p class="workspace-page-note" id="detailSub">Loading employee…</p>
            </div>
        </div>

        <!-- Same form as Employees and Project > Activity (assets/js/employee-form.js) -->
        <div id="employeeDetailForm"></div>

        <div class="feriiz-u-092">version : 3.7.33</div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (!window.FERIIZ_DATA) return;
            window.FERIIZ_DATA.ready.then(function (data) {
                var code = new URLSearchParams(location.search).get('employee');
                var emp = code ? data.findEmployeeByCode(code) : null;
                var container = document.getElementById('employeeDetailForm');
                if (!emp) {
                    document.getElementById('detailSub').textContent = code
                        ? 'No employee with code ' + code + '. Open one from the Employees list.'
                        : 'Open an employee from the Employees list to see their details.';
                    container.innerHTML = '<a class="btn btn-primary" href="employees.html">Go to Employees</a>';
                    return;
                }
                var project = data.findProjectByCode((emp.projects || [])[0]);
                function paintHeader() {
                    document.getElementById('detailTitle').textContent = emp.name;
                    document.getElementById('detailCrumb').textContent = emp.name;
                    document.getElementById('detailSub').textContent = emp.code + (project ? ', ' + project.name : '');
                    document.title = 'Feriiz - ' + emp.name;
                }
                paintHeader();
                window.FeriizEmployeeForm.mount(container, {
                    employee: emp,
                    project: project,
                    onSave: function (v) {
                        ['firstName', 'middleName', 'lastName', 'occupation', 'pin', 'phone', 'email', 'gender', 'birthDate', 'note', 'status', 'role',
                         'workingDays', 'dailyRate', 'overtimeRate', 'clientDailyRate', 'clientOvertimeRate', 'transportPerDay'].forEach(function (k) {
                            emp[k] = v[k];
                        });
                        emp.name = v.name;
                        emp.workStart = v.startHour;
                        emp.workEnd = v.endHour;
                        emp.cutOff = v.cutOff;
                        paintHeader();
                    }
                });
            });
        });
    </script>
</body>

</html>
