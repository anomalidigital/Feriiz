<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feriiz - Employee Detail</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="Style.css">
    <style>
        .form-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: 1fr 340px;
            align-items: start;
        }

        .form-section {
            background: #fff;
            border: 1px solid #D9D9D9;
            border-radius: 7px;
            padding: 24px;
        }

        .form-section-title {
            font-size: 15px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 14px;
            margin-bottom: 14px;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #888;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            padding: 10px 14px;
            border: 1px solid #D9D9D9;
            border-radius: 7px;
            background: #fff;
            color: #333;
            outline: none;
            transition: border-color 0.2s ease;
            width: 100%;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2975BB;
            box-shadow: 0 0 0 3px rgba(41, 117, 187, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .rate-input {
            position: relative;
        }

        .rate-input .rate-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            font-weight: 700;
            color: #2975BB;
        }

        .rate-input input {
            padding-left: 32px;
        }

        /* Day checkboxes */
        .day-checks {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .day-check {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .day-check input[type="checkbox"] {
            accent-color: #6C3EC1;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .day-check span {
            font-size: 13px;
            font-weight: 500;
            color: #333;
        }

        .btn-save {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: #2975BB;
            color: #fff;
            border: none;
            border-radius: 7px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
            float: right;
            margin-top: 20px;
        }

        .btn-save:hover {
            background: #1e5a91;
        }

        .btn-reset-pw {
            width: 100%;
            padding: 10px 14px;
            background: #F2F2F2;
            border: 1px solid #D9D9D9;
            border-radius: 7px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: left;
        }

        .btn-reset-pw:hover {
            background: #e8e8e8;
            border-color: #bbb;
        }

        @media (max-width: 900px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="_Asset_/icon_feriiz.png" alt="Feriiz Logo">
            <div class="logo-text">FERIIZ</div>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html">
                <i class="fa-solid fa-table-cells-large"></i>
                <span class="nav-label">Dashboard</span>
            </a>
            <div class="nav-group open">
                <a href="projects.html" class="active">
                    <i class="fa-solid fa-clipboard"></i>
                    <span class="nav-label">Projects</span>
                </a>
                <div class="nav-submenu">
                    <a href="project_employees.html" class="">
                        <i class="fa-solid fa-clock"></i>
                        <span class="nav-label">Activity</span>
                    </a>
                    <a href="project_report.html" class="">
                        <i class="fa-regular fa-file-lines"></i>
                        <span class="nav-label">Report</span>
                    </a>
                    <a href="employee_request.html" class="">
                        <i class="fa-solid fa-clipboard-list"></i>
                        <span class="nav-label">Requests</span>
                    </a>
                </div>
            </div>
            <a href="employees.html">
                <i class="fa-solid fa-users"></i>
                <span class="nav-label">Employees</span>
            </a>
            <a href="my account.html">
                <i class="fa-regular fa-user"></i>
                <span class="nav-label">My Account</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">

        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="employees.html">Employees</a>
            <span>&gt;</span>
            <span style="color:#333;font-weight:600;">Employee Detail</span>
        </div>

        <div class="page-header">
            <h1 class="page-title">Employee Detail</h1>
        </div>

        <div class="form-grid">

            <!-- Left Column -->
            <div>
                <!-- Personal Information -->
                <div class="form-section">
                    <div class="form-section-title">Personal Information</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" placeholder="First Name" value="Erik">
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" placeholder="Last Name" value="">
                        </div>
                        <div class="form-group">
                            <label>Occupation</label>
                            <input type="text" placeholder="Occupation" value="Tukang Marmer">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Pin</label>
                            <input type="text" placeholder="Pin" value="0032">
                        </div>
                        <div class="form-group">
                            <label>Date of Birth</label>
                            <input type="date" value="">
                        </div>
                        <div class="form-group">
                            <label>Gender</label>
                            <select>
                                <option value="">Select Gender</option>
                                <option value="male" selected>Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Note</label>
                            <textarea placeholder="Add notes about this employee..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Working Time -->
                <div class="form-section" style="margin-top:20px;">
                    <div class="form-section-title">Working Time</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Start Hour</label>
                            <input type="time" value="08:00">
                        </div>
                        <div class="form-group">
                            <label>End Hour</label>
                            <input type="time" value="17:00">
                        </div>
                        <div class="form-group">
                            <label>Cut Off Hour</label>
                            <input type="time" value="18:00">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Working Days</label>
                            <div class="day-checks">
                                <label class="day-check"><input type="checkbox" checked><span>Mon</span></label>
                                <label class="day-check"><input type="checkbox" checked><span>Tue</span></label>
                                <label class="day-check"><input type="checkbox" checked><span>Wed</span></label>
                                <label class="day-check"><input type="checkbox" checked><span>Thu</span></label>
                                <label class="day-check"><input type="checkbox" checked><span>Fri</span></label>
                                <label class="day-check"><input type="checkbox"><span>Sat</span></label>
                                <label class="day-check"><input type="checkbox"><span>Sun</span></label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div>
                <!-- Account Configuration -->
                <div class="form-section">
                    <div class="form-section-title">Account Configuration</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Role</label>
                            <select>
                                <option value="">Select Role</option>
                                <option value="employee" selected>Employee</option>
                                <option value="admin">Admin</option>
                                <option value="manager">Manager</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" placeholder="Email" value="">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Reset Password</label>
                            <input type="text" placeholder="Reset Password" style="font-family: 'Poppins', sans-serif; font-size: 13px; padding: 10px 14px; border: 1px solid #D9D9D9; border-radius: 7px; background: #fff; color: #333; outline: none; transition: border-color 0.2s ease; width: 100%;">
                        </div>
                    </div>
                </div>

                <!-- Payment Rate -->
                <div class="form-section" style="margin-top:20px;">
                    <div class="form-section-title">Payment Rate</div>

                    <div class="form-row" style="flex-direction:column;">
                        <div class="form-group">
                            <label>Hourly Rate</label>
                            <div class="rate-input">
                                <span class="rate-icon">$</span>
                                <input type="number" placeholder="0" value="">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Hourly Overtime Rate</label>
                            <div class="rate-input">
                                <span class="rate-icon">$</span>
                                <input type="number" placeholder="0" value="">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Client Rate</label>
                            <div class="rate-input">
                                <span class="rate-icon">$</span>
                                <input type="number" placeholder="0" value="">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Client Overtime Rate</label>
                            <div class="rate-input">
                                <span class="rate-icon">$</span>
                                <input type="number" placeholder="0" value="">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Save Button -->
                <button class="btn-save">Save Changes</button>
            </div>

        </div>

        <div style="clear:both;margin-top:32px;font-size:12px;color:#bbb;">version : 2.0.86</div>
    </main>
</body>

</html>
