    <script>
    (function () {
        var params = new URLSearchParams(location.search);
        var state = {
            employee: null,
            all: [],
            filtered: [],
            filters: { type: '', status: '', dateStart: '', dateEnd: '' },
            page: 1,
            perPage: 25
        };

        function esc(v) {
            return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function fmtDay(iso) {
            if (!iso) return '-';
            var d = new Date(iso);
            if (isNaN(d)) return '-';
            var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return days[d.getDay()] + ', ' + d.getDate().toString().padStart(2,'0') + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
        }

        function statusBadgeClass(s) {
            var norm = (s || '').toLowerCase();
            if (norm === 'accepted') return 'badge badge-accepted';
            if (norm === 'rejected') return 'badge badge-rejected';
            return 'badge badge-pending';
        }

        function projectName(code) {
            var p = window.FERIIZ_DATA.findProjectByCode(code);
            return p ? p.name : (code || '-');
        }

        function renderRow(req) {
            var emp = state.employee;
            var tr = document.createElement('tr');
            tr.innerHTML =
                '<td><div class="action-cell"><button class="btn-icon" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button></div></td>' +
                '<td>' + esc(req.type) + '</td>' +
                '<td>' + esc(projectName(req.projectCode)) + '</td>' +
                '<td>' + fmtDay(req.submittedAt || req.dateStart) + '</td>' +
                '<td>' + fmtDay(req.dateStart) + (req.dateEnd && req.dateEnd !== req.dateStart ? ' – ' + fmtDay(req.dateEnd) : '') + '</td>' +
                '<td>' + esc(req.pic || '-') + '</td>' +
                '<td class="attachment-cell"></td>' +
                '<td><span class="' + statusBadgeClass(req.status) + '">' + esc(req.status) + '</span></td>';
            tr.querySelector('.attachment-cell').appendChild(attachmentLink(req));
            tr.querySelector('.btn-icon').addEventListener('click', function () {
                openModal(emp.name, req.type, fmtDay(req.submittedAt || req.dateStart),
                    fmtDay(req.dateStart) + (req.dateEnd && req.dateEnd !== req.dateStart ? ' – ' + fmtDay(req.dateEnd) : ''), req.status, req);
            });
            return tr;
        }

        /* ---------- Attachments (same viewer as the project's Requests) ---------- */
        window.requestAttachmentLink = function (req) { return attachmentLink(req); };
        // One button per row: the file name for one file, "N files" for more.
        function attachmentLink(req) {
            var files = req.attachments || [];
            if (!files.length) {
                var none = document.createElement('span');
                none.className = 'attachment-none';
                none.textContent = '–';
                none.setAttribute('aria-label', 'No attachment');
                return none;
            }
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'attachment-link';
            btn.title = files.map(function (f) { return f.name; }).join(', ');
            btn.innerHTML = '<i class="fa-solid fa-paperclip" aria-hidden="true"></i><span></span>';
            btn.querySelector('span').textContent = files.length === 1 ? files[0].name : files.length + ' files';
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                window.FeriizAttachments.open(files, req.type + ' from ' + state.employee.name + ', ' + fmtDay(req.dateStart));
            });
            return btn;
        }

        function renderPage() {
            var tbody = document.getElementById('requestsTableBody');
            tbody.innerHTML = '';
            var start = (state.page - 1) * state.perPage;
            var end = Math.min(start + state.perPage, state.filtered.length);
            for (var i = start; i < end; i++) tbody.appendChild(renderRow(state.filtered[i]));
            if (!state.filtered.length) {
                tbody.innerHTML = '<tr><td colspan="8" class="request-empty">' +
                    (state.all.length ? 'No requests match your filter.' : esc(state.employee.name) + ' has no requests yet.') + '</td></tr>';
            }
            document.getElementById('reqPaginationInfo').textContent = state.filtered.length === 0
                ? 'Showing 0 results'
                : 'Showing ' + (start + 1) + ' - ' + end + ' of ' + state.filtered.length + ' results';
            renderPagination();
        }

        function renderPagination() {
            var total = Math.ceil(state.filtered.length / state.perPage) || 1;
            var cur = state.page;
            var box = document.getElementById('reqPaginationButtons');
            box.innerHTML = '';
            var prev = document.createElement('button');
            prev.textContent = '< Previous'; prev.disabled = cur === 1;
            prev.addEventListener('click', function () { if (cur > 1) { state.page--; renderPage(); } });
            box.appendChild(prev);
            for (var n = 1; n <= total; n++) {
                (function (n) {
                    var a = document.createElement('a');
                    a.href = '#'; a.textContent = n;
                    if (n === cur) { a.className = 'active'; a.setAttribute('aria-current', 'page'); }
                    a.addEventListener('click', function (e) { e.preventDefault(); state.page = n; renderPage(); });
                    box.appendChild(a);
                })(n);
            }
            var next = document.createElement('a');
            next.href = '#'; next.textContent = 'Next >';
            if (cur === total) next.style.display = 'none';
            next.addEventListener('click', function (e) { e.preventDefault(); if (cur < total) { state.page++; renderPage(); } });
            box.appendChild(next);
        }

        function updateStatCards() {
            var counts = { Pending: 0, Accepted: 0, Rejected: 0 };
            state.filtered.forEach(function (r) { if (counts[r.status] !== undefined) counts[r.status]++; });
            var cards = document.querySelectorAll('.stat-card');
            if (cards[0]) cards[0].querySelector('.stat-number').textContent = counts.Pending;
            if (cards[1]) cards[1].querySelector('.stat-number').textContent = counts.Accepted;
            if (cards[2]) cards[2].querySelector('.stat-number').textContent = counts.Rejected;
        }

        function applyFilter() {
            var q = document.getElementById('requestSearch').value.trim().toLowerCase();
            var f = state.filters;
            state.filtered = state.all.filter(function (r) {
                if (f.type && r.type.toLowerCase().replace(/\s+/g, '_') !== f.type) return false;
                if (f.status && r.status.toLowerCase() !== f.status) return false;
                var requestStart = r.dateStart || '';
                var requestEnd = r.dateEnd || requestStart;
                if (f.dateStart && requestEnd < f.dateStart) return false;
                if (f.dateEnd && requestStart > f.dateEnd) return false;
                if (q && (r.type + ' ' + projectName(r.projectCode) + ' ' + (r.pic || '') + ' ' + (r.reason || '')).toLowerCase().indexOf(q) < 0) return false;
                return true;
            });
            state.page = 1;
            renderPage();
            updateStatCards();
        }

        // Filters change the table only on Apply.
        function commitRequestFilterDraft() {
            var dates = document.querySelectorAll('.filter-date');
            state.filters = {
                type: document.querySelector('.filter-type').value.toLowerCase(),
                status: document.querySelector('.filter-status').value.toLowerCase(),
                dateStart: dates[0] ? dates[0].value : '',
                dateEnd: dates[1] ? dates[1].value : ''
            };
        }

        // The 12 Anomali people keep their curated demo requests (with attachments);
        // everyone else gets their own requests from the dataset, which match the
        // sick, leave and remote days in attendance. No requests = an empty list.
        function requestsOf(data, emp) {
            function own(r) { return r.employeeCode === emp.code; }
            var demo = data.requests.filter(own);
            return demo.length ? demo : (data.generatedRequests || []).filter(own);
        }

        function paintHeader(emp, project) {
            var projectQuery = project ? '?project=' + encodeURIComponent(project.code) : '';
            document.getElementById('crumbProject').textContent = project ? project.name : 'Project';
            document.getElementById('crumbProject').href = 'project_employees.html' + projectQuery;
            document.getElementById('crumbRequests').href = 'employee_request.html' + projectQuery;
            document.getElementById('backLink').href = 'project_employees.html' + projectQuery;
            document.getElementById('crumbEmployee').textContent = emp ? emp.name : 'Employee';
            document.getElementById('employeeName').textContent = emp ? emp.name : 'Employee not found';
            document.getElementById('employeeCode').textContent = emp ? emp.code : '';
            if (emp) {
                var img = document.getElementById('employeeAvatar');
                img.src = window.FERIIZ_DATA.avatarSrc(emp);
                img.addEventListener('error', function () {
                    var fallback = window.FERIIZ_DATA.initialsAvatar(emp.name);
                    if (this.src !== fallback) this.src = fallback;
                });
                img.hidden = false;
                document.title = 'Feriiz - ' + emp.name + ' - Request';
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (!window.FERIIZ_DATA) return;
            window.FERIIZ_DATA.ready.then(function (data) {
                var project = data.findProjectByCode(params.get('project'));
                var emp = data.findEmployeeByCode(params.get('employee'));
                state.employee = emp;
                paintHeader(emp, project);
                if (!emp) {
                    document.getElementById('requestsTableBody').innerHTML =
                        '<tr><td colspan="8" class="request-empty">Open an employee from the project\'s Activity list or from Requests.</td></tr>';
                    return;
                }
                window.personalRequestContext = { employee: emp, project: project };
                state.all = requestsOf(data, emp)
                    .sort(function (a, b) { return (b.submittedAt || '').localeCompare(a.submittedAt || ''); });
                applyFilter();

                document.querySelector('.filter-apply-btn').addEventListener('click', function () {
                    commitRequestFilterDraft();
                    applyFilter();
                });
                document.querySelector('.filter-clear-btn').addEventListener('click', function () {
                    document.querySelector('.filter-type').value = '';
                    document.querySelector('.filter-status').value = '';
                    document.querySelectorAll('.filter-date').forEach(function (input) { input.value = ''; });
                    document.getElementById('requestSearch').value = '';
                    state.filters = { type: '', status: '', dateStart: '', dateEnd: '' };
                    applyFilter();
                });
                var timer;
                document.getElementById('requestSearch').addEventListener('input', function () {
                    clearTimeout(timer); timer = setTimeout(applyFilter, 200);
                });
            });
        });
    })();
    </script>

    <!-- Approval Modal Overlay (same as the project's Requests) -->

    <script>
        function openModal(name, type, dateReq, dateRange, status, req) {
            document.getElementById('modalTitle').textContent = 'Approval ' + name;
            var attachmentSlot = document.getElementById('modalAttachment');
            attachmentSlot.innerHTML = '';
            attachmentSlot.appendChild(req ? window.requestAttachmentLink(req) : document.createTextNode('–'));
            document.getElementById('modalRemark').value = (req && req.remark) || '';
            document.getElementById('modalRequest').textContent = type || '-';
            document.getElementById('modalDateRequest').textContent = dateReq || '-';
            document.getElementById('modalDate').textContent = dateRange || '-';
            var sel = document.getElementById('modalStatus');
            for (var i = 0; i < sel.options.length; i++) {
                if (sel.options[i].text === status) { sel.selectedIndex = i; break; }
            }
            document.getElementById('approvalModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('approvalModal').classList.remove('show');
            document.body.style.overflow = '';
            var noteInput = document.getElementById('modalNoteInput');
            var notifWrapper = document.getElementById('modalNotificationWrapper');
            if (noteInput && notifWrapper) {
                noteInput.value = '';
                notifWrapper.style.display = 'none';
            }
        }

        function saveRequestChanges() {
            var employee = document.getElementById('modalTitle').textContent.replace(/^Approval\s+/, '') || 'Employee';
            closeModal();
            if (window.FeriizNotify) FeriizNotify.success('The request for ' + employee + ' was updated.', 'Request updated');
        }

        function deleteRequest() {
            var employee = document.getElementById('modalTitle').textContent.replace(/^Approval\s+/, '') || 'Employee';
            closeModal();
            if (window.FeriizNotify) FeriizNotify.success('The request for ' + employee + ' was deleted.', 'Request deleted');
        }

        document.getElementById('approvalModal').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        function openAddRequestModal() {
            var ctx = window.personalRequestContext;
            if (!ctx) return;
            document.getElementById('addReqEmployee').value = ctx.employee.name;
            document.getElementById('addReqProject').value = ctx.project ? ctx.project.name : '';
            document.getElementById('addRequestModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeAddRequestModal() {
            document.getElementById('addRequestModal').classList.remove('show');
            document.body.style.overflow = '';
        }

        function saveNewRequest() {
            var employee = document.getElementById('addReqEmployee').value.trim() || 'the employee';
            closeAddRequestModal();
            if (window.FeriizNotify) FeriizNotify.success('The request for ' + employee + ' was added.', 'Request added');
        }

        document.getElementById('addRequestModal').addEventListener('click', function (e) {
            if (e.target === this) closeAddRequestModal();
        });

        // The notification checkbox appears once there is a note to send.
        document.addEventListener('DOMContentLoaded', function () {
            var modalNoteInput = document.getElementById('modalNoteInput');
            var modalNotificationWrapper = document.getElementById('modalNotificationWrapper');
            if (modalNoteInput && modalNotificationWrapper) {
                modalNoteInput.addEventListener('input', function () {
                    modalNotificationWrapper.style.display = this.value.trim() !== '' ? 'block' : 'none';
                });
            }
        });
    </script>
</body>
</html>
