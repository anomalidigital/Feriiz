<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feriiz - Assigned Requests</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/customize.css?v=3.7.52">
    <link rel="stylesheet" href="assets/css/style.css?v=3.7.52">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="assets/js/data.js?v=3.7.52" defer></script>
    <script src="assets/js/app.js?v=3.7.52" defer></script>
</head>

<body data-page="employee-personal-request">
    <aside class="sidebar"></aside>

    <main class="main-content">
        <!-- Assigned Requests (Baldy, 03-11-2026): how much of each request type one person may use
             in this project, as the old Feriiz "List Assigned Request" (e.g. Remote Work 20 days a
             year). Employees ask for it in the mobile app and the project's Requests page approves
             it, so Used counts their accepted requests. Opened from Activity (the clipboard in a
             person's row) and from a name on the project's Requests page. -->
        <div class="breadcrumb">
            <a href="projects.html">Projects</a>
            <span>&gt;</span>
            <a href="project_employees.html" id="crumbProject">Project</a>
            <span>&gt;</span>
            <span class="feriiz-u-152">Assigned Requests</span>
            <span>&gt;</span>
            <span class="feriiz-u-057" id="crumbEmployee">Employee</span>
        </div>

        <div class="page-header">
            <div class="d-flex align-items-center gap-3">
                <a href="project_employees.html" class="feriiz-u-059" id="backLink" aria-label="Back">
                    <i class="fa-solid fa-chevron-left feriiz-u-060"></i>
                </a>
                <div class="feriiz-u-061">
                    <img src="" alt="" class="feriiz-u-062" id="employeeAvatar" hidden>
                    <div>
                        <h1 class="page-title feriiz-u-063" id="employeeName">Employee</h1>
                        <div class="feriiz-u-093" id="employeeCode"></div>
                    </div>
                </div>
            </div>
            <!-- At the top right like every other page (Baldy, 04-11-2026), not inside the table as
                 on the old Feriiz: the month and year Used counts in, the prints, Assign Request, search. -->
            <div class="page-actions flex-wrap">
                <select class="form-select assigned-period" id="assignedMonth" aria-label="Month"></select>
                <select class="form-select assigned-period" id="assignedYear" aria-label="Year"></select>
                <button class="btn btn-outline" type="button" id="printAssigned">
                    <i class="fa-solid fa-print" aria-hidden="true"></i>
                    Print
                </button>
                <button class="btn btn-outline" type="button" id="printPerRequest">
                    <i class="fa-solid fa-print" aria-hidden="true"></i>
                    Print Per Request
                </button>
                <button class="btn btn-primary" type="button" id="assignRequestBtn">
                    <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
                    Assign Request
                </button>
                <div class="feriiz-u-020">
                    <i class="fa-solid fa-magnifying-glass feriiz-u-067" aria-hidden="true"></i>
                    <input type="text" placeholder="Search request name" class="feriiz-u-068" id="assignedSearch" aria-label="Search request name" autocomplete="off">
                </div>
            </div>
        </div>

        <div class="table-container">
            <table class="data-table assigned-table">
                <thead>
                    <tr>
                        <th class="feriiz-u-028"></th>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Used</th>
                        <th>Period</th>
                    </tr>
                </thead>
                <tbody id="assignedBody">
                    <tr><td colspan="6" class="tpl-empty">Loading assigned requests...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="feriiz-u-032">version : 3.7.52</div>
    </main>

    <!-- Assign Request: Request, Amount and Notes, as on the old Feriiz. Editing keeps the request
         type and can delete it, asking once in the footer. -->
    <div class="modal fade" id="assignedModal" tabindex="-1" aria-labelledby="assignedModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="assignedForm" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title" id="assignedModalTitle">Assign Request</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label" for="arType">Request</label>
                    <select class="form-select" id="arType"></select>
                    <div class="form-text" id="arTypeInfo"></div>
                    <div class="row g-3 pt-3">
                        <div class="col-sm-6">
                            <label class="form-label" for="arAmount">Amount</label>
                            <div id="arAmountGroup">
                                <span class="input-group-text" id="arUnitBefore" hidden>Rp</span>
                                <input type="text" inputmode="numeric" class="form-control" id="arAmount" autocomplete="off">
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="arNotes">Notes <span class="tpl-optional">(Optional)</span></label>
                            <input type="text" class="form-control" id="arNotes" placeholder="For example: Holidays / Meal" autocomplete="off">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-danger me-auto" id="arDelete" hidden>Delete</button>
                    <span class="tpl-summary is-danger me-auto" id="arSummary" hidden></span>
                    <button type="button" class="btn btn-outline" data-bs-dismiss="modal" id="arCancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="arSave">Save Changes</button>
                    <button type="button" class="btn btn-outline" id="arKeep" hidden>Keep</button>
                    <button type="button" class="btn btn-danger" id="arConfirmDelete" hidden>Yes, delete</button>
                </div>
            </form>
        </div>
    </div>

    <!-- What Print and Print Per Request put on paper (nothing else of the page is printed) -->
    <div id="assignedPrint"></div>

    <script>
    (function () {
        var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
            'August', 'September', 'October', 'November', 'December'];
        var params = new URLSearchParams(location.search);
        var state = { data: null, project: null, employee: null, list: [], requests: [], month: 0, year: 0, editing: null };
        var modal = null;

        function esc(v) {
            return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function pad2(n) { return String(n).padStart(2, '0'); }
        function digits(v) { return String(v == null ? '' : v).replace(/\D/g, ''); }
        function rupiah(n) { return 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID'); }
        function notify(kind, message, title) { if (window.FeriizNotify) window.FeriizNotify[kind](message, title); }

        function admin() {
            try { var u = JSON.parse(localStorage.getItem('feriiz_user') || '{}'); return u.name || u.email || 'Admin'; } catch (e) { return 'Admin'; }
        }

        function typeOf(name) {
            return state.data.findRequestType(name) || { name: name, type: 'Other', unit: 'day', period: 'Yearly' };
        }

        // "20" or "Rp 25.000": a quota in days is a plain number (Baldy, 04-11-2026: no "days")
        function amountText(unit, n) { return unit === 'idr' ? rupiah(n) : String(Number(n) || 0); }

        // "Mon, 05 Oct 2026"
        function fmtDay(iso) {
            var d = new Date(iso + 'T00:00:00');
            if (isNaN(d)) return '-';
            return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()] + ', ' + pad2(d.getDate()) + ' ' +
                MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getFullYear();
        }

        // The days a quota counts in: the chosen year, or the chosen month for a monthly one.
        function periodOf(t) {
            if (t.period === 'Monthly') {
                var month = state.year + '-' + pad2(state.month + 1);
                return { from: month + '-01', to: month + '-' + pad2(new Date(state.year, state.month + 1, 0).getDate()), label: MONTHS[state.month] + ' ' + state.year };
            }
            return { from: state.year + '-01-01', to: state.year + '-12-31', label: String(state.year) };
        }

        // The accepted requests of this type in its period, with the days (or rupiah) each one used.
        function usesOf(a) {
            var t = typeOf(a.type);
            var p = periodOf(t);
            return state.requests.filter(function (r) {
                return r.status === 'Accepted' && String(r.type).toLowerCase() === t.name.toLowerCase();
            }).map(function (r) {
                var from = r.dateStart > p.from ? r.dateStart : p.from;
                var end = r.dateEnd || r.dateStart;
                var to = end < p.to ? end : p.to;
                var days = to >= from ? Math.round((new Date(to + 'T00:00:00') - new Date(from + 'T00:00:00')) / 86400000) + 1 : 0;
                return { req: r, days: days, value: t.unit === 'idr' ? Number(r.amount) || 0 : days };
            }).filter(function (u) { return u.days > 0; });
        }

        function usedOf(a) { return usesOf(a).reduce(function (sum, u) { return sum + u.value; }, 0); }

        // "16 left", "none left" or "2 over"
        function leftText(a) {
            var t = typeOf(a.type);
            var left = a.amount - usedOf(a);
            return left > 0 ? amountText(t.unit, left) + ' left' : left === 0 ? 'none left' : amountText(t.unit, -left) + ' over';
        }

        // In the order of the request type list, so the table and the prints read the same.
        function sortList() {
            var order = state.data.requestTypes.map(function (t) { return t.name.toLowerCase(); });
            state.list.sort(function (a, b) {
                var ia = order.indexOf(a.type.toLowerCase()), ib = order.indexOf(b.type.toLowerCase());
                return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
            });
        }

        function render() {
            var tbody = document.getElementById('assignedBody');
            if (!state.list.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="tpl-empty">' + esc(state.employee.name) + ' has no assigned requests yet.' +
                    '<div class="mt-3"><button type="button" class="btn btn-primary" data-assign>Assign Request</button></div></td></tr>';
                return;
            }
            var q = document.getElementById('assignedSearch').value.trim().toLowerCase();
            var rows = state.list.filter(function (a) { return !q || (a.type + ' ' + (a.notes || '')).toLowerCase().indexOf(q) >= 0; });
            if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="tpl-empty">No assigned request matches the search.</td></tr>';
                return;
            }
            tbody.innerHTML = rows.map(function (a) {
                var t = typeOf(a.type);
                var full = a.amount - usedOf(a) <= 0;
                return '<tr>' +
                    '<td><div class="action-cell"><button type="button" class="btn-icon" title="Edit" aria-label="Edit ' + esc(a.type) + '" data-edit="' + esc(a.id) + '">' +
                        '<i class="fa-solid fa-pen-to-square"></i></button></div></td>' +
                    '<td><div class="fw-semibold">' + esc(a.type) + '</div>' + (a.notes ? '<div class="tpl-sub">' + esc(a.notes) + '</div>' : '') + '</td>' +
                    '<td>' + esc(t.type) + '</td>' +
                    '<td class="tpl-amount">' + amountText(t.unit, a.amount) + '</td>' +
                    '<td>' + amountText(t.unit, usedOf(a)) + '<div class="tpl-sub' + (full ? ' assigned-full' : '') + '">' + leftText(a) + '</div></td>' +
                    '<td>' + esc(t.period) + '</td>' +
                '</tr>';
            }).join('');
        }

        function persist() {
            sortList();
            state.data.saveAssignedRequests(state.project ? state.project.code : '', state.employee.code, state.list);
        }

        /* ---------- Assign / edit ---------- */
        function syncUnit() {
            var name = document.getElementById('arType').value;
            var t = name ? typeOf(name) : null;
            var idr = Boolean(t && t.unit === 'idr');
            var amount = document.getElementById('arAmount');
            // A claim gets "Rp" in front; a quota in days is a plain number field.
            document.getElementById('arAmountGroup').classList.toggle('input-group', idr);
            document.getElementById('arUnitBefore').hidden = !idr;
            amount.placeholder = idr ? 'For example: 25.000' : 'For example: 20';
            var d = digits(amount.value);
            amount.value = d ? (idr ? Number(d).toLocaleString('id-ID') : d) : '';
            document.getElementById('arTypeInfo').textContent = t
                ? t.type + ', counted in ' + (idr ? 'rupiah' : 'days') + '. It starts again every ' + (t.period === 'Monthly' ? 'month' : 'year') + '.'
                : 'How much of it ' + state.employee.name + ' may use.';
        }

        function setConfirm(on) {
            var editing = Boolean(state.editing);
            document.getElementById('arDelete').hidden = on || !editing;
            document.getElementById('arCancel').hidden = on;
            document.getElementById('arSave').hidden = on;
            document.getElementById('arSummary').hidden = !on;
            document.getElementById('arKeep').hidden = !on;
            document.getElementById('arConfirmDelete').hidden = !on;
            if (!on) return;
            document.getElementById('arSummary').textContent = 'Delete ' + state.editing.type + ' from ' + state.employee.name + '?';
            document.getElementById('arConfirmDelete').focus();
        }

        function openForm(a) {
            var taken = {};
            state.list.forEach(function (x) { taken[x.type.toLowerCase()] = true; });
            var types = a ? [typeOf(a.type)] : state.data.requestTypes.filter(function (t) { return !taken[t.name.toLowerCase()]; });
            if (!types.length) {
                notify('info', 'Every request type is already assigned to ' + state.employee.name + '. Edit one to change its amount.', 'Nothing left to assign');
                return;
            }
            state.editing = a || null;
            var select = document.getElementById('arType');
            select.innerHTML = (a ? '' : '<option value="">Choose request type</option>') + types.map(function (t) {
                return '<option value="' + esc(t.name) + '">' + esc(t.name) + '</option>';
            }).join('');
            select.disabled = Boolean(a);
            select.value = a ? a.type : '';
            document.getElementById('arAmount').value = a ? String(a.amount) : '';
            document.getElementById('arNotes').value = a ? (a.notes || '') : '';
            document.getElementById('assignedModalTitle').textContent = a ? 'Edit Assigned Request' : 'Assign Request';
            document.querySelectorAll('#assignedForm .is-invalid').forEach(function (el) { el.classList.remove('is-invalid'); });
            setConfirm(false);
            syncUnit();
            modal.show();
        }

        function save(e) {
            e.preventDefault();
            var typeEl = document.getElementById('arType');
            var amountEl = document.getElementById('arAmount');
            var name = typeEl.value;
            var t = name ? typeOf(name) : null;
            var amount = Number(digits(amountEl.value)) || 0;
            var tooMany = Boolean(t && t.unit === 'day' && amount > 366);
            typeEl.classList.toggle('is-invalid', !name);
            amountEl.classList.toggle('is-invalid', !amount || tooMany);
            if (!name || !amount || tooMany) {
                (name ? amountEl : typeEl).focus();
                notify('warning', !name ? 'Choose the request type first.' : tooMany ? 'A quota in days can be at most 366.' : 'Fill in the amount.', 'Not saved');
                return;
            }
            var notes = document.getElementById('arNotes').value.trim();
            var at = new Date().toISOString();
            if (state.editing) {
                var item = state.list.filter(function (x) { return x.id === state.editing.id; })[0];
                item.amount = amount; item.notes = notes; item.at = at; item.by = admin();
            } else {
                state.list.push({ id: 'AR-' + Date.now().toString(36).toUpperCase(), type: name, amount: amount, notes: notes, at: at, by: admin() });
            }
            persist();
            modal.hide();
            render();
            notify('success', state.editing
                ? name + ' for ' + state.employee.name + ' is now ' + amountText(t.unit, amount) + '.'
                : name + ' (' + amountText(t.unit, amount) + ') was assigned to ' + state.employee.name + '.',
                state.editing ? 'Assigned request updated' : 'Request assigned');
        }

        function remove() {
            var gone = state.editing;
            state.list = state.list.filter(function (x) { return x.id !== gone.id; });
            persist();
            modal.hide();
            render();
            notify('success', gone.type + ' was removed from ' + state.employee.name + '.', 'Assigned request deleted');
        }

        /* ---------- Print and Print Per Request ---------- */
        function printSheet(title, body) {
            var emp = state.employee;
            document.getElementById('assignedPrint').innerHTML =
                '<header class="ar-print-head"><h1>' + esc(title) + '</h1>' +
                    '<p>' + esc(emp.name) + ' · ' + esc(emp.code) + (state.project ? ' · ' + esc(state.project.name) : '') + '</p>' +
                    '<p>Yearly requests: ' + state.year + ' · Monthly requests: ' + MONTHS[state.month] + ' ' + state.year + '</p></header>' +
                body +
                '<p class="ar-print-foot">Printed ' + fmtDay(new Date().toISOString().slice(0, 10)) + ' by ' + esc(admin()) + '</p>';
            window.print();
        }

        function printAll() {
            if (!state.list.length) { notify('info', state.employee.name + ' has no assigned requests to print.', 'Nothing to print'); return; }
            printSheet('Assigned Requests', '<table class="ar-print-table"><thead><tr>' +
                '<th>Name</th><th>Type</th><th>Amount</th><th>Used</th><th>Left</th><th>Period</th></tr></thead><tbody>' +
                state.list.map(function (a) {
                    var t = typeOf(a.type);
                    return '<tr><td>' + esc(a.type) + (a.notes ? '<br><small>' + esc(a.notes) + '</small>' : '') + '</td><td>' + esc(t.type) + '</td>' +
                        '<td>' + amountText(t.unit, a.amount) + '</td><td>' + amountText(t.unit, usedOf(a)) + '</td>' +
                        '<td>' + leftText(a) + '</td><td>' + esc(t.period) + '</td></tr>';
                }).join('') + '</tbody></table>');
        }

        // Each assigned request with the accepted requests that used it in its period.
        function printPerRequest() {
            if (!state.list.length) { notify('info', state.employee.name + ' has no assigned requests to print.', 'Nothing to print'); return; }
            printSheet('Assigned Requests per Request', state.list.map(function (a) {
                var t = typeOf(a.type);
                var uses = usesOf(a);
                return '<section class="ar-print-section"><h2>' + esc(a.type) + '</h2>' +
                    '<p>' + esc(t.type) + ' · ' + amountText(t.unit, a.amount) + ' ' + t.period.toLowerCase() + ' · used ' + amountText(t.unit, usedOf(a)) +
                        ' · ' + leftText(a) + (a.notes ? ' · ' + esc(a.notes) : '') + '</p>' +
                    (uses.length
                        ? '<table class="ar-print-table"><thead><tr><th>Date</th><th>' + (t.unit === 'idr' ? 'Amount' : 'Days') + '</th><th>Reason</th><th>Approved by</th></tr></thead><tbody>' +
                          uses.map(function (u) {
                              var r = u.req;
                              return '<tr><td>' + fmtDay(r.dateStart) + (r.dateEnd && r.dateEnd !== r.dateStart ? ' – ' + fmtDay(r.dateEnd) : '') + '</td>' +
                                  '<td>' + (t.unit === 'idr' ? rupiah(u.value) : u.days) + '</td><td>' + esc(r.reason || '-') + '</td><td>' + esc(r.pic || '-') + '</td></tr>';
                          }).join('') + '</tbody></table>'
                        : '<p class="ar-print-none">Not used in ' + esc(periodOf(t).label) + '.</p>') +
                '</section>';
            }).join(''));
        }

        /* ---------- Page ---------- */
        // This person's requests in this project (the 12 Anomali people keep their curated demo ones).
        function requestsOf(data, emp, project) {
            var demo = data.requests.filter(function (r) { return r.employeeCode === emp.code; });
            var all = demo.length ? demo : (data.generatedRequests || []).filter(function (r) { return r.employeeCode === emp.code; });
            return all.filter(function (r) { return !project || r.projectCode === project.code; });
        }

        function paintHeader(emp, project) {
            var query = project ? '?project=' + encodeURIComponent(project.code) : '';
            document.getElementById('crumbProject').textContent = project ? project.name : 'Project';
            document.getElementById('crumbProject').href = 'project_employees.html' + query;
            document.getElementById('backLink').href = 'project_employees.html' + query;
            document.getElementById('crumbEmployee').textContent = emp ? emp.name : 'Employee';
            document.getElementById('employeeName').textContent = emp ? emp.name : 'Employee not found';
            document.getElementById('employeeCode').textContent = emp ? emp.code : '';
            if (!emp) return;
            var img = document.getElementById('employeeAvatar');
            img.src = window.FERIIZ_DATA.avatarSrc(emp);
            img.addEventListener('error', function () {
                var fallback = window.FERIIZ_DATA.initialsAvatar(emp.name);
                if (this.src !== fallback) this.src = fallback;
            });
            img.hidden = false;
            document.title = 'Feriiz - ' + emp.name + ' - Assigned Requests';
        }

        // The month and year Used is counted in: today's, held at the last day of the demo data.
        function fillPeriod(data) {
            var end = data.meta && data.meta.periodEnd;
            var now = new Date();
            var today = end && now.toISOString().slice(0, 10) > end ? new Date(end + 'T00:00:00') : now;
            state.month = today.getMonth();
            state.year = today.getFullYear();
            var month = document.getElementById('assignedMonth');
            var year = document.getElementById('assignedYear');
            month.innerHTML = MONTHS.map(function (m, i) { return '<option value="' + i + '">' + m + '</option>'; }).join('');
            year.innerHTML = [state.year - 1, state.year, state.year + 1].map(function (y) { return '<option value="' + y + '">' + y + '</option>'; }).join('');
            month.value = String(state.month);
            year.value = String(state.year);
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (!window.FERIIZ_DATA) return;
            window.FERIIZ_DATA.ready.then(function (data) {
                var emp = data.findEmployeeByCode(params.get('employee'));
                var project = data.findProjectByCode(params.get('project')) ||
                    (emp && emp.projects && emp.projects.length ? data.findProjectByCode(emp.projects[0]) : null);
                state.data = data;
                state.employee = emp;
                state.project = project;
                paintHeader(emp, project);
                if (!emp) {
                    document.getElementById('assignedBody').innerHTML =
                        '<tr><td colspan="6" class="tpl-empty">Open an employee from the project\'s Activity list.</td></tr>';
                    return;
                }
                state.requests = requestsOf(data, emp, project);
                state.list = data.assignedRequestsOf(project ? project.code : '', emp.code);
                sortList();
                fillPeriod(data);
                modal = window.bootstrap.Modal.getOrCreateInstance(document.getElementById('assignedModal'));
                render();

                document.getElementById('assignedMonth').addEventListener('change', function (e) { state.month = Number(e.target.value); render(); });
                document.getElementById('assignedYear').addEventListener('change', function (e) { state.year = Number(e.target.value); render(); });
                document.getElementById('assignedSearch').addEventListener('input', render);
                document.getElementById('assignRequestBtn').addEventListener('click', function () { openForm(null); });
                document.getElementById('printAssigned').addEventListener('click', printAll);
                document.getElementById('printPerRequest').addEventListener('click', printPerRequest);
                document.getElementById('assignedBody').addEventListener('click', function (e) {
                    if (e.target.closest('[data-assign]')) { openForm(null); return; }
                    var edit = e.target.closest('[data-edit]');
                    if (edit) openForm(state.list.filter(function (x) { return x.id === edit.dataset.edit; })[0]);
                });
                document.getElementById('assignedForm').addEventListener('submit', save);
                document.getElementById('arType').addEventListener('change', function (e) { e.target.classList.remove('is-invalid'); syncUnit(); });
                document.getElementById('arAmount').addEventListener('input', function (e) {
                    e.target.classList.remove('is-invalid');
                    var name = document.getElementById('arType').value;
                    var d = digits(e.target.value);
                    e.target.value = d ? (name && typeOf(name).unit === 'idr' ? Number(d).toLocaleString('id-ID') : d) : '';
                });
                document.getElementById('arDelete').addEventListener('click', function () { setConfirm(true); });
                document.getElementById('arKeep').addEventListener('click', function () { setConfirm(false); });
                document.getElementById('arConfirmDelete').addEventListener('click', remove);
                document.getElementById('assignedModal').addEventListener('hidden.bs.modal', function () { setConfirm(false); });
            });
        });
    })();
    </script>
</body>

</html>
