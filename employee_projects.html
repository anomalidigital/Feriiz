<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feriiz - Employee Projects</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/customize.css?v=3.7.35">
    <link rel="stylesheet" href="assets/css/style.css?v=3.7.35">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="assets/js/data.js?v=3.7.35" defer></script>
    <script src="assets/js/app.js?v=3.7.35" defer></script>
</head>

<body data-page="employee-projects">
    <aside class="sidebar"></aside>

    <main class="main-content">
        <div class="breadcrumb">
            <a href="employees.html">Employees</a>
            <span>&gt;</span>
            <span class="feriiz-u-057" id="projCrumb">Projects</span>
        </div>

        <div class="page-header">
            <div class="feriiz-u-058">
                <a href="employees.html" class="feriiz-u-059">
                    <i class="fa-solid fa-chevron-left feriiz-u-060"></i>
                </a>
                <div class="feriiz-u-061">
                    <img alt="" class="feriiz-u-062" id="projPhoto">
                    <div>
                        <h1 class="page-title feriiz-u-063" id="projName"></h1>
                        <div class="feriiz-u-064" id="projCode"></div>
                    </div>
                </div>
            </div>
            <div class="page-actions feriiz-u-065">
                <div class="feriiz-u-014">
                    <button class="btn btn-outline filter-toggle-btn" title="Filter">
                        <i class="fa-solid fa-filter"></i>
                    </button>
                    <!-- Filter Dropdown Menu -->
                    <div class="filter-dropdown feriiz-u-015">
                        <div class="feriiz-u-016">Filter Projects</div>
                        
                        <label>Start Date Range</label>
                        <div class="feriiz-u-003">
                            <input type="date" class="input filter-date-start feriiz-u-004">
                            <span class="feriiz-u-005">-</span>
                            <input type="date" class="input filter-date-end feriiz-u-004">
                        </div>

                        <label>Project Type</label>
                        <select class="input filter-type feriiz-u-017">
                            <option>All Types</option>
                            <option>Attendance</option>
                            <option>Overtime</option>
                        </select>

                        <div class="feriiz-u-018">
                            <button class="btn btn-outline filter-clear-btn feriiz-u-019">Clear</button>
                            <button class="btn btn-primary filter-apply-btn feriiz-u-019">Apply</button>
                        </div>
                    </div>
                </div>
                <div class="feriiz-u-020">
                    <i class="fa-solid fa-magnifying-glass feriiz-u-067"></i>
                    <input type="text" id="projectSearch" placeholder="Search projects..." class="feriiz-u-068">
                </div>
            </div>
        </div>

        <!-- Stat Card -->
        <div class="stat-cards feriiz-u-103">
            <div class="stat-card feriiz-u-024">
                <div class="stat-card-icon feriiz-u-025">
                    <i class="fa-solid fa-folder"></i>
                </div>
                <div class="stat-card-info">
                    <div class="stat-number feriiz-u-099" id="projCount">0</div>
                    <div class="stat-label feriiz-u-027">Assigned Projects</div>
                </div>
            </div>
        </div>

        <!-- Projects Table -->
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Project Name</th>
                        <th>Project Code</th>
                        <th>Type</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="5" class="tpl-empty">Loading projects...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="feriiz-u-032">version : 3.7.35</div>
    </main>
    <script>
        /* One person's projects, from FERIIZ_DATA for ?employee= (it used to be Adam
           Ferial's written into the page, backlog A2, 2026-10-28). Start Date = when the
           project started; End Date only for an inactive project (its last activity). */
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('.filter-toggle-btn');
            const dropdown = document.querySelector('.filter-dropdown');
            const applyBtn = document.querySelector('.filter-apply-btn');
            const clearBtn = document.querySelector('.filter-clear-btn');
            const typeSelect = document.querySelector('.filter-type');
            const dateStart = document.querySelector('.filter-date-start');
            const dateEnd = document.querySelector('.filter-date-end');
            const searchInput = document.getElementById('projectSearch');
            const tbody = document.querySelector('.data-table tbody');
            const appliedFilters = { type: '', start: '', end: '' };
            const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                'August', 'September', 'October', 'November', 'December'];

            const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

            // "10 December 2025"
            const longDate = iso => {
                if (!iso) return '-';
                const p = iso.slice(0, 10).split('-').map(Number);
                return String(p[2]).padStart(2, '0') + ' ' + MONTHS[p[1] - 1] + ' ' + p[0];
            };

            if (toggleBtn && dropdown) {
                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdown.classList.toggle('show');
                });

                document.addEventListener('click', (e) => {
                    if (!dropdown.contains(e.target) && !toggleBtn.contains(e.target)) {
                        dropdown.classList.remove('show');
                    }
                });
            }

            const applyFilters = () => {
                const typeVal = appliedFilters.type;
                const startVal = appliedFilters.start;
                const endVal = appliedFilters.end;
                const searchVal = searchInput.value.trim().toLowerCase();
                let shown = 0;

                tbody.querySelectorAll('tr[data-start]').forEach(row => {
                    const name = row.cells[0].textContent.toLowerCase();
                    const code = row.cells[1].textContent.toLowerCase();
                    const type = row.cells[2].textContent.toLowerCase();
                    const start = row.dataset.start;   // YYYY-MM-DD

                    let show = true;
                    if (searchVal && !name.includes(searchVal) && !code.includes(searchVal)) show = false;
                    if (show && typeVal && typeVal !== 'all types' && type !== typeVal) show = false;
                    if (show && startVal && start < startVal) show = false;
                    if (show && endVal && start > endVal) show = false;

                    row.style.display = show ? '' : 'none';
                    if (show) shown++;
                });

                const emptyRow = tbody.querySelector('.projects-empty-row');
                if (emptyRow) emptyRow.style.display = shown ? 'none' : '';
            };

            const render = data => {
                const wanted = new URLSearchParams(window.location.search).get('employee');
                let employee = wanted ? data.findEmployeeByCode(wanted) : null;
                if (!employee) {
                    employee = data.employees[0] || null;
                    if (wanted && employee && window.FeriizNotify) {
                        FeriizNotify.warning('Employee ' + wanted + ' was not found, so ' + employee.name + ' is shown.', 'Employee not found');
                    }
                }
                if (!employee) return;

                document.getElementById('projName').textContent = employee.name;
                document.getElementById('projCode').textContent = employee.code;
                document.getElementById('projCrumb').textContent = employee.name + ' - Projects';
                document.getElementById('projPhoto').src = data.avatarSrc(employee);
                document.title = 'Feriiz - ' + employee.name + ' - Projects';

                const projects = (employee.projects || []).map(code => data.findProjectByCode(code)).filter(Boolean);
                document.getElementById('projCount').textContent = projects.length;
                tbody.innerHTML = projects.map(p => {
                    const start = (p.startedAt || '').slice(0, 10);
                    return '<tr data-start="' + esc(start) + '">' +
                        '<td class="feriiz-u-104">' + esc(p.name) + '</td>' +
                        '<td>' + esc(p.code) + '</td>' +
                        '<td>' + esc(p.type || '-') + '</td>' +
                        '<td>' + longDate(start) + '</td>' +
                        '<td>' + (p.status === 'Inactive' ? longDate(p.lastActivityAt) : '-') + '</td>' +
                    '</tr>';
                }).join('') +
                    '<tr class="projects-empty-row"><td colspan="5" class="tpl-empty">' +
                    (projects.length ? 'No project matches the search or filter.' : 'No projects assigned yet.') + '</td></tr>';
                applyFilters();
            };

            if (window.FERIIZ_DATA && window.FERIIZ_DATA.ready) window.FERIIZ_DATA.ready.then(render);

            if (applyBtn) {
                applyBtn.addEventListener('click', () => {
                    appliedFilters.type = typeSelect.value.toLowerCase();
                    appliedFilters.start = dateStart.value;
                    appliedFilters.end = dateEnd.value;
                    applyFilters();
                    dropdown.classList.remove('show');
                });
            }

            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    typeSelect.selectedIndex = 0;
                    dateStart.value = '';
                    dateEnd.value = '';
                    appliedFilters.type = '';
                    appliedFilters.start = '';
                    appliedFilters.end = '';
                    applyFilters();
                    dropdown.classList.remove('show');
                });
            }

            if (searchInput) {
                searchInput.addEventListener('input', applyFilters);
            }
        });
    </script>
</body>
</html>
