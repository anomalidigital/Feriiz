    </main>

    <script>
    (function () {
        var state = { all: [], filtered: [], page: 1, perPage: 25 };

        function fmtDay(iso) {
            if (!iso) return '-';
            var d = new Date(iso);
            if (isNaN(d)) return '-';
            var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return days[d.getDay()] + ', ' + d.getDate().toString().padStart(2,'0') + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
        }
        function statusBadgeClass(s) {
            var norm = (s || '').toLowerCase();
            if (norm === 'accepted') return 'badge badge-accepted';
            if (norm === 'rejected') return 'badge badge-rejected';
            return 'badge badge-pending';
        }

        function renderRow(req) {
            var emp = window.FERIIZ_DATA.findEmployeeByCode(req.employeeCode);
            if (!emp) return null;
            var avatar = window.FERIIZ_DATA.avatarSrc(emp);
            var fallback = window.FERIIZ_DATA.initialsAvatar(emp.name);
            var tr = document.createElement('tr');
            tr.innerHTML =
                '<td><div class="action-cell"><button class="btn-icon" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button></div></td>' +
                '<td><div class="employee-cell">' +
                    '<img class="employee-avatar" src="' + avatar + '" alt="" data-fallback="' + fallback + '">' +
                    '<div><div class="employee-name">' + emp.name + '</div><div class="employee-code">' + emp.code + '</div></div>' +
                '</div></td>' +
                '<td>' + req.type + '</td>' +
                '<td>' + fmtDay(req.submittedAt || req.dateStart) + '</td>' +
                '<td>' + fmtDay(req.dateStart) + (req.dateEnd && req.dateEnd !== req.dateStart ? ' – ' + fmtDay(req.dateEnd) : '') + '</td>' +
                '<td>' + (req.pic || '-') + '</td>' +
                '<td><span class="' + statusBadgeClass(req.status) + '">' + req.status + '</span></td>';
            tr.querySelector('img').addEventListener('error', function () {
                if (this.dataset.fallback && this.src !== this.dataset.fallback) this.src = this.dataset.fallback;
            });
            tr.querySelector('.btn-icon').addEventListener('click', function () {
                openModal(emp.name, req.type, fmtDay(req.dateStart), fmtDay(req.dateEnd), req.status);
            });
            return tr;
        }

        function renderPage() {
            var tbody = document.getElementById('requestsTableBody');
            tbody.innerHTML = '';
            var start = (state.page - 1) * state.perPage;
            var end = Math.min(start + state.perPage, state.filtered.length);
            for (var i = start; i < end; i++) {
                var row = renderRow(state.filtered[i]);
                if (row) tbody.appendChild(row);
            }
            document.getElementById('reqPaginationInfo').textContent = state.filtered.length === 0
                ? 'No requests match your filter'
                : 'Showing ' + (start + 1) + ' - ' + end + ' of ' + state.filtered.length + ' results';
            renderPagination();
        }

        function renderPagination() {
            var total = Math.ceil(state.filtered.length / state.perPage) || 1;
            var cur = state.page;
            var box = document.getElementById('reqPaginationButtons');
            box.innerHTML = '';
            var prev = document.createElement('button');
            prev.textContent = '< Previous'; prev.disabled = cur === 1;
            prev.addEventListener('click', function () { if (cur > 1) { state.page--; renderPage(); } });
            box.appendChild(prev);
            var pages = new Set([1, total]);
            for (var i = cur - 2; i <= cur + 2; i++) if (i > 1 && i < total) pages.add(i);
            var sorted = Array.from(pages).sort(function(a,b){return a-b;});
            var last = 0;
            sorted.forEach(function (n) {
                if (last && n - last > 1) {
                    var d = document.createElement('span'); d.className = 'page-dots'; d.textContent = '...'; box.appendChild(d);
                }
                var a = document.createElement('a');
                a.href = '#'; a.textContent = n;
                if (n === cur) { a.className = 'active'; a.setAttribute('aria-current','page'); }
                a.addEventListener('click', function (e) { e.preventDefault(); state.page = n; renderPage(); });
                box.appendChild(a);
                last = n;
            });
            var next = document.createElement('a');
            next.href = '#'; next.textContent = 'Next >';
            if (cur === total) next.style.display = 'none';
            next.addEventListener('click', function (e) { e.preventDefault(); if (cur < total) { state.page++; renderPage(); } });
            box.appendChild(next);
        }

        function updateStatCards() {
            var counts = { Pending: 0, Accepted: 0, Rejected: 0 };
            state.filtered.forEach(function (r) { if (counts[r.status] !== undefined) counts[r.status]++; });
            var cards = document.querySelectorAll('.stat-card');
            if (cards[0]) cards[0].querySelector('.stat-number').textContent = counts.Pending;
            if (cards[1]) cards[1].querySelector('.stat-number').textContent = counts.Accepted;
            if (cards[2]) cards[2].querySelector('.stat-number').textContent = counts.Rejected;
        }

        function applyFilter() {
            var typeSel = document.querySelector('.filter-type');
            var statSel = document.querySelector('.filter-status');
            var search = document.querySelector('.page-actions .feriiz-u-020 input');
            var type = typeSel ? typeSel.value.toLowerCase() : '';
            var status = statSel ? statSel.value.toLowerCase() : '';
            var q = (search?.value || '').trim().toLowerCase();
            state.filtered = state.all.filter(function (r) {
                if (type) {
                    var typeSlug = r.type.toLowerCase().replace(/\s+/g, '_');
                    if (typeSlug !== type) return false;
                }
                if (status && r.status.toLowerCase() !== status) return false;
                if (q) {
                    var emp = window.FERIIZ_DATA.findEmployeeByCode(r.employeeCode);
                    if (!emp || emp.name.toLowerCase().indexOf(q) < 0) return false;
                }
                return true;
            });
            state.page = 1;
            renderPage();
            updateStatCards();
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (!window.FERIIZ_DATA) return;
            window.FERIIZ_DATA.ready.then(function (data) {
                state.all = data.requests.slice();
                state.filtered = state.all.slice();
                renderPage();
                updateStatCards();
                var apply = document.querySelector('.filter-apply-btn');
                var clear = document.querySelector('.filter-clear-btn');
                var search = document.querySelector('.page-actions .feriiz-u-020 input');
                if (apply) apply.addEventListener('click', applyFilter);
                if (clear) clear.addEventListener('click', function () {
                    var typeSel = document.querySelector('.filter-type');
                    var statSel = document.querySelector('.filter-status');
                    if (typeSel) typeSel.value = '';
                    if (statSel) statSel.value = '';
                    if (search) search.value = '';
                    applyFilter();
                });
                if (search) {
                    var timer;
                    search.addEventListener('input', function () {
                        clearTimeout(timer); timer = setTimeout(applyFilter, 200);
                    });
                }
            });
        });
    })();
    </script>

    <script>
        function openModal(name, type, dateReq, dateRange, status) {
            document.getElementById('modalTitle').textContent = 'Approval ' + name;
            document.getElementById('modalRequest').textContent = type || 'Sick Leave';
            document.getElementById('modalDateRequest').textContent = dateReq || 'Thu, 05 Mar 2026';
            document.getElementById('modalDate').textContent = dateRange || 'Thu, 05 Mar 2026';
            const sel = document.getElementById('modalStatus');
            for (let i = 0; i < sel.options.length; i++) {
                if (sel.options[i].text === status) { sel.selectedIndex = i; break; }
            }
            document.getElementById('approvalModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        function closeModal() {
            document.getElementById('approvalModal').classList.remove('show');
            document.body.style.overflow = '';

            // Reset dynamic fields
            const noteInput = document.getElementById('modalNoteInput');
            const notifWrapper = document.getElementById('modalNotificationWrapper');
            if (noteInput && notifWrapper) {
                noteInput.value = '';
                notifWrapper.style.display = 'none';
            }
        }
        document.getElementById('approvalModal').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        // Add Request Modal handlers
        function openAddRequestModal() {
            document.getElementById('addRequestModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeAddRequestModal() {
            document.getElementById('addRequestModal').classList.remove('show');
            document.body.style.overflow = '';

            // Clean up progressive layout changes
            // Progressive disclosure removed - all fields visible immediately
        }

        // Dynamic Notification Checkbox logic
        document.addEventListener('DOMContentLoaded', () => {
            const modalNoteInput = document.getElementById('modalNoteInput');
            const modalNotificationWrapper = document.getElementById('modalNotificationWrapper');

            if (modalNoteInput && modalNotificationWrapper) {
                modalNoteInput.addEventListener('input', function () {
                    if (this.value.trim() !== '') {
                        modalNotificationWrapper.style.display = 'block';
                    } else {
                        modalNotificationWrapper.style.display = 'none';
                    }
                });
            }

            // Progressive disclosure for Add Request Modal
            // Progressive disclosure removed - all fields visible immediately

            const toggleBtn = document.querySelector('.filter-toggle-btn');
            const dropdown = document.querySelector('.filter-dropdown');
            const applyBtn = document.querySelector('.filter-apply-btn');
            const clearBtn = document.querySelector('.filter-clear-btn');
            const statusSelect = document.querySelector('.filter-status');
            const tableRows = document.querySelectorAll('.data-table tbody tr');

            if (toggleBtn && dropdown) {
                toggleBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdown.classList.toggle('show');
                    toggleBtn.classList.toggle('active');
                });

                document.addEventListener('click', (e) => {
                    if (!dropdown.contains(e.target) && !toggleBtn.contains(e.target)) {
                        dropdown.classList.remove('show');
                        toggleBtn.classList.remove('active');
                    }
                });

                dropdown.addEventListener('click', (e) => {
                    e.stopPropagation();
                });
            }

            const applyFilter = () => {
                const typeVal = document.querySelector('.filter-type').value.toLowerCase();
                const statusVal = statusSelect.value.toLowerCase();
                const dateInputs = document.querySelectorAll('.filter-date');
                const startDateStr = dateInputs[0].value;
                const endDateStr = dateInputs[1].value;
                
                let startFilter = null;
                let endFilter = null;
                if (startDateStr) startFilter = new Date(startDateStr).getTime();
                if (endDateStr) endFilter = new Date(endDateStr).getTime();

                tableRows.forEach(row => {
                    const typeCell = row.querySelector('td:nth-child(3)');
                    const startDateCell = row.querySelector('td:nth-child(4)');
                    const statusCell = row.querySelector('td:nth-child(7)');
                    if (!typeCell || !statusCell || !startDateCell) return;

                    const typeText = typeCell.textContent.toLowerCase();
                    const statusText = statusCell.textContent.toLowerCase();
                    const rowDateStr = startDateCell.textContent.trim();
                    let rowDateTime = null;
                    if (rowDateStr && rowDateStr !== '-') {
                        rowDateTime = new Date(rowDateStr).getTime();
                    }

                    let matchType = (typeVal === '' || typeText.includes(typeVal.replace(/_/g, ' ')));
                    let matchStatus = (statusVal === '' || statusText.includes(statusVal));
                    let matchDate = true;
                    
                    if (rowDateTime) {
                        if (startFilter && rowDateTime < startFilter) matchDate = false;
                        if (endFilter && rowDateTime > endFilter + 86400000) matchDate = false;
                    } else if (startFilter || endFilter) {
                        matchDate = false;
                    }

                    if (matchType && matchStatus && matchDate) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
                dropdown.classList.remove('show');
                toggleBtn.classList.remove('active');
            };

            if (applyBtn) applyBtn.addEventListener('click', applyFilter);

            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    document.querySelector('.filter-type').selectedIndex = 0;
                    document.querySelector('.filter-status').selectedIndex = 0;
                    document.querySelectorAll('.filter-date').forEach(input => input.value = '');
                    applyFilter();
                });
            }
        });
    </script>
