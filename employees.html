<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feriiz - Employees</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/customize.css?v=3.7.39">
    <link rel="stylesheet" href="assets/css/style.css?v=3.7.39">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="assets/js/data.js?v=3.7.39" defer></script>
    <script src="assets/js/app.js?v=3.7.39" defer></script>
    <script src="assets/js/employee-form.js?v=3.7.39" defer></script>
</head>

<body data-page="employees">
    <aside class="sidebar"></aside>

    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">Employees</h1>
            <div class="page-actions">
                <div class="feriiz-u-014">
                    <button class="btn btn-outline filter-toggle-btn" title="Filter">
                        <i class="fa-solid fa-filter"></i>
                    </button>
                    <div class="filter-dropdown feriiz-u-015">
                        <div class="feriiz-u-016">Filter Employees</div>
                        <label>Occupation</label>
                        <select class="input filter-occ feriiz-u-017"></select>
                        <label>Project</label>
                        <select class="input filter-project feriiz-u-017" id="filterProject">
                            <option value="">All Projects</option>
                        </select>
                        <div class="feriiz-u-018">
                            <button class="btn btn-outline filter-clear-btn feriiz-u-019">Clear</button>
                            <button class="btn btn-primary filter-apply-btn feriiz-u-019">Apply</button>
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary">
                    <i class="fa-solid fa-file-export"></i>
                    Export
                </button>
                <button class="btn btn-primary" type="button" id="addEmployeeBtn">
                    <i class="fa-solid fa-plus"></i>
                    Add Employee
                </button>
                <div class="search-autocomplete-wrap feriiz-u-014">
                    <div class="feriiz-u-020">
                        <i class="fa-solid fa-magnifying-glass feriiz-u-021"></i>
                        <input type="text" id="employeeSearchInput" placeholder="Search" autocomplete="off" class="feriiz-u-022">
                    </div>
                    <div class="search-dropdown" id="searchDropdown"></div>
                </div>
            </div>
        </div>

        <div class="stat-cards feriiz-u-023">
            <div class="stat-card feriiz-u-024">
                <div class="stat-card-icon feriiz-u-025">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="stat-card-info">
                    <div class="stat-number feriiz-u-026" data-stat="employees">0</div>
                    <div class="stat-label feriiz-u-027">Employees</div>
                </div>
            </div>
            <div class="stat-card feriiz-u-024">
                <div class="stat-card-icon feriiz-u-025">
                    <i class="fa-solid fa-briefcase"></i>
                </div>
                <div class="stat-card-info">
                    <div class="stat-number feriiz-u-026" data-stat="occupations">0</div>
                    <div class="stat-label feriiz-u-027">Occupations</div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="feriiz-u-028"></th>
                        <th>Name</th>
                        <th>Occupation</th>
                        <th>Pin</th>
                        <th>Joined</th>
                    </tr>
                </thead>
                <tbody id="employeesTableBody"></tbody>
            </table>
            <div class="pagination">
                <div class="pagination-info" id="paginationInfo">Showing 0 results</div>
                <div class="pagination-buttons" id="paginationButtons"></div>
            </div>
        </div>
        <div class="feriiz-u-032">version : 3.7.39</div>
    </main>

    <script>
        var employeesState = {
            all: [],
            filtered: [],
            filters: { occupations: [], project: '' },
            page: 1,
            perPage: 25
        };

        // Add and edit use the shared employee form (assets/js/employee-form.js).
        function openEmployeeForm(emp) {
            // Schedule and overtime defaults come from the employee's first project.
            var project = emp && emp.projects && emp.projects.length
                ? window.FERIIZ_DATA.findProjectByCode(emp.projects[0]) : null;
            window.FeriizEmployeeForm.open({
                employee: emp,
                project: project,
                onSave: function (v, isNew) {
                    var target = emp || {
                        code: 'NEW' + Date.now().toString(36).toUpperCase(),
                        projects: [],
                        status: 'Active',
                        joinedAt: new Date().toISOString().slice(0, 10)
                    };
                    target.name = v.name;
                    target.firstName = v.firstName;
                    target.middleName = v.middleName;
                    target.lastName = v.lastName;
                    target.occupation = v.occupation;
                    target.pin = v.pin;
                    target.phone = v.phone;
                    target.email = v.email;
                    target.gender = v.gender;
                    target.birthDate = v.birthDate;
                    target.note = v.note;
                    target.status = v.status;
                    target.role = v.role;
                    target.workStart = v.startHour;
                    target.workEnd = v.endHour;
                    target.cutOff = v.cutOff;
                    target.workingDays = v.workingDays;
                    target.dailyRate = v.dailyRate;
                    target.overtimeRate = v.overtimeRate;
                    target.clientDailyRate = v.clientDailyRate;
                    target.clientOvertimeRate = v.clientOvertimeRate;
                    target.transportPerDay = v.transportPerDay;
                    if (isNew) employeesState.all.unshift(target);
                    applyEmployeeFilter();
                    document.querySelector('[data-stat="employees"]').textContent = employeesState.all.length.toLocaleString('id-ID');
                }
            });
        }

        function formatJoinedDate(iso) {
            if (!iso) return '-';
            var d = new Date(iso);
            if (isNaN(d)) return '-';
            var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            return d.getDate().toString().padStart(2,'0') + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
        }

        function renderEmployeeRow(emp) {
            var avatar = window.FERIIZ_DATA.avatarSrc(emp);
            var fallback = window.FERIIZ_DATA.initialsAvatar(emp.name);
            var tr = document.createElement('tr');
            tr.innerHTML =
                '<td>' +
                    '<div class="action-cell">' +
                        '<a href="#" class="btn-icon" title="Edit" data-code="' + emp.code + '"><i class="fa-solid fa-pen-to-square"></i></a>' +
                        '<a href="employee_attendance.html?employee=' + emp.code + '" class="btn-icon" title="Attendance"><i class="fa-solid fa-calendar-check"></i></a>' +
                        '<a href="employee_projects.html?employee=' + emp.code + '" class="btn-icon" title="Projects"><i class="fa-regular fa-clipboard"></i></a>' +
                    '</div>' +
                '</td>' +
                '<td>' +
                    '<div class="employee-cell feriiz-u-029">' +
                        '<img src="' + avatar + '" alt="" class="feriiz-u-030" data-fallback="' + fallback + '">' +
                        '<div>' +
                            '<div class="employee-name">' + emp.name + '</div>' +
                            '<div class="employee-code feriiz-u-031">' + emp.code + '</div>' +
                        '</div>' +
                    '</div>' +
                '</td>' +
                '<td>' + emp.occupation + '</td>' +
                '<td>' + emp.pin + '</td>' +
                '<td>' + formatJoinedDate(emp.joinedAt) + '</td>';
            tr.querySelector('.btn-icon[data-code]').addEventListener('click', function (e) {
                e.preventDefault();
                openEmployeeForm(emp);
            });
            tr.querySelector('img').addEventListener('error', function () {
                if (this.dataset.fallback && this.src !== this.dataset.fallback) this.src = this.dataset.fallback;
            });
            return tr;
        }

        function renderPage() {
            var tbody = document.getElementById('employeesTableBody');
            tbody.innerHTML = '';
            var start = (employeesState.page - 1) * employeesState.perPage;
            var end = Math.min(start + employeesState.perPage, employeesState.filtered.length);
            for (var i = start; i < end; i++) {
                tbody.appendChild(renderEmployeeRow(employeesState.filtered[i]));
            }
            document.getElementById('paginationInfo').textContent =
                employeesState.filtered.length === 0
                    ? 'No employees match your filter'
                    : 'Showing ' + (start + 1) + ' - ' + end + ' of ' + employeesState.filtered.length + ' results';
            renderPaginationButtons();
        }

        function renderPaginationButtons() {
            var total = Math.ceil(employeesState.filtered.length / employeesState.perPage) || 1;
            var current = employeesState.page;
            var btns = document.getElementById('paginationButtons');
            btns.innerHTML = '';
            var prev = document.createElement('button');
            prev.textContent = '< Previous';
            prev.disabled = current === 1;
            prev.addEventListener('click', function () { if (current > 1) { employeesState.page--; renderPage(); } });
            btns.appendChild(prev);

            function addPage(n) {
                var a = document.createElement('a');
                a.href = '#';
                a.textContent = n;
                if (n === current) { a.className = 'active'; a.setAttribute('aria-current', 'page'); }
                a.addEventListener('click', function (e) { e.preventDefault(); employeesState.page = n; renderPage(); });
                btns.appendChild(a);
            }
            function addDots() { var s = document.createElement('span'); s.className = 'page-dots'; s.textContent = '...'; btns.appendChild(s); }

            var window_ = 2;
            var pages = new Set([1, total]);
            for (var i = current - window_; i <= current + window_; i++) if (i > 1 && i < total) pages.add(i);
            var sorted = Array.from(pages).sort(function(a,b){return a-b;});
            var lastN = 0;
            sorted.forEach(function (n) {
                if (lastN && n - lastN > 1) addDots();
                addPage(n);
                lastN = n;
            });

            var next = document.createElement('a');
            next.href = '#';
            next.textContent = 'Next >';
            if (current === total) next.style.display = 'none';
            next.addEventListener('click', function (e) { e.preventDefault(); if (current < total) { employeesState.page++; renderPage(); } });
            btns.appendChild(next);
        }

        function applyEmployeeFilter() {
            var occs = employeesState.filters.occupations;
            var proj = employeesState.filters.project;
            var q = (document.getElementById('employeeSearchInput').value || '').trim().toLowerCase();
            employeesState.filtered = employeesState.all.filter(function (emp) {
                // Exact match: "Surveyor" must not also pick "Quantity Surveyor".
                if (occs.length && occs.indexOf((emp.occupation || '').trim().toLowerCase()) < 0) return false;
                if (proj && !(emp.projects || []).includes(proj)) return false;
                if (q && (emp.name.toLowerCase().indexOf(q) < 0 && emp.code.toLowerCase().indexOf(q) < 0)) return false;
                return true;
            });
            employeesState.page = 1;
            renderPage();
        }

        function commitEmployeeFilterDraft() {
            employeesState.filters = {
                occupations: window.FeriizFilters?.getOccupationValues(document) || [],
                project: document.getElementById('filterProject').value
            };
        }

        document.addEventListener('DOMContentLoaded', function () {
            if (!window.FERIIZ_DATA) return;
            window.FERIIZ_DATA.ready.then(function (data) {
                employeesState.all = data.employees.slice();
                employeesState.filtered = employeesState.all.slice();

                document.querySelector('[data-stat="employees"]').textContent = data.employees.length.toLocaleString('id-ID');
                document.querySelector('[data-stat="occupations"]').textContent = data.occupations.length;

                var filterProject = document.getElementById('filterProject');
                data.projects.forEach(function (p) {
                    var opt = document.createElement('option');
                    opt.value = p.code;
                    opt.textContent = p.name;
                    filterProject.appendChild(opt);
                });

                renderPage();

                var apply = document.querySelector('.filter-apply-btn');
                var clear = document.querySelector('.filter-clear-btn');
                if (apply) apply.addEventListener('click', function () {
                    commitEmployeeFilterDraft();
                    applyEmployeeFilter();
                });
                if (clear) clear.addEventListener('click', function () {
                    window.FeriizFilters?.resetOccupationFilter(document);
                    filterProject.value = '';
                    document.getElementById('employeeSearchInput').value = '';
                    employeesState.filters = { occupations: [], project: '' };
                    applyEmployeeFilter();
                });
                var searchInput = document.getElementById('employeeSearchInput');
                if (searchInput) {
                    var timer;
                    searchInput.addEventListener('input', function () {
                        clearTimeout(timer);
                        timer = setTimeout(applyEmployeeFilter, 200);
                    });
                }
            });

            document.getElementById('addEmployeeBtn').addEventListener('click', function () {
                openEmployeeForm(null);
            });
        });
    </script>

</body>
</html>
