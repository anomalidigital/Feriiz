<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feriiz - Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=3.2.0">
</head>

<body class="login-body">

    <!-- Forgot Password Card -->
    <div class="login-card">
        <div class="login-card-header">
            <img src="assets/images/icon_feriiz.png" alt="Feriiz" class="login-card-logo">
            <h1 class="login-title">Forgot Password</h1>
            <p class="login-subtitle">Enter your email and we'll send you a reset link</p>
        </div>

        <!-- Step 1: Email Input -->
        <form class="login-form" id="forgotForm" onsubmit="handleForgot(event)">
            <div class="login-field">
                <label for="forgotEmail">Email address</label>
                <div class="login-input-wrap">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="forgotEmail" class="input" placeholder="Enter your registered email" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary login-btn">
                <i class="fa-solid fa-paper-plane"></i>
                Send Reset Link
            </button>

            <!-- Error Message -->
            <div class="login-error" id="forgotError" style="display:none;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <div>
                    <div class="login-error-title" id="errorTitle">Email Not Found</div>
                    <div class="login-error-msg" id="errorMsg">No account associated with this email</div>
                </div>
            </div>
        </form>

        <!-- Step 2: Success State -->
        <div class="forgot-success" id="forgotSuccess" style="display:none;">
            <div class="forgot-success-icon">
                <i class="fa-solid fa-envelope-circle-check"></i>
            </div>
            <h2 class="forgot-success-title">Check your email</h2>
            <p class="forgot-success-msg">We've sent a password reset link to <strong id="sentEmail"></strong></p>
            <p class="forgot-success-hint">Didn't receive it? Check your spam folder or try again.</p>
            <button class="btn btn-outline login-btn" onclick="resetForm()">
                <i class="fa-solid fa-arrow-rotate-left"></i>
                Try another email
            </button>
        </div>

        <div class="login-footer">
            <a href="login.html" class="forgot-back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>

    <script>
        function handleForgot(e) {
            e.preventDefault();
            var email = document.getElementById('forgotEmail').value;
            var btn = e.target.querySelector('button[type="submit"]');
            var errorBox = document.getElementById('forgotError');

            // Hide previous error
            errorBox.style.display = 'none';

            // Loading state
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

            // Demo: simulate sending (UI only)
            setTimeout(function() {
                document.getElementById('forgotForm').style.display = 'none';
                document.getElementById('sentEmail').textContent = email;
                document.getElementById('forgotSuccess').style.display = 'block';
            }, 1500);
        }

        function resetForm() {
            document.getElementById('forgotSuccess').style.display = 'none';
            document.getElementById('forgotForm').style.display = 'flex';
            document.getElementById('forgotEmail').value = '';
            var btn = document.querySelector('button[type="submit"]');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Reset Link';
        }

        function showError(title, message) {
            var errorBox = document.getElementById('forgotError');
            document.getElementById('errorTitle').textContent = title;
            document.getElementById('errorMsg').textContent = message;
            errorBox.style.display = 'flex';
            errorBox.classList.remove('shake');
            void errorBox.offsetWidth;
            errorBox.classList.add('shake');
        }
    </script>

</body>

</html>
