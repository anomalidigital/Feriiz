<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feriiz - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=3.5.7">
    <script src="assets/js/data.js?v=3.5.7" defer></script>
    <script src="assets/js/app.js?v=3.5.7" defer></script>
</head>

<body data-page="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar"></aside>

    <main class="main-content">
        <!-- Header -->
        <div class="page-header feriiz-u-163">
            <h1 class="page-title">Dashboard</h1>
            <div class="page-actions feriiz-u-164">
                <div class="feriiz-u-014">
                    <button class="btn btn-outline filter-toggle-btn" title="Filter">
                        <i class="fa-solid fa-filter"></i>
                    </button>
                    <div class="filter-dropdown feriiz-u-015">
                        <div class="feriiz-u-016">Filter Activity
                        </div>
                        <label>Date Range</label>
                        <div class="feriiz-u-003">
                            <input type="date" class="input filter-date feriiz-u-004">
                            <span class="feriiz-u-005">-</span>
                            <input type="date" class="input filter-date feriiz-u-004">
                        </div>
                        <label>Occupation</label>
                        <select class="input filter-occ feriiz-u-017"
                           >
                            <option>All Occupations</option>
                            <option>Graphic Design</option>
                            <option>Sr.Programmer</option>
                            <option>Teknisi</option>
                            <option>Manager</option>
                            <option>Marketing</option>
                            <option>Frontend</option>
                            <option>Backend</option>
                            <option>HR Administrator</option>
                            <option>3D Artist</option>
                            <option>Tukang Kayu</option>
                            <option>Tukang Keramik</option>
                            <option>Tukang Las</option>
                            <option>Mandor Lapangan</option>
                            <option>Surveyor</option>
                        </select>
                        <div class="feriiz-u-018">
                            <button class="btn btn-outline filter-clear-btn feriiz-u-019">Clear</button>
                            <button class="btn btn-primary filter-apply-btn feriiz-u-019">Apply</button>
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary">
                    <i class="fa-solid fa-file-export"></i>
                    Export
                </button>
                <div class="feriiz-u-020">
                    <i class="fa-solid fa-magnifying-glass feriiz-u-067"
                       ></i>
                    <input type="text" placeholder="Search" class="feriiz-u-068">
                </div>
            </div>
        </div>

        <!-- Stat Cards -->
        <div class="stat-cards feriiz-u-023">
            <div class="stat-card feriiz-u-024">
                <div class="stat-card-icon feriiz-u-025">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="stat-card-info">
                    <div class="stat-number feriiz-u-026" data-stat="employees">0</div>
                    <div class="stat-label feriiz-u-165">Employees</div>
                </div>
            </div>
            <div class="stat-card feriiz-u-024">
                <div class="stat-card-icon feriiz-u-025">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
                <div class="stat-card-info">
                    <div class="stat-number feriiz-u-026" data-stat="attendance">0</div>
                    <div class="stat-label feriiz-u-027">Attendance</div>
                </div>
            </div>
            <div class="stat-card feriiz-u-024">
                <div class="stat-card-icon feriiz-u-025">
                    <i class="fa-solid fa-briefcase"></i>
                </div>
                <div class="stat-card-info">
                    <div class="stat-number feriiz-u-026" data-stat="occupations">0</div>
                    <div class="stat-label feriiz-u-027">Occupations</div>
                </div>
            </div>
        </div>

        <!-- Table: Group by Occupation -->
        <div class="table-container dashboard-table-container">
            <table class="data-table dashboard-table" id="dashboardTable">
                <thead><tr id="dashboardTableHead"><th>Occupation</th></tr></thead>
                <tbody id="dashboardTableBody"></tbody>
                <tfoot><tr class="feriiz-u-166" id="dashboardTableFoot"></tr></tfoot>
            </table>
        </div>

        <div class="feriiz-u-032">version : 3.5.7</div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!window.FERIIZ_DATA) return;

            window.FERIIZ_DATA.ready.then(data => {
                // Stat cards
                const setStat = (k, v) => {
                    const el = document.querySelector('[data-stat="' + k + '"]');
                    if (el) el.textContent = v.toLocaleString('id-ID');
                };
                setStat('employees', data.employees.length);
                // Attendance today: sum of unique employee codes marked 'present' or with times
                const todayAttended = new Set(
                    data.attendance
                        .filter(a => a.status === 'present' && a.inTime)
                        .map(a => a.employeeCode)
                ).size;
                setStat('attendance', todayAttended || data.employees.length);
                setStat('occupations', data.occupations.length);

                // Build occupation × project matrix
                const projects = data.projects;
                const occupations = data.occupations;
                const head = document.getElementById('dashboardTableHead');
                projects.forEach(p => {
                    const th = document.createElement('th');
                    th.textContent = p.name;
                    th.title = p.code;
                    head.appendChild(th);
                });

                // Count employees per (occupation, project)
                const counts = {};
                occupations.forEach(o => { counts[o] = {}; projects.forEach(p => counts[o][p.code] = 0); });
                data.employees.forEach(emp => {
                    if (!counts[emp.occupation]) return;
                    (emp.projects || []).forEach(pc => {
                        if (counts[emp.occupation][pc] !== undefined) counts[emp.occupation][pc]++;
                    });
                });

                const body = document.getElementById('dashboardTableBody');
                const totals = {};
                projects.forEach(p => { totals[p.code] = 0; });
                occupations.forEach(o => {
                    const rowTotal = projects.reduce((s, p) => s + counts[o][p.code], 0);
                    if (rowTotal === 0) return; // skip empty occupations
                    const tr = document.createElement('tr');
                    tr.appendChild(cell(o));
                    projects.forEach(p => {
                        const v = counts[o][p.code];
                        totals[p.code] += v;
                        tr.appendChild(cell(v + ' Person'));
                    });
                    body.appendChild(tr);
                });

                const foot = document.getElementById('dashboardTableFoot');
                foot.appendChild(cell(''));
                projects.forEach(p => foot.appendChild(cell(totals[p.code] + ' Person', 'feriiz-u-167')));

                function cell(text, cls) {
                    const td = document.createElement('td');
                    td.textContent = text;
                    if (cls) td.className = cls;
                    return td;
                }

                // Occupation filter — hide rows not matching selection
                const applyOccupationFilter = () => {
                    const selected = window.FeriizFilters?.getOccupationValues(document) || [];
                    body.querySelectorAll('tr').forEach(row => {
                        const occText = row.firstElementChild?.textContent.toLowerCase() || '';
                        row.style.display = selected.length === 0 || selected.some(o => occText.includes(o))
                            ? '' : 'none';
                    });
                };
                const applyBtn = document.querySelector('.filter-apply-btn');
                const clearBtn = document.querySelector('.filter-clear-btn');
                if (applyBtn) applyBtn.addEventListener('click', applyOccupationFilter);
                if (clearBtn) clearBtn.addEventListener('click', () => {
                    window.FeriizFilters?.resetOccupationFilter(document);
                    document.querySelectorAll('.filter-date').forEach(i => i.value = '');
                    applyOccupationFilter();
                });
            });
        });
    </script>

</body>


</html>
