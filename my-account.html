<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feriiz - My Account</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=3.5.7">
    <script src="assets/js/data.js?v=3.5.7" defer></script>
    <script src="assets/js/app.js?v=3.5.7" defer></script>
</head>

<body data-page="my-account">

  <!-- Sidebar -->
    <aside class="sidebar"></aside>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Header -->
    <div class="page-header">
      <h1 class="page-title">Account</h1>
      <div class="page-actions">
        <a class="btn btn-outline account-partner-link" href="partner.html">
          <i class="fa-solid fa-users"></i>
          Partner
        </a>
        <button class="btn btn-danger" onclick="feriizLogout()">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          Logout
        </button>
      </div>
    </div>

    <!-- 3-Column Grid -->
    <div class="three-col-grid">

      <!-- Column 1: Profile Info -->
      <div class="card">
        <div class="feriiz-u-168">
          <div class="feriiz-u-169">
            <i class="fa-solid fa-user feriiz-u-170"></i>
          </div>
          <div>
            <div class="feriiz-u-171">Baldyas Satrio</div>
            <div class="feriiz-u-093">Admin</div>
          </div>
        </div>

        <div class="info-row">
          <span class="info-label">Code</span>
          <span class="info-value feriiz-u-172">BILFBY9N8YJ1YDN</span>
        </div>
        <div class="info-row">
          <span class="info-label">Email</span>
          <span class="info-value feriiz-u-173">baldy@anomalistudio.co.id</span>
        </div>
        <div class="info-row">
          <span class="info-label">Mobile</span>
          <span class="info-value">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Gender</span>
          <span class="info-value">Male</span>
        </div>
        <div class="info-row">
          <span class="info-label">Company</span>
          <span class="info-value">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Pin</span>
          <span class="info-value feriiz-u-174">3131</span>
        </div>
      </div>

      <!-- Column 2: OTP & Security -->
      <div class="card">
        <div class="card-title feriiz-u-175">
          <i class="fa-solid fa-lock feriiz-u-176"></i>
          Security
        </div>

        <!-- OTP Display -->
        <div class="feriiz-u-177">
          <div class="feriiz-u-178">OTP</div>
          <div class="otp-display">
            <div class="otp-number">4536</div>
          </div>
        </div>

        <!-- OTP Change In -->
        <div>
          <div class="feriiz-u-178">OTP Change In</div>
          <div class="feriiz-u-179">
            <div class="feriiz-u-180">1340 Minutes 55 Seconds</div>
            <div class="cooldown-bar">
              <div class="cooldown-progress feriiz-u-181"></div>
            </div>
            <div class="cooldown-text feriiz-u-182">Cooldown active -- please wait for reset</div>
          </div>
        </div>
      </div>

      <!-- Column 3: Assigned Projects -->
      <div class="card">
        <div class="card-title feriiz-u-183">
          <span class="feriiz-u-175">
            <i class="fa-solid fa-folder feriiz-u-176"></i>
            Assigned Projects
          </span>
        </div>

        <div class="project-list feriiz-u-184" id="assignedProjectsList"></div>
      </div>

    </div>

    <!-- Version -->
    <div class="feriiz-u-032">version : 3.5.7</div>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (!window.FERIIZ_DATA || !window.FERIIZ_DATA.ready) return;
      window.FERIIZ_DATA.ready.then(function (data) {
        var list = document.getElementById('assignedProjectsList');
        if (!list) return;
        // For the demo, "assigned projects" = every project in the dataset.
        // A real backend would filter by the signed-in employee.
        data.projects.forEach(function (p) {
          var a = document.createElement('a');
          a.href = 'project_employees.html?project=' + encodeURIComponent(p.code);
          a.className = 'project-item feriiz-u-185';
          a.innerHTML =
            '<div>' +
              '<div class="project-item-name">' + p.name + '</div>' +
              '<div class="project-item-type">' + (p.type || 'Attendance') + '</div>' +
            '</div>' +
            '<div class="feriiz-u-029">' +
              '<div class="project-item-employee">' + (p.employeeCount || 0) + '</div>' +
              '<i class="fa-solid fa-chevron-right feriiz-u-186"></i>' +
            '</div>';
          list.appendChild(a);
        });
      });
    });
  </script>

</body>

</html>
