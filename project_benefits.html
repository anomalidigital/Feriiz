<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feriiz - Benefits</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/customize.css?v=3.7.77">
    <link rel="stylesheet" href="assets/css/style.css?v=3.7.77">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="assets/js/data.js?v=3.7.77" defer></script>
    <script src="assets/js/app.js?v=3.7.77" defer></script>
    <script src="assets/js/request-templates.js?v=3.7.77" defer></script>
</head>

<!-- A project's Benefits: THR, pay for the red dates and other one-off amounts (Baldy, 09-11-2026:
     "taro nya paling ideal yang itu di project", not called a template there, and a professional
     name that does not say "pay": "jangan berbau pay… tapi emang fungsinya buat pembayaran"; each
     one just "tanggal berapa dan berapa amount nya… ga perlu ada add date"; meeting 05-11-2026,
     0:38:14 and 1:04:16). Name, Date, Amount, Note, with no note under the title (crossed out).
     Copy makes a new one from it, in this project or another. -->
<body data-page="project-benefits">
    <!-- Sidebar -->
    <aside class="sidebar"></aside>

    <main class="main-content">
        <div class="page-header">
            <div>
                <div class="breadcrumb feriiz-u-150">
                    <a href="projects.html">Projects</a>
                    <span>&gt;</span>
                    <a href="project_employees.html" id="payProjectLink" data-project-name>Project</a>
                    <span>&gt;</span>
                    <span class="feriiz-u-057">Benefits</span>
                </div>
                <h1 class="page-title">Benefits</h1>
            </div>
            <div class="page-actions">
                <button class="btn btn-primary" type="button" id="addPayBtn">
                    <i class="fa-solid fa-plus"></i>
                    Add Benefit
                </button>
                <div class="feriiz-u-020">
                    <i class="fa-solid fa-magnifying-glass feriiz-u-067"></i>
                    <input type="text" id="paySearch" placeholder="Search" class="feriiz-u-068" aria-label="Search benefits">
                </div>
            </div>
        </div>

        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="feriiz-u-028"></th>
                        <th>Name</th>
                        <th>Date</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="payTableBody"></tbody>
            </table>
        </div>
        <div class="feriiz-u-032">version : 3.7.77</div>
    </main>

    <div class="modal fade" id="payModal" tabindex="-1" aria-labelledby="payModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="payForm" novalidate>
                <div class="modal-header">
                    <div>
                        <h2 class="modal-title" id="payModalTitle">Add Benefit</h2>
                        <p class="tpl-subtitle" id="payModalContext"></p>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="payProjectBlock" hidden>
                        <label class="form-label" for="payProject">Copy to</label>
                        <select class="form-select mb-3" id="payProject"></select>
                    </div>
                    <label class="form-label" for="payName">Name</label>
                    <input type="text" class="form-control" id="payName" placeholder="For example: THR Idul Fitri 2026" autocomplete="off">
                    <div class="row g-3 mt-0">
                        <div class="col-sm-6">
                            <label class="form-label" for="payDate">Date</label>
                            <input type="date" class="form-control" id="payDate">
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label" for="payAmount">Amount</label>
                            <div class="input-group">
                                <span class="input-group-text">Rp</span>
                                <input type="text" inputmode="numeric" class="form-control" id="payAmount" placeholder="0">
                            </div>
                        </div>
                    </div>
                    <label class="form-label d-block mt-3" for="payNote">Note <span class="tpl-optional">(Optional)</span></label>
                    <textarea class="form-control" id="payNote" rows="2" placeholder="Who gets it"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="paySave">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        (function () {
            var project = null;
            var projects = [];
            var editing = null;   // the benefit being edited
            var source = null;    // the benefit being copied

            function esc(v) {
                return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function T() { return window.FeriizTemplates; }

            function digits(v) { return Number(String(v || '').replace(/\D/g, '')) || 0; }
            function typed(n) { return n ? Number(n).toLocaleString('id-ID') : ''; }

            // In date order, as on a calendar; one without a date comes last.
            function render() {
                var tbody = document.getElementById('payTableBody');
                if (!project) return;
                var q = document.getElementById('paySearch').value.trim().toLowerCase();
                var rows = T().ofProject(project.code).filter(function (t) {
                    return !q || (t.name + ' ' + (t.note || '')).toLowerCase().indexOf(q) >= 0;
                }).sort(function (a, b) { return (a.date || '9').localeCompare(b.date || '9'); });
                if (!rows.length) {
                    tbody.innerHTML = '<tr><td colspan="4" class="tpl-empty">' +
                        (q ? 'No benefit matches your search.' : 'This project has no benefits yet. Add the first one, for example THR Idul Fitri 2026.') + '</td></tr>';
                    return;
                }
                tbody.innerHTML = rows.map(function (t) {
                    return '<tr>' +
                        '<td><div class="action-cell">' +
                            '<a href="#" class="btn-icon" title="Edit" aria-label="Edit ' + esc(t.name) + '" data-edit="' + esc(t.id) + '"><i class="fa-solid fa-pen-to-square"></i></a>' +
                            '<a href="#" class="btn-icon" title="Copy" aria-label="Copy ' + esc(t.name) + '" data-copy="' + esc(t.id) + '"><i class="fa-regular fa-copy"></i></a>' +
                        '</div></td>' +
                        '<td><div class="fw-semibold">' + esc(t.name) + '</div>' + (t.note ? '<div class="tpl-sub">' + esc(t.note) + '</div>' : '') + '</td>' +
                        '<td class="tpl-nowrap">' + (t.date ? T().fmtDate(t.date) : '<span class="tpl-sub">No date yet</span>') + '</td>' +
                        '<td class="tpl-amount">' + T().rupiah(t.amount) + '</td>' +
                    '</tr>';
                }).join('');
            }

            /* ---------- add / edit / copy ---------- */
            // Where it is saved: the chosen project when copying, else this one.
            function targetCode() {
                return source ? document.getElementById('payProject').value : project.code;
            }

            // A copy keeps its name in another project, and takes " (copy)" where the name is taken.
            function copyName() {
                return T().findByName(source.name, targetCode()) ? source.name + ' (copy)' : source.name;
            }

            function openForm(t, copying) {
                editing = copying ? null : (t || null);
                source = copying ? t : null;
                document.getElementById('payModalTitle').textContent = copying ? 'Copy Benefit' : t ? 'Edit Benefit' : 'Add Benefit';
                document.getElementById('payModalContext').textContent = copying ? 'From ' + project.name : project.name;
                document.getElementById('payProjectBlock').hidden = !copying;
                if (copying) {
                    document.getElementById('payProject').innerHTML = projects.map(function (p) {
                        return '<option value="' + esc(p.code) + '"' + (p.code === project.code ? ' selected' : '') + '>' + esc(p.name) + '</option>';
                    }).join('');
                }
                document.getElementById('payName').value = copying ? copyName() : (t ? t.name : '');
                document.getElementById('payDate').value = t ? (t.date || '') : '';
                document.getElementById('payAmount').value = t ? typed(t.amount) : '';
                document.getElementById('payNote').value = t ? (t.note || '') : '';
                document.getElementById('paySave').textContent = copying ? 'Save Copy' : 'Save';
                document.querySelectorAll('#payForm .is-invalid').forEach(function (el) { el.classList.remove('is-invalid'); });
                window.bootstrap.Modal.getOrCreateInstance(document.getElementById('payModal')).show();
            }

            function warn(text) {
                if (window.FeriizNotify) FeriizNotify.warning(text, 'Benefit not saved');
            }

            function saveForm(e) {
                e.preventDefault();
                var name = document.getElementById('payName');
                var date = document.getElementById('payDate');
                var amount = document.getElementById('payAmount');
                var value = digits(amount.value);
                var code = targetCode();
                // The name is also the column title in the project's Report: it may not repeat a
                // template for every project or another benefit of that project. "Transport" is the
                // Report's automatic column.
                var same = T().findByName(name.value, code);
                var reserved = T().reservedName(name.value);
                var taken = reserved || (same && (!editing || same.id !== editing.id));
                name.classList.toggle('is-invalid', !name.value.trim() || !!taken);
                date.classList.toggle('is-invalid', !date.value);
                amount.classList.toggle('is-invalid', !value);
                if (!name.value.trim() || taken) {
                    name.focus();
                    warn(reserved ? 'Transport is paid automatically from each employee\'s Transport / Day, so it needs no benefit.'
                        : taken && !same.projectCode ? 'Request Templates already has ' + same.name + ' for every project.'
                        : taken ? 'That project already has ' + same.name + '.' : 'A benefit needs a name.');
                    return;
                }
                if (!date.value || !value) {
                    (date.value ? amount : date).focus();
                    warn('A benefit needs a date and an amount.');
                    return;
                }
                var saved = T().save({
                    id: editing ? editing.id : '',
                    projectCode: code,
                    name: name.value.trim(),
                    date: date.value,
                    amount: value,
                    note: document.getElementById('payNote').value.trim()
                });
                window.bootstrap.Modal.getInstance(document.getElementById('payModal')).hide();
                render();
                if (!window.FeriizNotify) return;
                if (source && code !== project.code) {
                    var to = projects.filter(function (p) { return p.code === code; })[0];
                    FeriizNotify.success(saved.name + ' was copied to ' + (to ? to.name : code) + '.', 'Benefit copied');
                } else if (editing) {
                    FeriizNotify.success(saved.name + ' was updated.', 'Benefit updated');
                } else {
                    FeriizNotify.success(saved.name + (source ? ' was copied.' : ' was added.') + ' Give it in the Report on ' + T().fmtDate(saved.date) + ': Batch Update > Assign Request.',
                        source ? 'Benefit copied' : 'Benefit added');
                }
            }

            document.addEventListener('DOMContentLoaded', function () {
                document.getElementById('addPayBtn').addEventListener('click', function () { if (project) openForm(null, false); });
                document.getElementById('payForm').addEventListener('submit', saveForm);
                document.getElementById('payAmount').addEventListener('input', function (e) {
                    e.target.value = typed(digits(e.target.value));
                    e.target.classList.remove('is-invalid');
                });
                ['payName', 'payDate'].forEach(function (id) {
                    document.getElementById(id).addEventListener('input', function (e) { e.target.classList.remove('is-invalid'); });
                });
                document.getElementById('payProject').addEventListener('change', function () {
                    if (source) document.getElementById('payName').value = copyName();
                });
                document.getElementById('payTableBody').addEventListener('click', function (e) {
                    var edit = e.target.closest('[data-edit]');
                    var copy = e.target.closest('[data-copy]');
                    if (edit) { e.preventDefault(); openForm(T().get(edit.dataset.edit), false); }
                    if (copy) { e.preventDefault(); openForm(T().get(copy.dataset.copy), true); }
                });
                var timer;
                document.getElementById('paySearch').addEventListener('input', function () {
                    clearTimeout(timer);
                    timer = setTimeout(render, 150);
                });

                if (!window.FERIIZ_DATA) return;
                var code = new URLSearchParams(location.search).get('project');
                window.FERIIZ_DATA.ready.then(function (data) {
                    project = (code && data.findProjectByCode(code)) || data.projects[0];
                    if (!project) return;
                    projects = data.projects.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
                    var link = document.getElementById('payProjectLink');
                    link.textContent = project.name;
                    link.href = 'project_employees.html?project=' + encodeURIComponent(project.code);
                    document.title = 'Feriiz - ' + project.name + ' - Benefits';
                    render();
                });
            });
        })();
    </script>
</body>

</html>
