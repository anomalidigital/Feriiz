<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feriiz - Project Calendar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css?v=3.4.0">
    <script src="assets/js/data.js?v=3.4.0" defer></script>
    <script src="assets/js/app.js?v=3.4.0" defer></script>
</head>
<body data-page="project-calendar">
    <aside class="sidebar"></aside>

    <main class="main-content feriiz-u-227">
        <div class="feriiz-u-228">
            <div class="breadcrumb feriiz-u-229">
                <a href="projects.html" class="feriiz-u-151">Projects</a>
                <span>&gt;</span>
                <a href="project_employees.html" class="feriiz-u-151" data-project-name>Project</a>
                <span>&gt;</span>
                <span class="feriiz-u-152">Calendar</span>
            </div>
            <div class="feriiz-u-230">
                <h1 class="page-title feriiz-u-231">Calendar</h1>
                <button class="cal-fullscreen-btn" onclick="document.documentElement.requestFullscreen()"><i class="fa-solid fa-expand"></i> Full Screen</button>
            </div>
        </div>

        <div class="cal-wrapper">
            <!-- Sidebar -->
            <div class="cal-sidebar" id="calSidebar">
                <div class="feriiz-u-224">
                    <div class="cal-toggle feriiz-u-232">
                        <button class="active feriiz-u-004" onclick="toggleSidebarView(this,'today')">Today</button>
                        <button onclick="toggleSidebarView(this,'month')" class="feriiz-u-004">Month</button>
                    </div>
                </div>
            </div>

            <!-- Calendar Main -->
            <div class="cal-main">
                <div class="cal-header">
                    <div class="cal-title" id="calMonthTitle">May 2026</div>
                    <div class="cal-nav">
                        <button class="cal-today-btn" onclick="goToday()">Today</button>
                        <button class="cal-nav-btn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                        <button class="cal-nav-btn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="cal-grid" id="calGrid"></div>
            </div>
        </div>
    </main>

    <!-- Detail Overlay -->
    <div class="cal-overlay" id="calDetailOverlay" onclick="if(event.target===this)closeDetail()">
        <div class="cal-detail">
            <div class="cal-detail-header">
                <h3>Details</h3>
                <button class="cal-detail-close" onclick="closeDetail()">&times;</button>
            </div>
            <div class="cal-detail-body" id="calDetailBody"></div>
        </div>
    </div>

    <script>
        // Populated from FERIIZ_DATA once the dataset resolves.
        let EVENTS = [];
        let HOLIDAYS = [];
        function catFromType(type) {
            var t = (type || '').toLowerCase();
            if (t.indexOf('sick') >= 0) return 'sick';
            if (t.indexOf('remote') >= 0) return 'work';
            if (t.indexOf('leave') >= 0 || t.indexOf('permission') >= 0) return 'leave';
            return 'other';
        }
        function buildEventsFromData(data, projectCode) {
            var out = [];
            for (var i = 0; i < data.requests.length; i++) {
                var r = data.requests[i];
                if (projectCode && r.projectCode !== projectCode) continue;
                var emp = data.findEmployeeByCode(r.employeeCode);
                if (!emp) continue;
                out.push({
                    name: emp.name,
                    type: r.type,
                    cat: catFromType(r.type),
                    dateStart: r.dateStart,
                    dateEnd: r.dateEnd || r.dateStart,
                    status: r.status,
                    pic: r.pic || '',
                    note: r.reason || '',
                    attachment: ''
                });
            }
            return out;
        }
        const DEFAULT_HOLIDAY_OVERRIDES = [
            { date:'2026-05-14', status:'working', note:'Tetap masuk kerja sesuai kebijakan perusahaan.' }
        ];
        let HOLIDAY_OVERRIDES = loadHolidayOverrides();

        let currentYear = 2026, currentMonth = 4; // 0-indexed, 4 = May

        function renderCalendar() {
            const grid = document.getElementById('calGrid');
            const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            document.getElementById('calMonthTitle').textContent = monthNames[currentMonth] + ' ' + currentYear;

            let html = days.map(d => `<div class="cal-day-header">${d}</div>`).join('');
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const daysInPrev = new Date(currentYear, currentMonth, 0).getDate();
            const today = new Date();

            // Previous month days
            for (let i = firstDay - 1; i >= 0; i--) {
                html += `<div class="cal-cell other-month"><div class="cal-date">${daysInPrev - i}</div></div>`;
            }
            // Current month days
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dow = new Date(currentYear, currentMonth, d).getDay();
                const isToday = today.getFullYear()===currentYear && today.getMonth()===currentMonth && today.getDate()===d;
                const isWeekend = dow===0 || dow===6;
                let cls = 'cal-cell';
                if (isToday) cls += ' today';
                if (isWeekend) cls += ' weekend';

                const dayEvents = EVENTS.filter(e => e.dateStart <= dateStr && e.dateEnd >= dateStr);
                const dayHolidays = HOLIDAYS.filter(h => h.date === dateStr);
                const allItems = [...dayHolidays.map(h => ({...h, isHoliday:true})), ...dayEvents.map(e => ({...e, isHoliday:false}))];

                let evHtml = '';
                const maxShow = 4;
                allItems.slice(0, maxShow).forEach((item, idx) => {
                    if (item.isHoliday) {
                        const override = getHolidayOverride(item.date);
                        const isWorking = override && override.status === 'working';
                        const label = isWorking ? `${item.name} | Company Working` : item.name;
                        evHtml += `<div class="cal-event ${isWorking ? 'company-working' : 'cat-other'}" onclick="event.stopPropagation(); showHolidayDetail('${item.name}','${item.date}')">${label}</div>`;
                    } else {
                        const spanClass = getEventSpanClass(item, dateStr);
                        evHtml += `<div class="cal-event cat-${item.cat} ${spanClass}" onclick="event.stopPropagation(); showDetail(${JSON.stringify(item).replace(/"/g,'&quot;')})">${item.name} | ${item.type}</div>`;
                    }
                });
                if (allItems.length > maxShow) {
                    evHtml += `<div class="cal-more">+${allItems.length - maxShow} more</div>`;
                }

                html += `<div class="${cls}"><div class="cal-date">${d}</div><div class="cal-events">${evHtml}</div></div>`;
            }
            // Next month fill
            const totalCells = firstDay + daysInMonth;
            const remaining = (7 - (totalCells % 7)) % 7;
            for (let i = 1; i <= remaining; i++) {
                html += `<div class="cal-cell other-month"><div class="cal-date">${i}</div></div>`;
            }
            grid.innerHTML = html;
        }

        function changeMonth(dir) { currentMonth += dir; if(currentMonth>11){currentMonth=0;currentYear++;} if(currentMonth<0){currentMonth=11;currentYear--;} renderCalendar(); }
        function goToday() { const t=new Date(); currentYear=t.getFullYear(); currentMonth=t.getMonth(); renderCalendar(); }

        function getEventSpanClass(item, dateStr) {
            if (!item.dateStart || !item.dateEnd || item.dateStart === item.dateEnd) return 'span-single';

            const date = new Date(dateStr + 'T00:00:00');
            const isWeekStart = date.getDay() === 0;
            const isWeekEnd = date.getDay() === 6;
            const startsHere = dateStr === item.dateStart || isWeekStart;
            const endsHere = dateStr === item.dateEnd || isWeekEnd;
            if (startsHere && endsHere) return 'is-span span-single';
            if (startsHere) return 'is-span span-start';
            if (endsHere) return 'is-span span-end';
            return 'is-span span-middle';
        }

        function showDetail(item) {
            const body = document.getElementById('calDetailBody');
            const statusClass = item.status === 'Accepted' ? 'badge-accepted' : item.status === 'Pending' ? 'badge-pending' : 'badge-rejected';
            body.innerHTML = `
                <div class="cal-detail-row"><div class="cal-detail-label">Name</div><div class="cal-detail-value">: ${item.name}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Type</div><div class="cal-detail-value">: ${item.type}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Date Start</div><div class="cal-detail-value">: ${formatDate(item.dateStart)}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Date End</div><div class="cal-detail-value">: ${formatDate(item.dateEnd)}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Status</div><div class="cal-detail-value">: <span class="badge-sm ${statusClass}">${item.status}</span></div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">PIC</div><div class="cal-detail-value">: ${item.pic || '-'}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Note</div><div class="cal-detail-value">: ${item.note || '-'}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Attachment</div><div class="cal-detail-value">: ${item.attachment ? '<a href="#">'+item.attachment+'</a>' : '-'}</div></div>
            `;
            document.getElementById('calDetailOverlay').classList.add('show');
        }

        function showHolidayDetail(name, date) {
            const body = document.getElementById('calDetailBody');
            const override = getHolidayOverride(date) || { status:'holiday', note:'' };
            const isWorking = override.status === 'working';
            body.innerHTML = `
                <div class="cal-detail-row"><div class="cal-detail-label">Holiday</div><div class="cal-detail-value">: ${name}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Date</div><div class="cal-detail-value">: ${formatDate(date)}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Type</div><div class="cal-detail-value">: <span class="badge-sm feriiz-u-009">Public Holiday</span></div></div>
                <div class="feriiz-u-011">
                    <label class="feriiz-u-012">Company Status</label>
                    <select id="holidayStatusInput" class="holiday-edit-field">
                        <option value="holiday" ${isWorking ? '' : 'selected'}>Company Holiday</option>
                        <option value="working" ${isWorking ? 'selected' : ''}>Company Working Day</option>
                    </select>
                </div>
                <div class="feriiz-u-013">
                    <label class="feriiz-u-012">Note</label>
                    <textarea id="holidayNoteInput" class="holiday-edit-field" rows="3" placeholder="Note">${override.note || ''}</textarea>
                </div>
                <button class="holiday-save-btn" onclick="saveHolidayOverride('${date}')">Save Override</button>
            `;
            document.getElementById('calDetailOverlay').classList.add('show');
        }

        function getHolidayOverride(date) {
            return HOLIDAY_OVERRIDES.find(item => item.date === date);
        }

        function loadHolidayOverrides() {
            try {
                const saved = localStorage.getItem('feriizHolidayOverrides');
                return saved ? JSON.parse(saved) : [...DEFAULT_HOLIDAY_OVERRIDES];
            } catch (error) {
                return [...DEFAULT_HOLIDAY_OVERRIDES];
            }
        }

        function persistHolidayOverrides() {
            try {
                localStorage.setItem('feriizHolidayOverrides', JSON.stringify(HOLIDAY_OVERRIDES));
                return true;
            } catch (error) {
                return false;
            }
        }

        function saveHolidayOverride(date) {
            const status = document.getElementById('holidayStatusInput').value;
            const note = document.getElementById('holidayNoteInput').value.trim();
            const existing = getHolidayOverride(date);
            if (existing) {
                existing.status = status;
                existing.note = note;
            } else {
                HOLIDAY_OVERRIDES.push({ date, status, note });
            }
            if (!persistHolidayOverrides()) {
                if (window.FeriizNotify) FeriizNotify.error('The holiday override could not be stored. Please try again.', 'Override not saved');
                return;
            }
            renderCalendar();
            closeDetail();
            if (window.FeriizNotify) {
                const label = status === 'working' ? 'Company Working Day' : 'Company Holiday';
                FeriizNotify.success(formatDate(date) + ' is now set as ' + label + '.', 'Holiday override saved');
            }
        }

        function closeDetail() { document.getElementById('calDetailOverlay').classList.remove('show'); }
        function formatDate(d) { const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
        function toggleSidebarView(btn, view) {
            btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            currentSidebarView = view;
            renderSidebar();
        }
        let currentSidebarView = 'today';
        function renderSidebar() {
            const container = document.getElementById('calSidebar');
            const toggle = container.querySelector('.cal-toggle').parentElement.outerHTML;
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
            const monthPrefix = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
            let filtered;
            if (currentSidebarView === 'today') {
                filtered = EVENTS.filter(e => e.dateStart <= todayStr && e.dateEnd >= todayStr);
            } else {
                filtered = EVENTS.filter(e => e.dateStart.startsWith(monthPrefix) || e.dateEnd.startsWith(monthPrefix));
            }
            // Summary counts
            const cats = {work:0,leave:0,sick:0};
            filtered.forEach(e => { if(cats[e.cat]!==undefined) cats[e.cat]++; });
            let html = toggle;
            html += `<div class="cal-sidebar-section"><h3>ðŸ“Š Summary</h3>`;
            html += `<div class="feriiz-u-140">`;
            html += `<div class="feriiz-u-233"><span class="feriiz-u-234">ðŸŸ¢ Remote Work</span><span class="feriiz-u-235">${cats.work}</span></div>`;
            html += `<div class="feriiz-u-233"><span class="feriiz-u-236">ðŸ”µ Cuti</span><span class="feriiz-u-235">${cats.leave}</span></div>`;
            html += `<div class="feriiz-u-233"><span class="feriiz-u-237">ðŸ”´ Sakit</span><span class="feriiz-u-235">${cats.sick}</span></div>`;
            html += `<div class="feriiz-u-238"></div>`;
            html += `<div class="feriiz-u-239"><span>Total</span><span>${filtered.length}</span></div>`;
            html += `</div></div>`;
            html += `<div class="cal-sidebar-section"><h3>ðŸ“‹ Request</h3>`;
            if (filtered.length === 0) {
                html += `<div class="feriiz-u-240">No requests</div>`;
            }
            filtered.forEach(e => {
                const sc = e.status==='Accepted'?'badge-accepted':e.status==='Pending'?'badge-pending':'badge-rejected';
                html += `<div class="cal-sidebar-item"><div class="item-name">${e.name} - <span class="feriiz-u-241">${e.type}</span></div><div class="badge-sm ${sc}">${e.status}</div><div class="item-sub">${formatDate(e.dateStart)}</div></div>`;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        renderCalendar();
        renderSidebar();

        document.addEventListener('DOMContentLoaded', function () {
            if (!window.FERIIZ_DATA || !window.FERIIZ_DATA.ready) return;
            var url = new URL(location.href);
            var projectCode = url.searchParams.get('project');
            window.FERIIZ_DATA.ready.then(function (data) {
                var project = projectCode ? data.findProjectByCode(projectCode) : data.projects[0];
                if (!project) project = data.projects[0];
                EVENTS = buildEventsFromData(data, project.code);
                HOLIDAYS = data.holidays.map(function (h) { return { name: h.name, date: h.date, cat: 'other' }; });
                currentYear = 2026;
                currentMonth = 4;
                var bc = document.querySelector('[data-project-name]');
                if (bc) bc.textContent = project.name;
                document.title = 'Feriiz - ' + project.name + ' - Calendar';
                renderCalendar();
                renderSidebar();
            });
        });
    </script>
</body>
</html>
