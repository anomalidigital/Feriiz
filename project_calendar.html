<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feriiz - Project Calendar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="Style.css">
    <style>
        .cal-wrapper { display:flex; gap:0; height:calc(100vh - 120px); }
        .cal-sidebar { width:260px; min-width:220px; background:#fff; border-right:1px solid #e8ecf0; overflow-y:auto; padding:20px 16px; flex-shrink:0; }
        .cal-sidebar h3 { font-size:14px; font-weight:700; color:#1a1a1a; margin:0 0 12px; }
        .cal-sidebar-section { margin-bottom:24px; }
        .cal-sidebar-item { font-size:12px; color:#444; margin-bottom:10px; padding-left:12px; border-left:3px solid #2975BB; }
        .cal-sidebar-item .item-name { font-weight:600; color:#1a1a1a; }
        .cal-sidebar-item .item-sub { color:#888; font-size:11px; margin-top:2px; }
        .cal-sidebar-item .badge-sm { display:inline-block; padding:1px 8px; border-radius:4px; font-size:10px; font-weight:600; color:#fff; margin-top:3px; }
        .badge-accepted { background:#27AE60; }
        .badge-pending { background:#E67E22; }
        .badge-cancelled, .badge-rejected { background:#E74C3C; }

        .cal-main { flex:1; overflow:auto; padding:0; display:flex; flex-direction:column; }
        .cal-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; flex-shrink:0; }
        .cal-title { font-size:22px; font-weight:700; color:#1a1a1a; }
        .cal-nav { display:flex; align-items:center; gap:8px; }
        .cal-nav-btn { width:36px; height:36px; border:1px solid #ddd; border-radius:8px; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#555; transition:all 0.15s; }
        .cal-nav-btn:hover { background:#f0f4f8; border-color:#2975BB; color:#2975BB; }
        .cal-today-btn { padding:6px 16px; border:1px solid #2975BB; border-radius:8px; background:#2975BB; color:#fff; font-size:12px; font-weight:600; cursor:pointer; font-family:'Poppins',sans-serif; }
        .cal-toggle { display:flex; border:2px solid #2975BB; border-radius:8px; overflow:hidden; }
        .cal-toggle button { padding:6px 18px; border:none; background:#fff; color:#2975BB; font-size:12px; font-weight:600; cursor:pointer; font-family:'Poppins',sans-serif; transition:all 0.15s; }
        .cal-toggle button.active { background:#2975BB; color:#fff; }
        .cal-fullscreen-btn { padding:6px 14px; border:1px solid #333; border-radius:8px; background:#333; color:#fff; font-size:12px; font-weight:600; cursor:pointer; font-family:'Poppins',sans-serif; }

        .cal-grid { flex:1; display:grid; grid-template-columns:repeat(7,1fr); border-top:1px solid #e0e0e0; border-left:1px solid #e0e0e0; }
        .cal-day-header { padding:10px 4px; text-align:center; font-size:12px; font-weight:700; color:#2975BB; background:#f5f8fc; border-right:1px solid #e0e0e0; border-bottom:1px solid #e0e0e0; text-transform:uppercase; }
        .cal-cell { min-height:110px; padding:4px; border-right:1px solid #e0e0e0; border-bottom:1px solid #e0e0e0; background:#fff; position:relative; cursor:default; transition:background 0.15s; vertical-align:top; }
        .cal-cell:hover { background:#fafcff; }
        .cal-cell.today { background:#eef5ff; }
        .cal-cell.other-month { background:#fafafa; }
        .cal-cell.other-month .cal-date { color:#ccc; }
        .cal-cell.weekend { background:#fdf8f4; }
        .cal-date { font-size:12px; font-weight:600; color:#555; padding:2px 6px; }
        .cal-events { margin-top:2px; display:flex; flex-direction:column; gap:2px; }
        .cal-event { padding:2px 6px; border-radius:4px; font-size:10px; font-weight:500; color:#fff; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:transform 0.1s, box-shadow 0.1s; }
        .cal-event:hover { transform:scale(1.02); box-shadow:0 2px 8px rgba(0,0,0,0.15); z-index:2; position:relative; }
        .cal-event.cat-work { background:#27AE60; }
        .cal-event.cat-leave { background:#2980B9; }
        .cal-event.cat-sick { background:#E74C3C; }
        .cal-event.cat-other { background:#E67E22; }
        .cal-more { font-size:10px; color:#2975BB; font-weight:600; cursor:pointer; padding:1px 6px; }

        /* Detail Overlay */
        .cal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4); backdrop-filter:blur(4px); z-index:1000; align-items:flex-start; padding-top:10vh; justify-content:center; animation:fadeIn 0.2s ease; }
        .cal-overlay.show { display:flex; }
        .cal-detail { background:#fff; border-radius:14px; width:500px; max-width:92vw; box-shadow:0 20px 60px rgba(0,0,0,0.18); animation:slideUp 0.25s ease; overflow:hidden; }
        .cal-detail-header { display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-bottom:1px solid #eee; }
        .cal-detail-header h3 { font-size:16px; font-weight:700; color:#1a1a1a; margin:0; }
        .cal-detail-close { width:32px; height:32px; border:none; background:#f2f2f2; border-radius:50%; font-size:18px; color:#777; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .cal-detail-close:hover { background:#e8e8e8; color:#333; }
        .cal-detail-body { padding:20px 24px; }
        .cal-detail-row { display:flex; padding:6px 0; font-size:13px; border-bottom:1px solid #f5f5f5; }
        .cal-detail-row:last-child { border-bottom:none; }
        .cal-detail-label { width:120px; font-weight:600; color:#666; flex-shrink:0; }
        .cal-detail-value { color:#1a1a1a; font-weight:500; }
        .cal-detail-value .badge-sm { font-size:11px; }
        .cal-detail-value a { color:#2975BB; text-decoration:underline; }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="_Asset_/icon_feriiz.png" alt="Feriiz Logo">
            <div class="logo-text">FERIIZ</div>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html"><i class="fa-solid fa-table-cells-large"></i><span class="nav-label">Dashboard</span></a>
            <div class="nav-group open">
                <a href="projects.html" class="active"><i class="fa-solid fa-clipboard"></i><span class="nav-label">Projects</span></a>
                <div class="nav-submenu">
                    <a href="project_employees.html"><i class="fa-solid fa-clock"></i><span class="nav-label">Activity</span></a>
                    <a href="project_report.html"><i class="fa-regular fa-file-lines"></i><span class="nav-label">Report</span></a>
                    <a href="employee_request.html"><i class="fa-solid fa-clipboard-list"></i><span class="nav-label">Requests</span></a>
                    <a href="project_calendar.html" class="active"><i class="fa-regular fa-calendar-days"></i><span class="nav-label">Calendar</span></a>
                </div>
            </div>
            <a href="employees.html"><i class="fa-solid fa-users"></i><span class="nav-label">Employees</span></a>
            <a href="calendar.html"><i class="fa-regular fa-calendar"></i><span class="nav-label">Calendar</span></a>
            <a href="my account.html"><i class="fa-regular fa-user"></i><span class="nav-label">My Account</span></a>
        </nav>
    </aside>

    <main class="main-content" style="padding:0; overflow:hidden;">
        <div style="padding:16px 24px 0;">
            <div style="font-size:13px; color:#888; margin-bottom:4px; font-weight:500;">
                <a href="projects.html" style="color:inherit; text-decoration:none;">Projects</a> &gt;
                <span style="color:#2975BB;">Calendar</span>
            </div>
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                <h1 class="page-title" style="margin:0; font-size:24px; font-weight:800; color:#2975BB;">Calendar</h1>
                <button class="cal-fullscreen-btn" onclick="document.documentElement.requestFullscreen()"><i class="fa-solid fa-expand"></i> Full Screen</button>
            </div>
        </div>

        <div class="cal-wrapper">
            <!-- Sidebar -->
            <div class="cal-sidebar" id="calSidebar">
                <div style="margin-bottom:16px;">
                    <div class="cal-toggle" style="width:100%;">
                        <button class="active" style="flex:1;" onclick="toggleSidebarView(this,'today')">Today</button>
                        <button style="flex:1;" onclick="toggleSidebarView(this,'month')">Month</button>
                    </div>
                </div>
            </div>

            <!-- Calendar Main -->
            <div class="cal-main">
                <div class="cal-header">
                    <div class="cal-title" id="calMonthTitle">May 2026</div>
                    <div class="cal-nav">
                        <button class="cal-today-btn" onclick="goToday()">Today</button>
                        <button class="cal-nav-btn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                        <button class="cal-nav-btn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="cal-grid" id="calGrid"></div>
            </div>
        </div>
    </main>

    <!-- Detail Overlay -->
    <div class="cal-overlay" id="calDetailOverlay" onclick="if(event.target===this)closeDetail()">
        <div class="cal-detail">
            <div class="cal-detail-header">
                <h3>Details</h3>
                <button class="cal-detail-close" onclick="closeDetail()">&times;</button>
            </div>
            <div class="cal-detail-body" id="calDetailBody"></div>
        </div>
    </div>

    <script>
        // === Event Data ===
        const EVENTS = [
            { name:'Sandy Santuy', type:'Sick Leave', cat:'sick', dateStart:'2026-05-04', dateEnd:'2026-05-04', status:'Accepted', pic:'Judith Anastalio', note:'flu berat', attachment:'' },
            { name:'Steven Febrianto', type:'Annual Leave', cat:'leave', dateStart:'2026-05-05', dateEnd:'2026-05-05', status:'Accepted', pic:'Judith Anastalio', note:'', attachment:'' },
            { name:'Raden Maulana', type:'Sick Leave', cat:'sick', dateStart:'2026-05-05', dateEnd:'2026-05-05', status:'Accepted', pic:'Judith Anastalio', note:'sakit rahang', attachment:'Camera_1777145042263.jpg' },
            { name:'Yenni Tedjakoesoemo', type:'Remote Work', cat:'work', dateStart:'2026-05-06', dateEnd:'2026-05-06', status:'Accepted', pic:'Judith Anastalio', note:'', attachment:'' },
            { name:'Adam Ferial', type:'Sick Leave', cat:'sick', dateStart:'2026-05-06', dateEnd:'2026-05-06', status:'Accepted', pic:'Judith Anastalio', note:'', attachment:'' },
            { name:'Adam Ferial', type:'Remote Work', cat:'work', dateStart:'2026-05-07', dateEnd:'2026-05-07', status:'Accepted', pic:'Judith Anastalio', note:'', attachment:'' },
            { name:'Raden Maulana', type:'Sick Leave', cat:'sick', dateStart:'2026-05-05', dateEnd:'2026-05-05', status:'Accepted', pic:'Judith Anastalio', note:'sakit rahang', attachment:'Camera_1777145042263.jpg' },
            { name:'Mauli Hidayat', type:'Annual Leave', cat:'leave', dateStart:'2026-05-11', dateEnd:'2026-05-11', status:'Accepted', pic:'Judith Anastalio', note:'', attachment:'' },
            { name:'Ifan Faizal Adnan', type:'Annual Leave', cat:'leave', dateStart:'2026-05-12', dateEnd:'2026-05-12', status:'Accepted', pic:'Judith Anastalio', note:'', attachment:'' },
            { name:'Raden Maulana', type:'Sick Leave', cat:'sick', dateStart:'2026-05-04', dateEnd:'2026-05-04', status:'Accepted', pic:'Judith Anastalio', note:'', attachment:'' },
            { name:'Ifan Faizal Adnan', type:'Remote Work', cat:'work', dateStart:'2026-05-13', dateEnd:'2026-05-13', status:'Pending', pic:'Judith Anastalio', note:'', attachment:'' },
            { name:'Mauli Hidayat', type:'Sick Leave', cat:'sick', dateStart:'2026-05-13', dateEnd:'2026-05-13', status:'Pending', pic:'Judith Anastalio', note:'', attachment:'' },
            { name:'Mauli Hidayat', type:'Annual Leave', cat:'leave', dateStart:'2026-05-08', dateEnd:'2026-05-08', status:'Accepted', pic:'Judith Anastalio', note:'', attachment:'' },
            { name:'Raden Maulana', type:'Sick Leave', cat:'sick', dateStart:'2026-05-12', dateEnd:'2026-05-12', status:'Accepted', pic:'Judith Anastalio', note:'', attachment:'' },
            { name:'Adam Ferial', type:'Sick Leave', cat:'sick', dateStart:'2026-05-07', dateEnd:'2026-05-07', status:'Accepted', pic:'Judith Anastalio', note:'', attachment:'' },
            { name:'Steven Febrianto', type:'Remote Work', cat:'work', dateStart:'2026-05-06', dateEnd:'2026-05-06', status:'Accepted', pic:'Judith Anastalio', note:'', attachment:'' },
            { name:'Veronica Nathalia', type:'Annual Leave', cat:'leave', dateStart:'2026-05-15', dateEnd:'2026-05-15', status:'Accepted', pic:'Judith Anastalio', note:'', attachment:'' },
            { name:'Ifan Faizal Adnan', type:'Annual Leave', cat:'leave', dateStart:'2026-05-19', dateEnd:'2026-05-19', status:'Pending', pic:'Judith Anastalio', note:'', attachment:'' },
        ];
        const HOLIDAYS = [
            { name:'Hari Buruh Internasional / Pekerja', date:'2026-05-01', cat:'other' },
            { name:'Kenaikan Isa Al Masih', date:'2026-05-14', cat:'other' },
            { name:'Cuti Bersama: Kenaikan Isa Al Masih', date:'2026-05-15', cat:'other' },
            { name:'Idul Adha (Lebaran Haji) (belum pasti)', date:'2026-05-27', cat:'other' },
            { name:'Idul Adha (Lebaran Haji)', date:'2026-05-28', cat:'other' },
            { name:'Hari Raya Waisak (belum pasti)', date:'2026-05-31', cat:'other' },
        ];

        let currentYear = 2026, currentMonth = 4; // 0-indexed, 4 = May

        function renderCalendar() {
            const grid = document.getElementById('calGrid');
            const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            document.getElementById('calMonthTitle').textContent = monthNames[currentMonth] + ' ' + currentYear;

            let html = days.map(d => `<div class="cal-day-header">${d}</div>`).join('');
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const daysInPrev = new Date(currentYear, currentMonth, 0).getDate();
            const today = new Date();

            // Previous month days
            for (let i = firstDay - 1; i >= 0; i--) {
                html += `<div class="cal-cell other-month"><div class="cal-date">${daysInPrev - i}</div></div>`;
            }
            // Current month days
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const dow = new Date(currentYear, currentMonth, d).getDay();
                const isToday = today.getFullYear()===currentYear && today.getMonth()===currentMonth && today.getDate()===d;
                const isWeekend = dow===0 || dow===6;
                let cls = 'cal-cell';
                if (isToday) cls += ' today';
                if (isWeekend) cls += ' weekend';

                const dayEvents = EVENTS.filter(e => e.dateStart <= dateStr && e.dateEnd >= dateStr);
                const dayHolidays = HOLIDAYS.filter(h => h.date === dateStr);
                const allItems = [...dayHolidays.map(h => ({...h, isHoliday:true})), ...dayEvents.map(e => ({...e, isHoliday:false}))];

                let evHtml = '';
                const maxShow = 4;
                allItems.slice(0, maxShow).forEach((item, idx) => {
                    if (item.isHoliday) {
                        evHtml += `<div class="cal-event cat-other" onclick="event.stopPropagation(); showHolidayDetail('${item.name}','${item.date}')">${item.name}</div>`;
                    } else {
                        evHtml += `<div class="cal-event cat-${item.cat}" onclick="event.stopPropagation(); showDetail(${JSON.stringify(item).replace(/"/g,'&quot;')})">${item.name} | ${item.type}</div>`;
                    }
                });
                if (allItems.length > maxShow) {
                    evHtml += `<div class="cal-more">+${allItems.length - maxShow} more</div>`;
                }

                html += `<div class="${cls}"><div class="cal-date">${d}</div><div class="cal-events">${evHtml}</div></div>`;
            }
            // Next month fill
            const totalCells = firstDay + daysInMonth;
            const remaining = (7 - (totalCells % 7)) % 7;
            for (let i = 1; i <= remaining; i++) {
                html += `<div class="cal-cell other-month"><div class="cal-date">${i}</div></div>`;
            }
            grid.innerHTML = html;
        }

        function changeMonth(dir) { currentMonth += dir; if(currentMonth>11){currentMonth=0;currentYear++;} if(currentMonth<0){currentMonth=11;currentYear--;} renderCalendar(); }
        function goToday() { const t=new Date(); currentYear=t.getFullYear(); currentMonth=t.getMonth(); renderCalendar(); }

        function showDetail(item) {
            const body = document.getElementById('calDetailBody');
            const statusClass = item.status === 'Accepted' ? 'badge-accepted' : item.status === 'Pending' ? 'badge-pending' : 'badge-rejected';
            body.innerHTML = `
                <div class="cal-detail-row"><div class="cal-detail-label">Name</div><div class="cal-detail-value">: ${item.name}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Type</div><div class="cal-detail-value">: ${item.type}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Date Start</div><div class="cal-detail-value">: ${formatDate(item.dateStart)}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Date End</div><div class="cal-detail-value">: ${formatDate(item.dateEnd)}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Status</div><div class="cal-detail-value">: <span class="badge-sm ${statusClass}">${item.status}</span></div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">PIC</div><div class="cal-detail-value">: ${item.pic || 'â€”'}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Note</div><div class="cal-detail-value">: ${item.note || 'â€”'}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Attachment</div><div class="cal-detail-value">: ${item.attachment ? '<a href="#">'+item.attachment+'</a>' : 'â€”'}</div></div>
            `;
            document.getElementById('calDetailOverlay').classList.add('show');
        }

        function showHolidayDetail(name, date) {
            const body = document.getElementById('calDetailBody');
            body.innerHTML = `
                <div class="cal-detail-row"><div class="cal-detail-label">Holiday</div><div class="cal-detail-value">: ${name}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Date</div><div class="cal-detail-value">: ${formatDate(date)}</div></div>
                <div class="cal-detail-row"><div class="cal-detail-label">Type</div><div class="cal-detail-value">: <span class="badge-sm" style="background:#E67E22;">Public Holiday</span></div></div>
            `;
            document.getElementById('calDetailOverlay').classList.add('show');
        }

        function closeDetail() { document.getElementById('calDetailOverlay').classList.remove('show'); }
        function formatDate(d) { const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
        function toggleSidebarView(btn, view) {
            btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            currentSidebarView = view;
            renderSidebar();
        }
        let currentSidebarView = 'today';
        function renderSidebar() {
            const container = document.getElementById('calSidebar');
            const toggle = container.querySelector('.cal-toggle').parentElement.outerHTML;
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
            const monthPrefix = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
            let filtered;
            if (currentSidebarView === 'today') {
                filtered = EVENTS.filter(e => e.dateStart <= todayStr && e.dateEnd >= todayStr);
            } else {
                filtered = EVENTS.filter(e => e.dateStart.startsWith(monthPrefix) || e.dateEnd.startsWith(monthPrefix));
            }
            // Summary counts
            const cats = {work:0,leave:0,sick:0};
            filtered.forEach(e => { if(cats[e.cat]!==undefined) cats[e.cat]++; });
            let html = toggle;
            html += `<div class="cal-sidebar-section"><h3>ðŸ“Š Summary</h3>`;
            html += `<div style="display:flex;flex-direction:column;gap:6px;">`;
            html += `<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;"><span style="color:#27AE60;font-weight:600;">ðŸŸ¢ Remote Work</span><span style="font-weight:700;">${cats.work}</span></div>`;
            html += `<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;"><span style="color:#2980B9;font-weight:600;">ðŸ”µ Cuti</span><span style="font-weight:700;">${cats.leave}</span></div>`;
            html += `<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;"><span style="color:#E74C3C;font-weight:600;">ðŸ”´ Sakit</span><span style="font-weight:700;">${cats.sick}</span></div>`;
            html += `<div style="height:1px;background:#eee;margin:4px 0;"></div>`;
            html += `<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;font-weight:700;"><span>Total</span><span>${filtered.length}</span></div>`;
            html += `</div></div>`;
            html += `<div class="cal-sidebar-section"><h3>ðŸ“‹ Request</h3>`;
            if (filtered.length === 0) {
                html += `<div style="font-size:12px;color:#aaa;padding:8px 0;">No requests</div>`;
            }
            filtered.forEach(e => {
                const sc = e.status==='Accepted'?'badge-accepted':e.status==='Pending'?'badge-pending':'badge-rejected';
                html += `<div class="cal-sidebar-item"><div class="item-name">${e.name} â€” <span style="font-weight:400;">${e.type}</span></div><div class="badge-sm ${sc}">${e.status}</div><div class="item-sub">${formatDate(e.dateStart)}</div></div>`;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        renderCalendar();
        renderSidebar();
    </script>
</body>
</html>
