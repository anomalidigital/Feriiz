<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feriiz - Employee Attendance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/customize.css?v=3.7.38">
    <link rel="stylesheet" href="assets/css/style.css?v=3.7.38">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="assets/js/data.js?v=3.7.38" defer></script>
    <script src="assets/js/app.js?v=3.7.38" defer></script>
</head>

<body data-page="project-attendance">
    <!-- Sidebar -->
    <aside class="sidebar"></aside>

    <main class="main-content">

        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="projects.html">Projects</a>
            <span>&gt;</span>
            <a href="project_employees.html" id="attProjectLink">Project</a>
            <span>&gt;</span>
            <span class="feriiz-u-152">Attendance</span>
            <span>&gt;</span>
            <span class="feriiz-u-057" id="attCrumbName"></span>
        </div>

        <!-- Header -->
        <div class="page-header">
            <div class="feriiz-u-058">
                <a href="project_employees.html" class="feriiz-u-059" id="attBackLink">
                    <i class="fa-solid fa-chevron-left feriiz-u-060"></i>
                </a>
                <div class="feriiz-u-061">
                    <img alt="" class="feriiz-u-062" id="attPhoto">
                    <div>
                        <h1 class="page-title feriiz-u-063" id="attName"></h1>
                        <div class="feriiz-u-064" id="attCode"></div>
                    </div>
                </div>
            </div>
            <div class="page-actions feriiz-u-065">
                <div class="feriiz-u-014">
                    <button class="btn btn-outline filter-toggle-btn" title="Filter">
                        <i class="fa-solid fa-filter"></i>
                    </button>
                    <!-- Filter Dropdown Menu -->
                    <div class="filter-dropdown feriiz-u-066">
                        <div class="feriiz-u-016">Filter
                            Attendance</div>
                        <label>Date Range</label>
                        <div class="feriiz-u-003">
                            <input type="date" class="input filter-date feriiz-u-004">
                            <span class="feriiz-u-005">-</span>
                            <input type="date" class="input filter-date feriiz-u-004">
                        </div>

                        <label class="feriiz-u-013">Period</label>
                        <select class="input filter-period feriiz-u-017">
                            <option value="today">Today</option>
                            <option value="this_week">This Week</option>
                            <option value="this_month">This Month</option>
                            <option value="this_year">This Year</option>
                            <option value="yesterday">Yesterday</option>
                            <option value="last_week">Last Week</option>
                            <option value="last_month">Last Month</option>
                            <option value="all_time">All Time</option>
                            <option value="custom" selected>Custom</option>
                        </select>
                        <div class="feriiz-u-018">
                            <button class="btn btn-outline filter-clear-btn feriiz-u-019"
                                onclick="this.closest('.filter-dropdown').classList.remove('show');">Clear</button>
                            <button class="btn btn-primary filter-apply-btn feriiz-u-019"
                                onclick="this.closest('.filter-dropdown').classList.remove('show');">Apply</button>
                        </div>
                    </div>
                </div>
                <div class="feriiz-u-020">
                    <i class="fa-solid fa-magnifying-glass feriiz-u-067"
                       ></i>
                    <input type="text" placeholder="Search attendance..." class="feriiz-u-068">
                </div>
            </div>
        </div>

        <!-- Stat Cards -->
        <div class="stat-cards feriiz-u-023">
            <div class="stat-card feriiz-u-024"
               >
                <div class="stat-card-icon feriiz-u-025"
                   >
                    <i class="fa-solid fa-clock"></i>
                </div>
                <div class="stat-card-info">
                    <div class="stat-number feriiz-u-069" data-att-stat="hours">0:00</div>
                    <div class="stat-label feriiz-u-070">Attendance Hours</div>
                </div>
            </div>
            <div class="stat-card feriiz-u-071"
               >
                <div class="stat-card-icon feriiz-u-025"
                   >
                    <i class="fa-solid fa-circle-exclamation"></i>
                </div>
                <div class="stat-card-info">
                    <div class="stat-number feriiz-u-069" data-att-stat="deficit">0:00</div>
                    <div class="stat-label feriiz-u-070">Hours Deficit</div>
                </div>
            </div>
            <div class="stat-card feriiz-u-072"
               >
                <div class="stat-card-icon feriiz-u-025"
                   >
                    <i class="fa-solid fa-arrow-trend-up"></i>
                </div>
                <div class="stat-card-info">
                    <div class="stat-number feriiz-u-069" data-att-stat="surplus">0:00</div>
                    <div class="stat-label feriiz-u-070">Hours Surplus</div>
                </div>
            </div>
        </div>

        <!-- Attendance Table -->
        <div class="table-container attendance-table-container">
            <table class="data-table attendance-table feriiz-u-073">
                <colgroup>
                    <col width="190">
                    <col width="96">
                    <col width="96">
                    <col width="96">
                    <col width="96">
                    <col width="96">
                    <col width="96">
                    <col width="96">
                    <col width="220">
                    <col>
                </colgroup>
                <thead>
                    <tr>
                        <th rowspan="2" class="feriiz-u-074">Date</th>
                        <th colspan="3" class="feriiz-u-075">Time Period</th>
                        <th colspan="3" class="feriiz-u-075">Attendance</th>
                        <th rowspan="2" class="feriiz-u-076">Period</th>
                        <th rowspan="2" class="feriiz-u-076">Request</th>
                        <th rowspan="2" class="feriiz-u-076">Note</th>
                    </tr>
                    <tr>
                        <th class="feriiz-u-077">Start</th>
                        <th class="feriiz-u-077">End</th>
                        <th class="feriiz-u-077">Period</th>
                        <th class="feriiz-u-077">Start</th>
                        <th class="feriiz-u-077">End</th>
                        <th class="feriiz-u-077">Period</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="10" class="feriiz-u-080">Loading attendance...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="feriiz-u-032">version : 3.7.38</div>
    </main>

</body>

</html>
