        <script>
        (function () {
            var ACTIVITY_PHOTO_SRC = 'assets/images/employees/adam-ferial_1689213258972QWGCYFQ_1770362381449KFDCLNS.jpg';
            var state = {
                project: null,
                all: [],
                filtered: [],
                firstActivity: {},   // employeeCode -> 'YYYY-MM-DD HH:mm:ss' (earliest log in this project)
                lastActivity: {},    // employeeCode -> 'YYYY-MM-DD HH:mm:ss' (latest log in this project)
                filters: { occupations: [], dateStart: '', dateEnd: '', showActivity: false },
                page: 1,
                perPage: 20
            };

            // 'YYYY-MM-DD HH:mm:ss' -> '30 Jun 2026, 17:02:11'
            function fmtActivity(stamp) {
                if (!stamp) return '-';
                var p = stamp.split(' ');
                var d = p[0].split('-').map(Number);
                var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                return String(d[2]).padStart(2, '0') + ' ' + m[d[1] - 1] + ' ' + d[0] + (p[1] ? ', ' + p[1] : '');
            }

            function renderRow(emp) {
                var avatar = window.FERIIZ_DATA.avatarSrc(emp);
                var fallback = window.FERIIZ_DATA.initialsAvatar(emp.name);
                var showActivity = state.filters.showActivity;
                var activityContent = '';
                if (showActivity) {
                    var activityPhotos = '';
                    for (var photoIndex = 1; photoIndex <= 4; photoIndex++) {
                        activityPhotos += '<img src="' + ACTIVITY_PHOTO_SRC + '" alt="Attendance activity ' + photoIndex + ' for ' + emp.name + '" class="activity-photo-thumb" loading="lazy" decoding="async">';
                    }
                    activityContent = '<div class="activity-photo-grid">' + activityPhotos + '</div>';
                }
                var tr = document.createElement('tr');
                tr.innerHTML =
                    '<td>' +
                        '<div class="action-cell">' +
                            '<button type="button" class="btn-icon edit-project-employee-btn" title="Edit" aria-label="Edit ' + emp.name + '"><i class="fa-solid fa-pen-to-square"></i></button>' +
                            '<a href="project_employee_attendance.html?project=' + state.project.code + '&employee=' + emp.code + '" class="btn-icon" title="Attendance"><i class="fa-solid fa-calendar-check"></i></a>' +
                            '<a href="employee_report.html?project=' + state.project.code + '&employee=' + emp.code + '" class="btn-icon" title="Report"><i class="fa-regular fa-file-lines"></i></a>' +
                            '<a href="employee_personal_request.html?project=' + state.project.code + '&employee=' + emp.code + '" class="btn-icon" title="Assigned Requests"><i class="fa-solid fa-clipboard-list"></i></a>' +
                        '</div>' +
                    '</td>' +
                    '<td>' +
                        '<div class="employee-cell feriiz-u-029">' +
                            '<img src="' + avatar + '" alt="" class="feriiz-u-030" data-fallback="' + fallback + '">' +
                            '<div>' +
                                '<div class="employee-name">' + emp.name + '</div>' +
                                '<div class="employee-code feriiz-u-031">' + emp.code + '</div>' +
                            '</div>' +
                        '</div>' +
                    '</td>' +
                    '<td class="col-activity-photos' + (showActivity ? ' col-activity-visible' : '') + '">' + activityContent + '</td>' +
                    '<td>' + emp.occupation + '</td>' +
                    '<td>' + hoursCellHTML(emp) + '</td>' +
                    '<td>' + emp.pin + '</td>' +
                    '<td class="activity-stamp">' + fmtActivity(state.firstActivity[emp.code]) + '</td>' +
                    '<td class="activity-stamp">' + fmtActivity(state.lastActivity[emp.code]) + '</td>';
                tr.querySelector('img').addEventListener('error', function () {
                    if (this.dataset.fallback && this.src !== this.dataset.fallback) this.src = this.dataset.fallback;
                });
                tr.querySelector('.edit-project-employee-btn').addEventListener('click', function () {
                    openProjectEmployeeForm(emp);
                });
                tr.querySelector('.pe-hours-btn').addEventListener('click', function () {
                    openPersonHours(emp);
                });
                return tr;
            }

            /* Hours in this project (meeting 05-11-2026, 0:14:17-0:17:49): a person can have their
               own Default Hours here, stronger than the project's (employee < project < the person
               in the project), e.g. a mandor's 8/3 or someone working Saturdays. The column shows
               who is special ("jadi kita bisa tahu nih, ini yang spesial", 0:15:42). The Report
               counts their Daily from it and the client print uses it. Kept in this browser
               (FERIIZ_DATA.saveProjectUserHours) until the API exists. */
            var HOUR_DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            var HOUR_DAY_NAMES = { daily: 'Every day', Sun: 'Sunday', Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday', Sat: 'Saturday' };
            var hoursModal = null;
            var hoursEmp = null;

            function esc(v) {
                return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function num(n) { return String(Math.round((Number(n) || 0) * 100) / 100); }

            // "8/2" for one day of a Default Hours set, "-" when it has no hours (the real logs count).
            function dayHours(d) { return d && Number(d.work) > 0 ? num(d.work) + '/' + num(d.ot) : '-'; }

            // "8/2 every day", or the weekdays grouped: "Sun - · Mon-Fri 8/2 · Sat 8/1".
            function hoursSummary(set) {
                if (!set) return 'real logs';
                if (!set.custom) return dayHours(set.daily) === '-' ? 'real logs' : dayHours(set.daily) + ' every day';
                var days = set.days || {};
                var parts = [];
                var start = 0;
                for (var i = 1; i <= HOUR_DAYS.length; i++) {
                    if (i < HOUR_DAYS.length && dayHours(days[HOUR_DAYS[i]]) === dayHours(days[HOUR_DAYS[start]])) continue;
                    parts.push(HOUR_DAYS[start] + (i - 1 > start ? '-' + HOUR_DAYS[i - 1] : '') + ' ' + dayHours(days[HOUR_DAYS[start]]));
                    start = i;
                }
                return parts.join(' · ');
            }

            function ownHours(emp) { return window.FERIIZ_DATA.projectUserHours(state.project.code, emp.code); }

            function hoursCellHTML(emp) {
                var own = ownHours(emp);
                return own
                    ? '<button type="button" class="pe-hours-btn is-own" title="Own hours in this project. Click to change them.">Own · ' + esc(hoursSummary(own)) + '</button>'
                    : '<button type="button" class="pe-hours-btn" title="' + esc('The project\'s Default Hours: ' + hoursSummary(state.project.defaultHours) + '. Click to give this person their own.') + '">Project default</button>';
            }

            function hoursRow(key, label) {
                return '<div class="project-overtime-day">' + label + '</div>' +
                    '<div class="unit-input"><input type="text" inputmode="decimal" data-hours-day="' + key + '" data-hours-field="work" aria-label="' + HOUR_DAY_NAMES[key] + ' hours"><span class="unit-input-suffix">h</span></div>' +
                    '<div class="unit-input"><input type="text" inputmode="decimal" data-hours-day="' + key + '" data-hours-field="ot" aria-label="' + HOUR_DAY_NAMES[key] + ' overtime"><span class="unit-input-suffix">h</span></div>';
            }

            function buildHoursModal() {
                var head = '<div class="project-overtime-head">Day</div><div class="project-overtime-head">Hours</div><div class="project-overtime-head">Overtime</div>';
                var el = document.createElement('div');
                el.className = 'modal fade';
                el.id = 'personHoursModal';
                el.tabIndex = -1;
                el.setAttribute('aria-labelledby', 'personHoursTitle');
                el.setAttribute('aria-hidden', 'true');
                el.innerHTML =
                    '<div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">' +
                        '<div class="modal-content">' +
                            '<div class="modal-header">' +
                                '<div>' +
                                    '<h2 class="modal-title" id="personHoursTitle">Hours in this project</h2>' +
                                    '<p class="tpl-subtitle" id="personHoursWho"></p>' +
                                '</div>' +
                                '<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>' +
                            '</div>' +
                            '<div class="modal-body">' +
                                '<div class="person-hours-choice" role="radiogroup" aria-label="Hours">' +
                                    '<label class="person-hours-option"><input type="radio" class="form-check-input" name="personHoursMode" value="project">' +
                                        '<span><strong>Follow the project</strong><small id="personHoursProject"></small></span></label>' +
                                    '<label class="person-hours-option"><input type="radio" class="form-check-input" name="personHoursMode" value="own">' +
                                        '<span><strong>Own hours for this person</strong><small>Stronger than the project\'s Default Hours, in this project only.</small></span></label>' +
                                '</div>' +
                                '<div class="person-hours-own" id="personHoursOwn">' +
                                    '<div class="project-overtime-table" id="personHoursDaily" aria-label="Hours of every day">' + head + hoursRow('daily', 'Every day') + '</div>' +
                                    '<label class="project-overtime-custom-toggle"><input type="checkbox" class="form-check-input" id="personHoursCustom"><span>Customize per day</span></label>' +
                                    '<div class="project-overtime-table" id="personHoursDays" aria-label="Hours per day" hidden>' + head +
                                        HOUR_DAYS.map(function (d) { return hoursRow(d, d); }).join('') + '</div>' +
                                    '<p class="project-default-hint">The Report counts a full day (Daily 1) from these hours, and the client print uses them. 0 hours: the real logs count.</p>' +
                                '</div>' +
                                '<div class="import-error" id="personHoursError" role="alert" hidden></div>' +
                            '</div>' +
                            '<div class="modal-footer">' +
                                '<button type="button" class="btn btn-outline" data-bs-dismiss="modal">Cancel</button>' +
                                '<button type="button" class="btn btn-primary" id="personHoursSave">Save</button>' +
                            '</div>' +
                        '</div>' +
                    '</div>';
                document.body.appendChild(el);
                el.querySelectorAll('input[name="personHoursMode"]').forEach(function (radio) { radio.addEventListener('change', syncHoursMode); });
                el.querySelector('#personHoursCustom').addEventListener('change', function () { toggleHoursCustom(this.checked, true); });
                el.querySelector('#personHoursSave').addEventListener('click', saveHours);
                return el;
            }

            function hoursInput(day, field) {
                return hoursModal.querySelector('[data-hours-day="' + day + '"][data-hours-field="' + field + '"]');
            }

            function fillHours(set) {
                var daily = (set && set.daily) || { work: 0, ot: 0 };
                hoursInput('daily', 'work').value = num(daily.work);
                hoursInput('daily', 'ot').value = num(daily.ot);
                HOUR_DAYS.forEach(function (d) {
                    var v = (set && set.days && set.days[d]) || daily;
                    hoursInput(d, 'work').value = num(v.work);
                    hoursInput(d, 'ot').value = num(v.ot);
                });
                hoursModal.querySelector('#personHoursCustom').checked = Boolean(set && set.custom);
                toggleHoursCustom(Boolean(set && set.custom), false);
            }

            // As in Project Detail: ticking it, days never set apart start from Every day.
            function toggleHoursCustom(on, fromToggle) {
                var same = function (f) { return HOUR_DAYS.every(function (d) { return hoursInput(d, f).value === hoursInput('Sun', f).value; }); };
                if (fromToggle && on && same('work') && same('ot')) {
                    HOUR_DAYS.forEach(function (d) {
                        hoursInput(d, 'work').value = hoursInput('daily', 'work').value;
                        hoursInput(d, 'ot').value = hoursInput('daily', 'ot').value;
                    });
                }
                hoursModal.querySelector('#personHoursDaily').hidden = on;
                hoursModal.querySelector('#personHoursDays').hidden = !on;
            }

            function syncHoursMode() {
                hoursModal.querySelector('#personHoursOwn').hidden = !hoursModal.querySelector('input[name="personHoursMode"][value="own"]').checked;
                showHoursError('');
            }

            function showHoursError(message, input) {
                var box = hoursModal.querySelector('#personHoursError');
                box.textContent = message || '';
                box.hidden = !message;
                if (input) input.focus();
            }

            // "8", "1.5" or "1,5" -> hours; empty -> 0; anything else -> NaN.
            function readHoursValue(input) {
                var text = String(input.value || '').trim().replace(',', '.');
                if (!text) return 0;
                var n = Number(text);
                return Number.isFinite(n) ? Math.round(n * 100) / 100 : NaN;
            }

            // The set to save, or null once the first wrong field is shown (Project Detail's checks).
            function readHoursSet() {
                var custom = hoursModal.querySelector('#personHoursCustom').checked;
                var set = { custom: custom, daily: null, days: {} };
                var keys = ['daily'].concat(HOUR_DAYS);
                for (var i = 0; i < keys.length; i++) {
                    var key = keys[i];
                    var workIn = hoursInput(key, 'work'), otIn = hoursInput(key, 'ot');
                    var work = readHoursValue(workIn), ot = readHoursValue(otIn);
                    var name = HOUR_DAY_NAMES[key];
                    if ((key === 'daily') !== custom) {
                        if (!(work >= 0 && work <= 24)) { showHoursError(name + ': hours must be a number from 0 to 24.', workIn); return null; }
                        if (!(ot >= 0 && ot <= 24)) { showHoursError(name + ': overtime must be a number from 0 to 24.', otIn); return null; }
                        if (work + ot > 24) { showHoursError(name + ': hours and overtime add up to more than 24.', otIn); return null; }
                        if (!work && ot) { showHoursError(name + ' has overtime but no hours. Set its hours, or set both to 0.', workIn); return null; }
                    }
                    var day = { work: work >= 0 ? work : 0, ot: ot >= 0 ? ot : 0 };
                    if (key === 'daily') set.daily = day;
                    else set.days[key] = day;
                }
                return set;
            }

            function openPersonHours(emp) {
                if (!hoursModal) hoursModal = buildHoursModal();
                hoursEmp = emp;
                var own = ownHours(emp);
                hoursModal.querySelector('#personHoursWho').textContent = emp.name + (emp.occupation ? ' · ' + emp.occupation : '') + ' · ' + state.project.name;
                hoursModal.querySelector('#personHoursProject').textContent = 'The project\'s Default Hours: ' + hoursSummary(state.project.defaultHours) + '.';
                hoursModal.querySelector('input[name="personHoursMode"][value="' + (own ? 'own' : 'project') + '"]').checked = true;
                fillHours(own || state.project.defaultHours);
                syncHoursMode();
                window.bootstrap.Modal.getOrCreateInstance(hoursModal).show();
            }

            function saveHours() {
                var own = hoursModal.querySelector('input[name="personHoursMode"][value="own"]').checked;
                var set = null;
                if (own) {
                    set = readHoursSet();
                    if (!set) return;
                }
                window.FERIIZ_DATA.saveProjectUserHours(state.project.code, hoursEmp.code, set);
                window.bootstrap.Modal.getInstance(hoursModal).hide();
                renderPage();
                if (window.FeriizNotify) {
                    window.FeriizNotify.success(own
                        ? hoursEmp.name + ' has own hours in this project: ' + hoursSummary(set) + '.'
                        : hoursEmp.name + ' follows the project\'s Default Hours again.', 'Hours saved');
                }
            }

            function copyFormValues(target, v) {
                ['firstName', 'middleName', 'lastName', 'occupation', 'pin', 'phone', 'email', 'gender', 'birthDate', 'note', 'status', 'role',
                 'workingDays', 'dailyRate', 'overtimeRate', 'clientDailyRate', 'clientOvertimeRate', 'transportPerDay'].forEach(function (k) {
                    target[k] = v[k];
                });
                target.name = v.name;
                target.workStart = v.startHour;
                target.workEnd = v.endHour;
                target.cutOff = v.cutOff;
                return target;
            }

            // Edit and add both use the shared employee form (assets/js/employee-form.js).
            function openProjectEmployeeForm(emp, prefillName) {
                window.FeriizEmployeeForm.open({
                    employee: emp,
                    project: state.project,
                    prefillName: prefillName,
                    onSave: function (v, isNew) {
                        if (isNew) {
                            var added = copyFormValues({
                                code: 'NEW' + Date.now().toString(36).toUpperCase(),
                                projects: [state.project.code]
                            }, v);
                            state.all.unshift(added);
                            var stat = document.querySelector('[data-stat="employees"]');
                            if (stat) stat.textContent = state.all.length.toLocaleString('id-ID');
                            applyFilter();
                        } else {
                            copyFormValues(emp, v);
                            renderPage();
                        }
                    }
                });
            }
            // Manage Employees ("+ Add New Employee") lives outside this closure.
            window.addProjectEmployee = function (name) { openProjectEmployeeForm(null, name); };

            function renderPage() {
                var tbody = document.getElementById('projectEmployeesTableBody');
                tbody.innerHTML = '';
                document.querySelectorAll('th.col-activity-photos').forEach(function (header) {
                    header.classList.toggle('col-activity-visible', state.filters.showActivity);
                });
                var start = (state.page - 1) * state.perPage;
                var end = Math.min(start + state.perPage, state.filtered.length);
                for (var i = start; i < end; i++) tbody.appendChild(renderRow(state.filtered[i]));
                var info = document.getElementById('pePaginationInfo');
                info.textContent = state.filtered.length === 0
                    ? 'No employees match your filter'
                    : 'Showing ' + (start + 1) + ' - ' + end + ' of ' + state.filtered.length + ' results';
                renderPagination();
            }

            function renderPagination() {
                var total = Math.ceil(state.filtered.length / state.perPage) || 1;
                var cur = state.page;
                var box = document.getElementById('pePaginationButtons');
                box.innerHTML = '';
                var prev = document.createElement('button');
                prev.textContent = '< Previous'; prev.disabled = cur === 1;
                prev.addEventListener('click', function () { if (cur > 1) { state.page--; renderPage(); } });
                box.appendChild(prev);
                var pages = new Set([1, total]);
                for (var i = cur - 2; i <= cur + 2; i++) if (i > 1 && i < total) pages.add(i);
                var sorted = Array.from(pages).sort(function(a,b){return a-b;});
                var last = 0;
                sorted.forEach(function (n) {
                    if (last && n - last > 1) {
                        var d = document.createElement('span'); d.className = 'page-dots'; d.textContent = '...'; box.appendChild(d);
                    }
                    var a = document.createElement('a');
                    a.href = '#'; a.textContent = n;
                    if (n === cur) { a.className = 'active'; a.setAttribute('aria-current','page'); }
                    a.addEventListener('click', function (e) { e.preventDefault(); state.page = n; renderPage(); });
                    box.appendChild(a);
                    last = n;
                });
                var next = document.createElement('a');
                next.href = '#'; next.textContent = 'Next >';
                if (cur === total) next.style.display = 'none';
                next.addEventListener('click', function (e) { e.preventDefault(); if (cur < total) { state.page++; renderPage(); } });
                box.appendChild(next);
            }

            function applyFilter() {
                var occs = state.filters.occupations;
                var q = (document.querySelector('.feriiz-u-020 input')?.value || '').trim().toLowerCase();
                state.filtered = state.all.filter(function (emp) {
                    // Exact match: "Surveyor" must not also pick "Quantity Surveyor".
                    if (occs.length && occs.indexOf((emp.occupation || '').trim().toLowerCase()) < 0) return false;
                    if (q && (emp.name.toLowerCase().indexOf(q) < 0 && emp.code.toLowerCase().indexOf(q) < 0)) return false;
                    var activityDate = (state.lastActivity[emp.code] || '').slice(0, 10);
                    if (state.filters.dateStart && (!activityDate || activityDate < state.filters.dateStart)) return false;
                    if (state.filters.dateEnd && (!activityDate || activityDate > state.filters.dateEnd)) return false;
                    return true;
                });
                state.page = 1;
                renderPage();
            }

            function commitFilterDraft() {
                var dates = document.querySelectorAll('.filter-date');
                state.filters = {
                    occupations: window.FeriizFilters?.getOccupationValues(document) || [],
                    dateStart: dates[0] ? dates[0].value : '',
                    dateEnd: dates[1] ? dates[1].value : '',
                    showActivity: Boolean(document.getElementById('absenceToggle')?.checked)
                };
            }

            document.addEventListener('DOMContentLoaded', function () {
                if (!window.FERIIZ_DATA) return;
                var url = new URL(location.href);
                var projectCode = url.searchParams.get('project');
                window.FERIIZ_DATA.ready.then(function (data) {
                    state.project = projectCode
                        ? data.findProjectByCode(projectCode)
                        : data.projects[0];
                    if (!state.project) state.project = data.projects[0];
                    document.querySelector('[data-project-name]').textContent = state.project.name;
                    document.title = 'Feriiz - ' + state.project.name + ' - Activity';
                    state.all = data.employees.filter(function (e) {
                        return (e.projects || []).indexOf(state.project.code) >= 0;
                    });
                    window.FeriizFilters?.setOccupationPeople(state.all);
                    data.attendance.forEach(function (record) {
                        if (record.projectCode !== state.project.code || (!record.inTime && !record.outTime)) return;
                        var code = record.employeeCode;
                        var first = record.date + ' ' + (record.inTime || record.outTime);
                        var last = record.date + ' ' + (record.outTime || record.inTime);
                        if (!state.firstActivity[code] || first < state.firstActivity[code]) state.firstActivity[code] = first;
                        if (!state.lastActivity[code] || last > state.lastActivity[code]) state.lastActivity[code] = last;
                    });
                    state.filtered = state.all.slice();
                    var occSet = new Set(state.all.map(function (e) { return e.occupation; }));
                    var setStat = function (k, v) {
                        var el = document.querySelector('[data-stat="' + k + '"]');
                        if (el) el.textContent = v.toLocaleString('id-ID');
                    };
                    setStat('employees', state.all.length);
                    setStat('attendance', state.all.length);
                    setStat('occupations', occSet.size);
                    renderPage();

                    var apply = document.querySelector('.filter-apply-btn');
                    var clear = document.querySelector('.filter-clear-btn');
                    var searchInp = document.querySelector('.feriiz-u-020 input');
                    if (apply) apply.addEventListener('click', function () {
                        commitFilterDraft();
                        applyFilter();
                    });
                    if (clear) clear.addEventListener('click', function () {
                        window.FeriizFilters?.resetOccupationFilter(document);
                        document.querySelectorAll('.filter-date').forEach(function (input) { input.value = ''; });
                        var activityToggle = document.getElementById('absenceToggle');
                        if (activityToggle) activityToggle.checked = false;
                        if (searchInp) searchInp.value = '';
                        state.filters = { occupations: [], dateStart: '', dateEnd: '', showActivity: false };
                        applyFilter();
                    });
                    if (searchInp) {
                        var timer;
                        searchInp.addEventListener('input', function () {
                            clearTimeout(timer); timer = setTimeout(applyFilter, 200);
                        });
                    }
                });
            });
        })();
        </script>

    <script>
        // Manage Employee Modal
        function openManageEmpModal() {
            document.getElementById('manageEmpModal').classList.add('show');
            document.body.style.overflow = 'hidden';
            // Initialize selected count on open
            if (typeof updateSelectedCount === 'function') updateSelectedCount();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('manageEmpModal');
            if (modal) {
                modal.addEventListener('click', function (e) {
                    if (e.target === this) closeManageEmpModal();
                });
            }

            // Search filter with autocomplete
            const searchInput = document.getElementById('manageEmpSearch');
            const acDropdown = document.getElementById('searchAutocomplete');

            if (searchInput && acDropdown) {
                searchInput.addEventListener('input', function () {
                    const query = this.value.trim().toLowerCase();

                    // Build autocomplete suggestions (list behind stays unchanged)
                    if (query.length === 0) {
                        acDropdown.classList.remove('show');
                        return;
                    }

                    const allCbs = document.querySelectorAll('.manage-emp-cb');
                    let html = '';
                    let matchCount = 0;

                    allCbs.forEach(cb => {
                        const name = cb.dataset.name;
                        const code = cb.dataset.code;
                        if (name.toLowerCase().includes(query)) {
                            matchCount++;
                            if (matchCount <= 6) { // Max 6 suggestions
                                const idx = name.toLowerCase().indexOf(query);
                                const highlighted = name.substring(0, idx) +
                                    '<strong>' + name.substring(idx, idx + query.length) + '</strong>' +
                                    name.substring(idx + query.length);
                                html += '<div class="ac-item" data-code="' + code + '">' +
                                    highlighted + '<span class="ac-code">( ' + code + ' )</span></div>';
                            }
                        }
                    });

                    // Always add "+ Add New Employee" at the bottom
                    html += '<div class="ac-add" id="acAddNewBtn"><i class="fa-solid fa-plus"></i> Add New Employee</div>';

                    acDropdown.innerHTML = html;
                    acDropdown.classList.add('show');

                    // Click handlers for suggestion items
                    acDropdown.querySelectorAll('.ac-item').forEach(item => {
                        item.addEventListener('click', function () {
                            const code = this.dataset.code;
                            const targetCb = document.querySelector('.manage-emp-cb[data-code="' + code + '"]');
                            if (targetCb) {
                                const targetLabel = targetCb.closest('label');
                                searchInput.value = '';
                                acDropdown.classList.remove('show');
                                // Scroll to and highlight the employee
                                targetLabel.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                targetLabel.classList.add('manage-emp-highlight');
                                setTimeout(() => targetLabel.classList.remove('manage-emp-highlight'), 1500);
                            }
                        });
                    });

                    // Click handler for "+ Add New Employee" â†’ open Add Employee form
                    const addBtn = document.getElementById('acAddNewBtn');
                    if (addBtn) {
                        addBtn.addEventListener('click', function () {
                            const searchText = searchInput.value.trim();
                            acDropdown.classList.remove('show');
                            searchInput.value = '';
                            window.addProjectEmployee(searchText);
                        });
                    }
                });

                // Close autocomplete when clicking outside
                document.addEventListener('click', function (e) {
                    if (!searchInput.contains(e.target) && !acDropdown.contains(e.target)) {
                        acDropdown.classList.remove('show');
                    }
                });

                // Close autocomplete on Escape
                searchInput.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') {
                        acDropdown.classList.remove('show');
                    }
                });
            }
        });

    </script>

    <script>
        // Manage Employee JS Logic

        // Update selected employee count and save button state
        function updateSelectedCount() {
            const checkboxes = document.querySelectorAll('.manage-emp-cb');
            const saveBtn = document.getElementById('saveChangesBtn');
            const countEl = document.getElementById('selectedEmpCount');
            let count = 0;
            checkboxes.forEach(cb => { if (cb.checked) count++; });
            if (countEl) countEl.textContent = count;
            // Enable save if at least 1 is selected
            if (saveBtn) {
                if (count > 0) {
                    saveBtn.style.opacity = '1';
                    saveBtn.style.pointerEvents = 'auto';
                } else {
                    saveBtn.style.opacity = '0.5';
                    saveBtn.style.pointerEvents = 'none';
                }
            }
        }

        // Filter: All / Assigned / Unassigned + Search Validation
        function applyAllEmpFilters() {
            const filter = document.getElementById('assignedFilter').value;
            const searchInput = document.getElementById('manageEmpSearch');
            const searchQuery = searchInput ? searchInput.value.toLowerCase() : '';
            const labels = document.querySelectorAll('#manageEmpList > label');

            let visibleCount = 0;
            const totalCountEl = document.getElementById('totalEmpCount');
            const isUnassignedFilter = (filter === 'unassigned');

            labels.forEach(label => {
                const cb = label.querySelector('.manage-emp-cb');
                if (!cb) return;

                const name = cb.dataset.name.toLowerCase();
                const occupation = (cb.dataset.occupation || '').toLowerCase();
                const matchesSearch = searchQuery === '' || name.includes(searchQuery) || occupation.includes(searchQuery);
                const matchesFilter =
                    filter === 'all' ||
                    (filter === 'assigned' && cb.checked) ||
                    (filter === 'unassigned' && !cb.checked);

                if (matchesSearch && matchesFilter) {
                    label.style.display = 'flex';
                    visibleCount++;
                } else {
                    label.style.display = 'none';
                }
            });

            // Adjust visual hint based on active filter state
            const totalLabel = document.getElementById('totalEmpLabel');
            const totalSuffix = document.getElementById('totalEmpSuffix');
            if (totalCountEl && totalLabel && totalSuffix) {
                if (isUnassignedFilter) {
                    totalLabel.textContent = 'Showing ';
                    totalCountEl.textContent = visibleCount;
                    totalSuffix.textContent = 'Unassigned';
                } else if (filter === 'assigned') {
                    totalLabel.textContent = 'Total: ';
                    totalCountEl.textContent = visibleCount;
                    totalSuffix.textContent = 'People';
                } else {
                    totalLabel.textContent = 'Total: ';
                    totalCountEl.textContent = visibleCount;
                    totalSuffix.textContent = 'People';
                }
            }
        }

        // Attach checkbox listeners on page load
        document.addEventListener('DOMContentLoaded', () => {
            const checkboxes = document.querySelectorAll('.manage-emp-cb');
            const codeArea = document.getElementById('empCodeArea');
            checkboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    updateSelectedCount();
                    // Re-apply filter when checkbox state changes
                    applyAllEmpFilters();
                });
            });

            if (codeArea) {
                codeArea.addEventListener('input', () => {
                    resetImportVerificationState(true);
                });
            }

            // Each person's occupation at the end of the row (meeting 05-11-2026, 1:10:04:
            // "nge-manage employee, tambahin kolom"); the search finds it too.
            if (window.FERIIZ_DATA) window.FERIIZ_DATA.ready.then(data => {
                checkboxes.forEach(cb => {
                    const emp = data.findEmployeeByCode(cb.dataset.code);
                    if (!emp || !emp.occupation) return;
                    cb.dataset.occupation = emp.occupation;
                    const occ = document.createElement('span');
                    occ.className = 'manage-emp-occ';
                    occ.textContent = emp.occupation;
                    cb.closest('label').appendChild(occ);
                });
            });
        });

        function resetImportVerificationState(clearMessage = false) {
            const errorBox = document.getElementById('codeErrorBox');
            const verifyBtn = document.getElementById('verifyDataBtn');

            if (clearMessage && errorBox) {
                errorBox.style.display = 'none';
                errorBox.innerHTML = '';
            }

            if (verifyBtn) {
                verifyBtn.textContent = 'Verify Data';
                verifyBtn.style.background = '#fff';
                verifyBtn.style.color = '#555';
                verifyBtn.style.border = '1px solid #aaa';
                verifyBtn.style.pointerEvents = 'auto';
            }
        }

        function toggleImportArea() {
            const layout = document.getElementById('manageEmpLayout');
            const wrapper = document.getElementById('importAreaWrapper');
            const btn = document.getElementById('importCodeBtn');

            if (!layout || !wrapper || !btn) return;

            const isHidden = getComputedStyle(wrapper).display === 'none';

            if (isHidden) {
                wrapper.style.display = 'flex';
                layout.style.gridTemplateColumns = '1.4fr 1fr';
                btn.style.display = 'none';
            }
        }

        function verifyEmployeeData() {
            const area = document.getElementById('empCodeArea');
            const errorBox = document.getElementById('codeErrorBox');
            const checkboxes = document.querySelectorAll('.manage-emp-cb');
            const verifyBtn = document.getElementById('verifyDataBtn');
            const lines = area.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);

            // Reset error box
            errorBox.style.display = 'none';
            errorBox.innerHTML = '';
            errorBox.style.background = '#fff2f4';
            errorBox.style.borderColor = '#ffccd3';
            errorBox.style.color = '#de3a46';

            // Reset verify button
            resetImportVerificationState();

            if (lines.length === 0) {
                errorBox.innerHTML = 'Please enter at least one employee code.';
                errorBox.style.display = 'block';
                return;
            }

            let invalidCodes = [];

            lines.forEach(code => {
                let found = false;
                checkboxes.forEach(cb => {
                    if (cb.getAttribute('data-code') === code) {
                        cb.checked = true;
                        found = true;
                    }
                });
                if (!found) {
                    invalidCodes.push(code);
                }
            });

            if (invalidCodes.length > 0) {
                // Error: show red notification
                errorBox.innerHTML = '<b>Verification Failed:</b><br/>The following codes are invalid or employee inactive:<br/>- ' + invalidCodes.join('<br/>- ') + '<br/><br/>Please fix the codes to proceed.';
                errorBox.style.display = 'block';
            } else {
                // Success: just turn button green, NO notification
                errorBox.style.display = 'none';
                verifyBtn.innerHTML = '<i class="fa-solid fa-check feriiz-u-303"></i> Verified';
                verifyBtn.style.background = '#2ecc71';
                verifyBtn.style.color = '#fff';
                verifyBtn.style.border = '1px solid #2ecc71';
                verifyBtn.style.pointerEvents = 'none';

                // Move checked elements to the top of the list - REMOVED to preserve A-Z Order
            }

            // Update count and save button state
            updateSelectedCount();
            applyAllEmpFilters();
        }

        function closeManageEmpModal() {
            const modal = document.getElementById('manageEmpModal');
            if (modal) modal.classList.remove('show');
            document.body.style.overflow = '';

            // Reset state
            const layout = document.getElementById('manageEmpLayout');
            const wrapper = document.getElementById('importAreaWrapper');
            const btn = document.getElementById('importCodeBtn');
            const area = document.getElementById('empCodeArea');
            const errorBox = document.getElementById('codeErrorBox');
            const verifyBtn = document.getElementById('verifyDataBtn');
            const saveBtn = document.getElementById('saveChangesBtn');
            const checkboxes = document.querySelectorAll('.manage-emp-cb');
            const filter = document.getElementById('assignedFilter');

            if (layout) {
                layout.style.gridTemplateColumns = '1fr';
                wrapper.style.display = 'none';
                btn.style.display = 'block';
                area.value = '';
                errorBox.style.display = 'none';
                errorBox.style.background = '#fff2f4';
                errorBox.style.borderColor = '#ffccd3';
                errorBox.style.color = '#de3a46';
                resetImportVerificationState();
                if (saveBtn) {
                    saveBtn.style.opacity = '1';
                    saveBtn.style.pointerEvents = 'auto';
                }
                checkboxes.forEach(cb => cb.checked = cb.defaultChecked);
                // Reset filter to "All"
                if (filter) filter.value = 'all';
                // Reset search
                const searchInput = document.getElementById('manageEmpSearch');
                if (searchInput) searchInput.value = '';
                // Reset visibility based on empty filters again
                applyAllEmpFilters();
                // Reset selected count to original assigned count
                updateSelectedCount();
            }
        }

        function saveManagedEmployees() {
            const selected = document.querySelectorAll('.manage-emp-cb:checked').length;
            closeManageEmpModal();
            if (window.FeriizNotify) {
                FeriizNotify.success(selected + ' employees are now assigned to this project.', 'Employee assignments saved');
            }
        }
    </script>
</body>



</html>
