<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feriiz - Projects</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/customize.css?v=3.7.103">
    <link rel="stylesheet" href="assets/css/style.css?v=3.7.103">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="assets/js/data.js?v=3.7.103" defer></script>
    <script src="assets/js/app.js?v=3.7.103" defer></script>
</head>

<body data-page="projects">
    <!-- Sidebar -->
    <aside class="sidebar"></aside>

    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">Projects</h1>
            <div class="page-actions">
                <button class="btn btn-primary" type="button" id="addProjectBtn">
                    <i class="fa-solid fa-plus"></i>
                    Add Project
                </button>
                <div class="feriiz-u-020">
                    <i class="fa-solid fa-magnifying-glass feriiz-u-067"
                       ></i>
                    <input type="text" placeholder="Search" class="feriiz-u-068">
                </div>
            </div>
        </div>

        <div class="stat-cards feriiz-u-023">
            <div class="stat-card feriiz-u-187">
                <div class="stat-card-icon feriiz-u-025">
                    <i class="fa-solid fa-folder"></i>
                </div>
                <div class="stat-card-info">
                    <div class="stat-number feriiz-u-026" data-stat="projects">0</div>
                    <div class="stat-label feriiz-u-165">Projects</div>
                </div>
            </div>
            <div class="stat-card feriiz-u-187">
                <div class="stat-card-icon feriiz-u-025">
                    <i class="fa-regular fa-folder-open"></i>
                </div>
                <div class="stat-card-info">
                    <div class="stat-number feriiz-u-026" data-stat="projects-active">0</div>
                    <div class="stat-label feriiz-u-027">Active</div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="feriiz-u-028"></th>
                        <th>Name</th>
                        <th>Status</th>
                        <th>First Activity</th>
                        <th>Last Activity</th>
                        <th>Employee</th>
                    </tr>
                </thead>
                <tbody id="projectsTableBody"></tbody>
            </table>
            <div class="table-pager">
                <div class="pagination-info" data-pagination-info>Showing 0 results</div>
                <nav id="projectsPager" aria-label="Project pages"></nav>
            </div>
        </div>
        <div class="feriiz-u-032">version : 3.7.103</div>
    </main>

    <!-- Project Modal Overlay -->
    <div class="modal-overlay" id="projectModal">
        <div class="modal-card feriiz-u-192"
           >
            <div class="modal-header feriiz-u-193"
               >
                <h2 id="projectModalTitle" class="feriiz-u-194">Add Project</h2>
                <button class="modal-close feriiz-u-195" onclick="closeProjectModal()"
                   >&times;</button>
            </div>

            <div class="modal-body feriiz-u-196">

                <!-- LEFT COLUMN -->
                <div>
                    <!-- Project Info -->
                    <div class="mb-4">
                        <h3 class="feriiz-u-197">
                            Project Info</h3>
                        <div class="feriiz-u-198">
                            <div>
                                <label class="feriiz-u-199" for="projNameInput">Project
                                    Name</label>
                                <input type="text" id="projNameInput" class="input feriiz-u-200" value="Anomali" placeholder="Project Name"
                                   >
                            </div>
                            <div>
                                <label class="feriiz-u-199" for="projCodeInput">Project
                                    Code</label>
                                <input type="text" id="projCodeInput" class="input feriiz-u-200" value="ANM001" placeholder="Project Code"
                                   >
                            </div>
                        </div>
                        <div class="feriiz-u-198">
                            <div>
                                <label class="feriiz-u-199" for="projTypeInput">Type</label>
                                <select id="projTypeInput" class="select feriiz-u-201"
                                   >
                                    <option>Attendance</option>
                                    <option>Vision</option>
                                </select>
                            </div>
                            <div>
                                <label class="feriiz-u-199" for="projDescInput">Description</label>
                                <input type="text" id="projDescInput" class="input feriiz-u-200" value="Attendance" placeholder="Description"
                                   >
                            </div>
                        </div>
                    </div>

                    <div id="projectLeftAdvanced">
                        <!-- Working Time -->
                        <div class="mb-4">
                            <h3 class="feriiz-u-202">
                                Working Time</h3>
                            <div class="project-working-hour-grid">
                                <div><label class="feriiz-u-203" for="projStartHour">Start Hour</label>
                                    <input type="text" id="projStartHour" placeholder="08:00"></div>
                                <div><label class="feriiz-u-203" for="projEndHour">End Hour</label>
                                    <input type="text" id="projEndHour" placeholder="17:00"></div>
                                <div><label class="feriiz-u-203" for="projCutOffHour">Cut Off Hour</label>
                                    <input type="text" id="projCutOffHour" placeholder="23:59"></div>
                            </div>
                        </div>

                        <!-- No Default Hours here since 10-11-2026: each occupation has its own on the
                             project's Settings page ("karna udah ada di dalam setiap project, maka ini di
                             hapus yang ada di form nya"). -->
                    </div>
                </div>

                <!-- RIGHT COLUMN -->
                <div id="projectAdvancedContent">
                    <!-- Check In Tolerance -->
                    <div class="mb-4">
                        <h3 class="feriiz-u-202">
                            Check In/Out Tolerance</h3>
                        <div class="project-tolerance-grid">
                            <div>
                                <label class="feriiz-u-203" for="tolCheckInBefore">Check In
                                    Before</label>
                                <div class="unit-input"><input type="text" id="tolCheckInBefore" value="0" inputmode="numeric" class="feriiz-u-205"><span class="unit-input-suffix">m</span></div>
                                <label class="feriiz-u-203" for="tolCheckInAfter">Check In
                                    After</label>
                                <div class="unit-input"><input type="text" id="tolCheckInAfter" value="0" inputmode="numeric" class="feriiz-u-205"><span class="unit-input-suffix">m</span></div>
                            </div>
                            <div>
                                <label class="feriiz-u-203" for="tolCheckOutBefore">Check Out
                                    Before</label>
                                <div class="unit-input"><input type="text" id="tolCheckOutBefore" value="0" inputmode="numeric" class="feriiz-u-205"><span class="unit-input-suffix">m</span></div>
                                <label class="feriiz-u-203" for="tolCheckOutAfter">Check Out
                                    After</label>
                                <div class="unit-input"><input type="text" id="tolCheckOutAfter" value="0" inputmode="numeric" class="feriiz-u-205"><span class="unit-input-suffix">m</span></div>
                            </div>
                        </div>
                    </div>

                    <!-- Penalty & Config -->
                    <div>
                        <button type="button" class="project-config-toggle" onclick="toggleProjectPenaltyConfig(this)">
                            <span>Show Penalty & Config</span>
                            <i class="fa-solid fa-chevron-down"></i>
                        </button>
                        <div id="projectPenaltyConfig" class="project-penalty-config" hidden>
                            <div class="feriiz-u-198">
                                <div>
                                    <label class="feriiz-u-203" for="penaltyForgot">Forgot
                                        Check In/Out</label>
                                    <input type="text" id="penaltyForgot" placeholder="Forgot Check In/Out" class="feriiz-u-204">
                                </div>
                                <div>
                                    <label class="feriiz-u-203" for="penaltyLate">Early/Late
                                        Check In/Out</label>
                                    <input type="text" id="penaltyLate" placeholder="Early/Late Check In/Out" class="feriiz-u-204">
                                </div>
                            </div>
                            <div class="feriiz-u-206">
                                <label class="feriiz-u-207">
                                    <input type="checkbox" class="feriiz-u-208">
                                    Time Strict
                                </label>
                                <label class="feriiz-u-207">
                                    <input type="checkbox" class="feriiz-u-208">
                                    Overtime Strict
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="projectModalFooter" class="feriiz-u-209">
                <button class="btn btn-outline feriiz-u-210" onclick="closeProjectModal()"
                   >Cancel</button>
                <button class="btn btn-primary feriiz-u-211" onclick="saveProjectChanges()"
                   >Save
                    Changes</button>
            </div>
        </div>
    </div>

    <script>
        var editingProject = null;

        function openProjectModal(project) {
            const modal = document.getElementById('projectModal');
            const titleEl = document.getElementById('projectModalTitle');
            const pName = document.getElementById('projNameInput');
            const pCode = document.getElementById('projCodeInput');
            const pAdvContent = document.getElementById('projectAdvancedContent');
            const pAdvLeft = document.getElementById('projectLeftAdvanced');
            const footer = document.getElementById('projectModalFooter');

            const isAddProject = !project;
            titleEl.textContent = isAddProject ? 'Add Project' : 'Project Detail';

            editingProject = project || null;
            pName.value = project ? project.name : '';
            if (pCode) {
                pCode.value = project ? project.code : '';
                pCode.readOnly = !!project;   // the code links attendance and reports
            }
            document.getElementById('projTypeInput').value = (project && project.type) || 'Attendance';
            document.getElementById('projStartHour').value = (project && project.workStart) || '';
            document.getElementById('projEndHour').value = (project && project.workEnd) || '';
            document.getElementById('projCutOffHour').value = (project && project.cutOff) || '';
            if (pAdvContent) pAdvContent.style.display = '';
            if (pAdvLeft) pAdvLeft.style.display = '';
            if (footer) footer.style.display = 'flex';
            resetProjectPenaltyConfig();


            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function resetProjectPenaltyConfig() {
            const panel = document.getElementById('projectPenaltyConfig');
            const button = document.querySelector('#projectModal .project-config-toggle');
            if (!panel || !button) return;

            panel.hidden = true;
            button.classList.remove('is-open');
            const text = button.querySelector('span');
            if (text) text.textContent = 'Show Penalty & Config';
        }

        function toggleProjectPenaltyConfig(button) {
            const panel = document.getElementById('projectPenaltyConfig');
            if (!panel) return;

            const isOpening = panel.hidden;
            panel.hidden = !isOpening;
            button.classList.toggle('is-open', isOpening);
            const text = button.querySelector('span');
            if (text) text.textContent = isOpening ? 'Hide Penalty & Config' : 'Show Penalty & Config';
        }

        function closeProjectModal() {
            document.getElementById('projectModal').classList.remove('show');
            document.body.style.overflow = '';
        }

        function saveProjectChanges() {
            const title = document.getElementById('projectModalTitle');
            const nameInput = document.getElementById('projNameInput');
            const codeInput = document.getElementById('projCodeInput');
            const isNew = title && title.textContent === 'Add Project';
            const name = nameInput ? nameInput.value.trim() : '';
            const code = codeInput ? codeInput.value.trim() : '';

            if (!name || !code) {
                if (!name && nameInput) nameInput.focus();
                else if (codeInput) codeInput.focus();
                if (window.FeriizNotify) {
                    FeriizNotify.warning('Project name and project code are required.', 'Project not saved');
                }
                return;
            }

            if (isNew && projectList.some(function (p) { return p.code === code; })) {
                if (codeInput) codeInput.focus();
                if (window.FeriizNotify) FeriizNotify.warning(code + ' is already used by another project.', 'Project not saved');
                return;
            }
            // Kept in memory until the API saves projects; the Working Time is also kept in this
            // browser, so the Report uses it. Default Hours are per occupation on the project's
            // Settings page (Baldy, 10-11-2026); this form leaves them as they are.
            var target = isNew ? { code: code, status: 'Active', employeeCount: 0, createdAt: new Date().toISOString() } : editingProject;
            if (target) {
                target.name = name;
                target.type = document.getElementById('projTypeInput').value;
                target.workStart = document.getElementById('projStartHour').value || target.workStart;
                target.workEnd = document.getElementById('projEndHour').value || target.workEnd;
                target.cutOff = document.getElementById('projCutOffHour').value || target.cutOff;
                if (isNew) projectList.unshift(target);
                if (window.FERIIZ_DATA && window.FERIIZ_DATA.saveProjectSettings) {
                    window.FERIIZ_DATA.saveProjectSettings(code, {
                        workStart: target.workStart, workEnd: target.workEnd, cutOff: target.cutOff
                    });
                }
                refreshProjects();
            }
            closeProjectModal();
            if (window.FeriizNotify) {
                FeriizNotify.success(name + (isNew ? ' was added successfully.' : ' was updated successfully.'), isNew ? 'Project added' : 'Project updated');
            }
        }

        document.getElementById('projectModal').addEventListener('click', function (e) {
            if (e.target === this) closeProjectModal();
        });
    </script>


    <script>
        var projectList = [];

        function refreshProjects() {
            var active = projectList.filter(function (p) { return (p.status || 'Active') === 'Active'; }).length;
            var setStat = function (key, value) {
                var el = document.querySelector('[data-stat="' + key + '"]');
                if (el) el.textContent = value;
            };
            setStat('projects', projectList.length);
            setStat('projects-active', active);
            var info = document.querySelector('[data-pagination-info]');
            if (info) info.textContent = 'Showing 1 - ' + projectList.length + ' of ' + projectList.length + ' results';
            FeriizPager.render(document.getElementById('projectsPager'), 1, 1);   // every project fits on one page
            renderProjectsTable(projectList);
        }

        function formatProjectDate(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            if (isNaN(d)) return '-';
            const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            const day = d.getDate().toString().padStart(2,'0');
            const month = months[d.getMonth()];
            const yr = d.getFullYear();
            const hh = d.getHours();
            const mm = d.getMinutes().toString().padStart(2,'0');
            const am = hh >= 12 ? 'pm' : 'am';
            const h12 = hh % 12 || 12;
            return day + ' ' + month + ' ' + yr + ', ' + h12 + ':' + mm + am;
        }

        // Same pill as the Dashboard. A project is only Active (green) or Inactive (grey) (Baldy, 30-10-2026).
        function statusPill(status) {
            var active = (status || 'Active').toLowerCase() === 'active';
            return '<span class="status-pill status-pill--' + (active ? 'active' : 'inactive') + '">' + (active ? 'Active' : 'Inactive') + '</span>';
        }

        function renderProjectsTable(projects) {
            const tbody = document.getElementById('projectsTableBody');
            tbody.innerHTML = '';
            projects.forEach(p => {
                const tr = document.createElement('tr');
                tr.className = 'project-clickable-row';
                tr.dataset.href = 'project_employees.html?project=' + encodeURIComponent(p.code);
                tr.innerHTML =
                    '<td>' +
                        '<div class="action-cell">' +
                            '<a href="#" class="btn-icon" title="Edit"><i class="fa-solid fa-pen-to-square"></i></a>' +
                            '<a href="' + tr.dataset.href + '" class="btn-icon" title="View"><i class="fa-solid fa-chevron-right"></i></a>' +
                        '</div>' +
                    '</td>' +
                    '<td><div class="fw-semibold">' + p.name + '</div><div class="feriiz-u-189">' + p.code + '</div></td>' +
                    '<td>' + statusPill(p.status) + '</td>' +
                    // No activity yet -> fall back to when the project was created.
                    '<td>' + formatProjectDate(p.startedAt || p.createdAt) + '</td>' +
                    '<td>' + formatProjectDate(p.lastActivityAt) + '</td>' +
                    '<td class="feriiz-u-190">' + (p.employeeCount || 0) + '</td>';
                const editBtn = tr.querySelector('a[title="Edit"]');
                editBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    openProjectModal(p);
                });
                tr.addEventListener('click', function (event) {
                    if (event.target.closest('a, button, input, select, textarea')) return;
                    window.location.href = tr.dataset.href;
                });
                tbody.appendChild(tr);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('addProjectBtn').addEventListener('click', () => openProjectModal(null));

            if (!window.FERIIZ_DATA) return;
            window.FERIIZ_DATA.ready.then(data => {
                projectList = data.projects;
                refreshProjects();
            });
        });
    </script>

</body>

</html>
