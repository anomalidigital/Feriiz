<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feriiz - Print preview</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/customize.css?v=3.7.109">
    <link rel="stylesheet" href="assets/css/style.css?v=3.7.109">
    <script src="assets/js/print-report.js?v=3.7.109" defer></script>
    <script src="assets/js/print-preview.js?v=3.7.109" defer></script>
</head>

<!-- The Report's Print opens this tab (06-11-2026). Since 12-11-2026 the paper is exactly what
     prints (shown on A4 landscape; A3 or A2 in the print dialog gets the same sheet, larger),
     and the panel beside it, which stays in view while the paper scrolls, is the one place to
     leave a date's Period or Overtime, a column or a person out. Only the paper reaches the
     printer. -->
<body data-page="print-preview">
    <header class="pp-toolbar">
        <div class="pp-title">
            <h1>Print preview</h1>
            <p id="ppContext"></p>
        </div>
        <div class="pp-actions">
            <div class="pp-mode" id="ppMode" role="group" aria-label="Print for">
                <span class="pp-mode-label">For</span>
                <button type="button" class="pp-day" data-mode="internal" aria-pressed="true">Internal</button>
                <button type="button" class="pp-day" data-mode="client" aria-pressed="false">Client</button>
            </div>
            <button type="button" class="btn btn-outline" id="ppReset">Reset</button>
            <button type="button" class="btn btn-outline" id="ppClose">Close</button>
            <button type="button" class="btn btn-primary" id="ppPrint"><i class="fa-solid fa-print" aria-hidden="true"></i> Print / Save PDF</button>
        </div>
        <p class="pp-summary" id="ppSummary" aria-live="polite"></p>
    </header>

    <main class="pp-stage" id="ppStage">
        <div class="pp-state" id="ppState" role="status">Preparing the print preview…</div>
        <aside class="pp-panel" id="ppPanel" aria-label="What prints" hidden></aside>
        <div class="pp-paper-scroll">
            <div class="pp-paper" id="ppPaper" hidden>
                <div class="report-print-document" id="ppSheet"></div>
            </div>
        </div>
    </main>
</body>

</html>
