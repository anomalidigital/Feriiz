<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feriiz</title>
    <!-- Rewritten by the deploy workflow to "/Feriiz/" for GitHub Pages. -->
    <base href="/" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Poppins',sans-serif;color:#667085;">
            Loading Feriiz…
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:1000;padding:12px 16px;background:#fef3c7;color:#92400e;box-shadow:0 -1px 4px rgba(0,0,0,.15);">
        An unhandled error has occurred.
        <a href="." class="reload" style="margin-left:8px;text-decoration:underline;">Reload</a>
        <span class="dismiss" style="float:right;cursor:pointer;">🗙</span>
    </div>

    <!-- Restores the deep link that 404.html stashed before redirecting here.
         Must run BEFORE blazor.webassembly.js, which reads the URL at boot. -->
    <script>
        (function () {
            var redirect = sessionStorage.getItem('feriiz_spa_redirect');
            if (redirect) {
                sessionStorage.removeItem('feriiz_spa_redirect');
                history.replaceState(null, '', redirect);
            }
        })();
    </script>

    <script src="_framework/blazor.webassembly.js"></script>

</body>

</html>
